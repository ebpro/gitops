# Registry credentials for Kyverno's cosign signature-manifest fetch
# (verify-arc-runner-images policy). Kyverno 1.15 reads
# imageRegistryCredentials.secrets ONLY from the kyverno namespace — hence this
# secret is materialized here, not referenced from arc-runners. Mirrors
# harbor-node-pull-external-secret.yaml exactly: same ClusterSecretStore (vault),
# same read-only robot token path secret/harbor/node-pull (property `config`,
# already a dockerconfigjson whose auths key is the bare host harbor.ebruno.fr),
# same refresh. NO new credentials minted; do not rotate here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-kyverno-pull
  namespace: kyverno
  labels:
    app.kubernetes.io/name: arc
    app.kubernetes.io/component: harbor-image-pull-kyverno
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-kyverno-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ .config }}'
  data:
    - remoteRef:
        key: secret/harbor/node-pull
        property: config
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: config
