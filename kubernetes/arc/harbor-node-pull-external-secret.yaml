apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-node-pull
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: arc
    app.kubernetes.io/component: harbor-image-pull
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-node-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ .config }}'
  data:
    - remoteRef:
        key: secret/harbor/node-pull
        property: config
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: config
