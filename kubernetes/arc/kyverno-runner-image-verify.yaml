# 2026-10-24: verified empirically — arc-selftest run 40049645239 exercised org (x64) and arm (arm64) runner admissions under verifyDigest: true with zero PolicyViolations; all four scale sets pin the same signed digests. Enforce active.
#
# Scope: Pods in arc-runners only (ephemeral runner pods are the ground truth;
# the controller and all listeners run in actions-runner-controller). Only the
# harbor.ebruno.fr/quarkus-microservices/quarkus-ci-runner* glob is matched —
# the docker:28-dind sidecars on org/arm/large pods are UNSIGNED by design and
# must not match, hence they are excluded by the imageReferences filter, not by
# an exclude block. No exclusions needed for runner pods: per the
# kyverno-runner-toleration-policy.yaml evidence, arc-runners contains only
# EphemeralRunner-owned pods, and every one of them now runs a keyless-signed
# build referenced by immutable digest (all four scale sets digest-pinned in
# wave 2c; verifyDigest: true now asserts that invariant in Audit).
#
# Operational prerequisites for verification to actually execute (unmet deps
# surface as audit failures / webhook errors, never as a silent pass):
#   - Kyverno pods need egress to the Sigstore transparency log and trust root
#     distribution: rekor.sigstore.dev (cosign bundle lookup) and the TUF
#     mirror (tuf-repo-cdn.sigstore.dev). Keyless verification has no local
#     trust anchor — no egress means every runner pod admission fails audit.
#   - Kyverno fetches the signature bundle (tag.sig) from harbor.ebruno.fr,
#     which requires robot auth. Kyverno 1.15 does NOT consume the verified
#     pod's imagePullSecrets (that is a 1.18+ feature) — registry credentials
#     come from imageRegistryCredentials.secrets below, and on 1.15 the secret
#     must live in the KYVERNO namespace (plain-name lookup; namespace/name
#     notation is also 1.18+). harbor-kyverno-pull is GitOps-materialized there
#     via harbor-kyverno-pull-external-secret.yaml, reusing the same Vault
#     read-only robot token as harbor-node-pull — no new credentials.
#     On a >=1.18 upgrade this rule can drop the explicit reference (pod
#     imagePullSecrets become automatic) or switch to harbor-registry-secret
#     via namespace/name notation.
#
# Flipping to Enforce (minimum bar, not a recommendation to rush):
#   1. >= 100 runner-pod admissions across >= 2 consecutive weeks with ZERO
#      PolicyViolation objects from this rule:
#        kubectl get polviol -A | grep verify-arc-runner-images
#      and no kyverno webhook errors during the window:
#        kubectl logs -n kyverno deploy/kyverno-admission-controller | grep -i "verify-arc-runner"
#   2. Then flip validationFailureAction to Enforce and re-evaluate the two
#      safety valves below (failurePolicy: Ignore + webhookTimeoutSeconds: 30).
#      Under Enforce, failurePolicy: Fail turns a Kyverno outage into a runner
#      outage — keep Ignore only if an unchecked-but-signed pod is acceptable;
#      consider mutateDigest: true to pin verified digests at admission.
#   3. Day one of Enforce, any pod built from an unsigned or foreign-identity
#      tag (manual :main experiments included) is rejected outright.
#
# Subject pinning (backlog #13 Phase 1 hardening, 2026-10-19): the signer
# identity is asserted as an EXACT keyless `subject`, not a regex. Evidence
# extracted from the live Harbor signature (index-level .sig of tag sha-8e38db8,
# bundle in the dev.sigstore.cosign/bundle layer annotation, hashedrekord on
# public-good): issuer https://token.actions.githubusercontent.com, SAN
# https://github.com/ebpro/quarkus-ci-runner/.github/workflows/runner-image.yml@refs/heads/main.
# The previous subjectRegExp (^...quarkus-ci-runner/.*) would have accepted a
# signature from ANY workflow in that repo; the exact SAN admits only the
# runner-image workflow on main. Re-pin when the signing workflow moves branch.
#
# No verifyImages `annotations` block (deliberate): in Kyverno 1.15 both
# attestor-entry and deprecated top-level `annotations` are PAYLOAD MATCHERS
# (CRD schema: "Every specified key-value pair must exist and match in the
# verified payload") — using them to "record the verified digest" would make
# every keyless audit check fail, since the cosign bundle payload carries no
# such pair. Digest recording is an Enforce-phase concern (mutateDigest: true
# pins the verified digest at admission; the `images` policy context can expose
# it to annotations from 1.11+).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-arc-runner-images
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: ARC runner images must be cosign keyless-signed by the ebpro/quarkus-ci-runner runner-image workflow
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Audit that every quarkus-ci-runner image used by a Pod in arc-runners
      carries a cosign keyless signature whose Fulcio SAN is exactly the
      runner-image workflow of the ebpro/quarkus-ci-runner repository on the
      main branch (GitHub Actions OIDC identity), timestamped on public-good
      Rekor.
spec:
  validationFailureAction: Enforce
  background: false
  admission: true
  emitWarning: false
  # Audit policy must never block pod creation on a Kyverno hiccup. See the
  # Enforce-flip note above before changing this.
  failurePolicy: Ignore
  # Rekor + harbor round-trips exceed the 10s default.
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-arc-runner-image-signature
      # Pinned to Kyverno 1.15's admission default (see node-arm64-arch-taint.yaml
      # precedent): omitting it lets the Kyverno webhook inject the field, which
      # ArgoCD SSA can never reclaim -> permanent OutOfSync churn on app `arc`.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: ["Pod"]
              operations: ["CREATE", "UPDATE"]
              namespaces: ["arc-runners"]
      verifyImages:
        - imageReferences:
            - "harbor.ebruno.fr/quarkus-microservices/quarkus-ci-runner*"
          # Keep tags as-authored while auditing (mutation is moot in Audit;
          # revisit mutateDigest at Enforce time).
          mutateDigest: false
          # 2026-10-23 (wave 2c): all four scale sets are now pinned by immutable
          # digest (org/arm/large re-pinned to the sha-8e38db8 OCI-index digest,
          # ai-review already was). Enforce that matching quarkus-ci-runner refs
          # carry a digest. Still Audit mode, so this only records a violation on
          # a tag-referenced runner pod — it does not block. ai-review has run
          # digest-pinned under this rule since 2026-10-16, proving cosign .sig
          # lookup resolves on @sha256: references (the .sig blob is stored under
          # the digest the tag resolved to, so a digest ref finds the same
          # signature that was made against tag sha-8e38db8).
          verifyDigest: true
          # Admission-defaulted fields pinned for SSA convergence (values equal
          # Kyverno 1.15 defaults; same reason as skipBackgroundRequests above).
          required: true
          useCache: true
          # Kyverno 1.15: plain-name lookup, secret must be in the kyverno
          # namespace (see header). Harbor robot creds for the .sig fetch.
          imageRegistryCredentials:
            secrets:
              - harbor-kyverno-pull
          attestors:
            - count: 1
              entries:
                - # Admission-defaulted field pinned for SSA convergence
                  # (value equals Kyverno 1.15 default).
                  signatureAlgorithm: sha256
                  keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    # Exact signer SAN (see header "Subject pinning"). Was a
                    # repo-wide regex until 2026-10-19; keep in sync with the
                    # signing workflow's branch/ref.
                    subject: "https://github.com/ebpro/quarkus-ci-runner/.github/workflows/runner-image.yml@refs/heads/main"
                    rekor:
                      url: "https://rekor.sigstore.dev"
