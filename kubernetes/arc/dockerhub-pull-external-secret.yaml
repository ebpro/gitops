# Docker Hub pull credentials for the ARC runner pool (ns arc-runners).
# Materializes the Vault leaf secret/data/dockerhub/credentials (properties
# `username` + `token`) into the dockerconfigjson Secret `docker-hub-registry`,
# which the 4 ARS scale sets + listeners already reference in imagePullSecrets
# and which the runner container mounts at /home/runner/.docker so the dind
# docker client authenticates to Docker Hub at job time.
#
# Structure mirrors harbor-node-pull-external-secret.yaml (same ClusterSecretStore
# `vault`, engineVersion v2 template, dockerconfigjson type, Owner+Retain).
# Deliberate differences:
#   - remoteRef.key is the BARE `dockerhub/credentials` — the store already sets
#     path: secret / version: v2 (kubernetes/external-secrets/cluster-secret-store.yaml),
#     so this resolves to secret/data/dockerhub/credentials. Same bare form as
#     the proven arc-github-creds (`github/arc-app`). harbor-node-pull's literal
#     `secret/harbor/...` prefix is a legacy double-path leaf, NOT a convention.
#   - the JSON is assembled in the template from the two properties (harbor stores
#     a pre-built `config` blob); `auth` is base64("<user>:<token>").
#   - refreshInterval 15m (PAT rotations land without a day's lag).
#
# CUTOVER NOTE: a manual, unowned `docker-hub-registry` Secret exists live.
# creationPolicy: Owner cannot adopt a pre-existing unowned secret — after this
# file is pushed, that secret must be deleted ONCE so this ESO creates and owns
# it (separate sanctioned step, not part of this manifest).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-hub-registry
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: arc
    app.kubernetes.io/component: dockerhub-image-pull
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: docker-hub-registry
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"https://index.docker.io/v1/":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ b64enc (printf "%s:%s" .username .token) }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: dockerhub/credentials
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: token
      remoteRef:
        key: dockerhub/credentials
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
