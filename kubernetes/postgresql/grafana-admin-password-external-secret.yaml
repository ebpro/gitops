apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-password
  namespace: kube-prometheus
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: grafana
      metadataPolicy: None
      property: adminPassword
    secretKey: password
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: grafana-admin-password
    template:
      data:
        admin-password: '{{ .password | b64enc }}'
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
