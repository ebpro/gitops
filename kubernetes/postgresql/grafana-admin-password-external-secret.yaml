apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-password
  namespace: monitoring
spec:
  data:
  - remoteRef:
      key: grafana
      property: adminPassword
    secretKey: password
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: grafana-admin-password
    template:
      data:
        admin-password: '{{ .password | b64enc }}'
      type: Opaque
