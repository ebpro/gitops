apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 1
  storage:
    size: 20Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: registry
      owner: postgres
  postgresql:
    parameters:
      max_connections: "300"
  enableSuperuserAccess: true
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://backups/harbor-db
      endpointURL: http://garage.garage.svc:3900
      s3Credentials:
        accessKeyId:
          name: harbor-backup-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: harbor-backup-s3
          key: AWS_SECRET_ACCESS_KEY
        region:
          name: harbor-backup-s3
          key: AWS_REGION
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
