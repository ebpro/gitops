apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 1
  storage:
    size: 20Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: registry
      owner: postgres
  postgresql:
    parameters:
      max_connections: "300"
  enableSuperuserAccess: true
  externalSecrets:
    s3CredentialsSecret: harbor-backup-s3
  backup:
    barmanObjectStore:
      destinationPath: s3://backups/harbor-db
      s3Endpoint: http://garage.garage.svc:3900
      s3Region: garage
      s3ForcePathStyle: true
  scheduledBackups:
    - schedule: "0 3 * * *"
      retentionPolicy: "14d"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
