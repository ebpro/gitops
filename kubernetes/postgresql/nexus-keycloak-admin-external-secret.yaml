# Keycloak admin credentials projected into the nexus namespace for the
# sso-sync CronJob (admin API read-only usage: realm groups + members).
# Same vault path as the keycloak namespace (see keycloak-external-secret.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-keycloak-admin
  namespace: nexus
spec:
  data:
  - secretKey: adminPassword
    remoteRef:
      key: keycloak
      property: adminPassword
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: keycloak-admin-creds
    template:
      data:
        adminPassword: '{{ .adminPassword }}'
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/instance: nexus
          app.kubernetes.io/part-of: nexus
      type: Opaque
