# Machine account local passwords for Nexus (ci-runner, gitops-user).
# Consumed by the nexus config Job (user creation, one-shot) only - the
# sso-sync CronJob never reads or writes passwords.
# Vault paths: secret/data/nexus/ci-runner, secret/data/nexus/gitops-user
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-ci-credentials
  namespace: nexus
spec:
  data:
  - secretKey: ci-runner
    remoteRef:
      key: nexus/ci-runner
      property: password
  - secretKey: gitops-user
    remoteRef:
      key: nexus/gitops-user
      property: password
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: nexus-ci-credentials
    template:
      data:
        ci-runner: '{{ get . "ci-runner" }}'
        gitops-user: '{{ get . "gitops-user" }}'
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/instance: nexus
          app.kubernetes.io/part-of: nexus
      type: Opaque
