apiVersion: v1
kind: Service
metadata:
  name: woodpecker-postgresql
  namespace: ci
  labels:
    app: woodpecker-postgresql
    app.kubernetes.io/instance: woodpecker
    app.kubernetes.io/name: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    cnpg.io/cluster: woodpecker-db
    role: primary
