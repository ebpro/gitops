apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-oidc-secrets
  namespace: vault
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 24h
  target:
    name: vault-oidc-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: OIDC_CLIENT_SECRET
    remoteRef:
      key: oidc/vault
      property: clientSecret
