apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  data:
  - remoteRef:
      key: velero/s3
      property: accessKey
    secretKey: accessKey
  - remoteRef:
      key: velero/s3
      property: secretKey
    secretKey: secretKey
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: velero-credentials
    template:
      data:
        cloud: '[default]

          aws_access_key_id = {{ .accessKey }}

          aws_secret_access_key = {{ .secretKey }}

          '
      type: Opaque
