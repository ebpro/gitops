apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterStore
    name: vault
  target:
    name: velero-credentials
    template:
      type: Opaque
      data:
        cloud: |
          [default]
          aws_access_key_id = {{ .accessKeyId }}
          aws_secret_access_key = {{ .secretAccessKey }}
  data:
    - key: secret/data/velero/s3
      name: accessKeyId
      property: accessKeyId
    - key: secret/data/velero/s3
      name: secretAccessKey
      property: secretAccessKey
