apiVersion: v1
kind: Service
metadata:
  name: nexus-postgresql
  namespace: nexus
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: nexus
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      name: postgresql
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: nexus
    cnpg.io/cluster: nexus-db
    role: primary
