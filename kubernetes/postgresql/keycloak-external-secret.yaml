apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  namespace: keycloak
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 1h
  target:
    name: keycloak-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        adminPassword: '{{ .adminPassword | b64enc }}'
        realmSecret: '{{ .realmSecret | b64enc }}'
        CLIENT_SECRET_ARGOCD: '{{ .clientSecretArgoCD | b64enc }}'
        CLIENT_SECRET_HARBOR: '{{ .clientSecretHarbor | b64enc }}'
        CLIENT_SECRET_GITEA: '{{ .clientSecretGitea | b64enc }}'
        CLIENT_SECRET_GRAFANA: '{{ .clientSecretGrafana | b64enc }}'
        CLIENT_SECRET_VAULT: '{{ .clientSecretVault | b64enc }}'
        CLIENT_SECRET_BACKSTAGE: '{{ .clientSecretBackstage | b64enc }}'
        CLIENT_SECRET_PLANE: '{{ .clientSecretPlane | b64enc }}'
        CLIENT_SECRET_MICROCKS: '{{ .clientSecretMicrocks | b64enc }}'
        CLIENT_SECRET_NEXUS_SAML: '{{ .clientSecretNexusSaml | b64enc }}'
        CLIENT_SECRET_SONARQUBE_SAML: '{{ .clientSecretSonarqubeSaml | b64enc }}'

  dataFrom:
    - extract:
        key: keycloak
