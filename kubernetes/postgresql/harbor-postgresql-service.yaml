apiVersion: v1
kind: Service
metadata:
  name: harbor-postgresql
  namespace: harbor
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: harbor
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      name: postgresql
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: harbor
