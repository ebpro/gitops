apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-admin-credentials
  namespace: gitea
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 24h
  target:
    name: gitea-admin-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: gitea/admin
        property: password
