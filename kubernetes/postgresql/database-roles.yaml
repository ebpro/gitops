apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: sonarqube-db-app
  namespace: sonarqube
spec:
  cluster:
    name: sonarqube-db
  name: app
  ensure: present
  login: true
  passwordSecret:
    name: sonarqube-postgresql
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: nexus-db-nexus
  namespace: nexus
spec:
  cluster:
    name: nexus-db
  name: nexus
  ensure: present
  login: true
  passwordSecret:
    name: nexus-postgresql-auth
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: pact-broker-db-pactbroker
  namespace: pact-broker
spec:
  cluster:
    name: pact-broker-db
  name: pactbroker
  ensure: present
  login: true
  passwordSecret:
    name: pact-broker-db
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: plane-db-plane
  namespace: plane
spec:
  cluster:
    name: plane-db
  name: plane
  ensure: present
  login: true
  passwordSecret:
    name: plane-postgresql-auth
  databaseRoleReclaimPolicy: retain
