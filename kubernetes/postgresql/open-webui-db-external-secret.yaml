apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-db-secret
  namespace: open-webui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 24h
  target:
    name: open-webui-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        url: '{{ .url }}'
        username: '{{ .username }}'
        password: '{{ .password }}'
  dataFrom:
    - extract:
        key: postgresql/open-webui
