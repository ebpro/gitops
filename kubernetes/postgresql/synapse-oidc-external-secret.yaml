apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-oidc-secret
  namespace: synapse
spec:
  dataFrom:
  - extract:
      key: keycloak
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: synapse-oidc-secret
    template:
      data:
        SYNAPSE_OIDC_CLIENT_SECRET: '{{ .clientSecretSynapse }}'
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
