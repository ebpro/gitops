apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-oidc-secret
  namespace: synapse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  data:
    - secretKey: SYNAPSE_OIDC_CLIENT_SECRET
      remoteRef:
        key: oidc/synapse
        property: clientSecret
