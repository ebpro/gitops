apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pact-broker-db
  namespace: pact-broker
spec:
  instances: 1
  bootstrap:
    initdb:
      database: pact_broker
      owner: pactbroker
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://backups/pact-broker-db
      endpointURL: http://garage.garage.svc:3900
      s3Credentials:
        accessKeyId:
          name: pact-broker-backup-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: pact-broker-backup-s3
          key: AWS_SECRET_ACCESS_KEY
        region:
          name: pact-broker-backup-s3
          key: AWS_REGION
  storage:
    size: 5Gi
    storageClass: local-path
  postgresql:
    parameters:
      max_connections: "200"
  enableSuperuserAccess: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
