apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-postgresql
  namespace: nexus
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: postgresql/nexus
      metadataPolicy: None
      property: password
    secretKey: password
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: nexus-postgresql-auth
    template:
      data:
        password: '{{ .password | b64enc }}'
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/instance: nexus
          app.kubernetes.io/part-of: nexus
      type: Opaque
