apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-oidc
  namespace: gitea
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 24h
  target:
    name: gitea-oidc-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: CLIENT_SECRET_GITEA
    remoteRef:
      key: oidc/gitea
      property: clientSecret
  - secretKey: client-id
    remoteRef:
      key: oidc/gitea
      property: clientId # Note: clientId is not injected yet, will use static or add to script
  - secretKey: client-secret
    remoteRef:
      key: oidc/gitea
      property: clientSecret
