apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harbor-postgresql
  namespace: harbor
  labels:
    app: harbor-postgresql
spec:
  serviceName: harbor-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: harbor-postgresql
  template:
    metadata:
      labels:
        app: harbor-postgresql
    spec:
      securityContext:
        runAsUser: 0
        runAsNonRoot: false

      containers:
        - name: postgresql
          image: docker.io/library/postgres:17
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-postgresql-auth
                  key: password
            - name: POSTGRES_USER
              value: harbor
            - name: POSTGRES_DB
              value: registry
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgresql
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
