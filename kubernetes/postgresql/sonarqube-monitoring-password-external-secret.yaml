apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-monitoring-password
  namespace: sonarqube
spec:
  data:
  - remoteRef:
      key: secret/data/sonarqube/monitoring
      property: passcode
    secretKey: passcode
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterStore
    name: vault
  target:
    name: sonarqube-monitoring-password
    template:
      data:
        monitoring-passcode: '{{ .passcode | b64enc }}'
      type: Opaque
