apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-secrets
  namespace: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 24h
  target:
    name: argocd-oidc-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: CLIENT_SECRET_ARGOCD
    remoteRef:
      key: oidc/argocd
      property: clientSecret
