apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nexus-postgresql
  namespace: nexus
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: nexus
    app.kubernetes.io/part-of: nexus
spec:
  serviceName: nexus-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: nexus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: nexus
    spec:
      containers:
        - name: postgresql
          image: docker.io/bitnami/postgresql:17
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-postgresql-auth
                  key: password
            - name: POSTGRES_USER
              value: nexus
            - name: POSTGRES_DB
              value: nexus
          ports:
            - containerPort: 5432
              name: postgresql
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
      volumes:
        - name: data
          emptyDir: {}
