apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apicurio-postgresql
  namespace: apicurio
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: postgresql/apicurio
      metadataPolicy: None
      property: username
    secretKey: username
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: postgresql/apicurio
      metadataPolicy: None
      property: password
    secretKey: password
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: apicurio-postgresql-auth
    template:
      data:
        password: '{{ .password | b64enc }}'
        postgresql-password: '{{ .password | b64enc }}'
        username: '{{ .username | b64enc }}'
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
