apiVersion: v1
kind: Service
metadata:
  name: backstage-postgresql
  namespace: backstage
  labels:
    app: backstage-postgresql
    app.kubernetes.io/instance: backstage
    app.kubernetes.io/name: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    cnpg.io/cluster: backstage-db
    role: primary
