apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: backstage-db
  namespace: backstage
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  instances: 1
  storage:
    size: 10Gi
    storageClass: local-path
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      work_mem: "16MB"
      maintenance_work_mem: "128MB"
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://backups/backstage-db
      endpointURL: http://garage.garage.svc:3900
      s3Credentials:
        accessKeyId:
          name: backstage-backup-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: backstage-backup-s3
          key: AWS_SECRET_ACCESS_KEY
        region:
          name: backstage-backup-s3
          key: AWS_REGION
  enableSuperuserAccess: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
