apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtrinsics
  name: link-shortener-db
  namespace: link-shortener
spec:
  affinity:
    podAntiAffinityType: preferred
  bootstrap:
    initdb:
      database: linkshortener
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: linkshortener
  enablePDB: false
  enableSuperuserAccess: true
  failoverDelay: 0
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  instances: 1
  logLevel: info
  maxSyncReplicas: 0
  minSyncReplicas: 0
  postgresGID: 26
  postgresUID: 26
  postgresql:
    parameters:
      max_connections: '200'
      max_worker_processes: '16'
      shared_preload_libraries: ''
  primaryUpdateMethod: restart
  primaryUpdateStrategy: unsupervised
  probes:
    liveness:
      isolationCheck:
        connectionTimeout: 1000
        enabled: true
        requestTimeout: 1000
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnpg_
    synchronizeReplicas:
      enabled: true
    updateInterval: 30
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  smartShutdownTimeout: 180
  startDelay: 3600
  storage:
    resizeInUseVolumes: true
    size: 10Gi
    storageClass: local-path
  stopDelay: 1800
  switchoverDelay: 3600
