apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-gitea-oauth
  namespace: plane
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 24h
  target:
    name: plane-gitea-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: id
      remoteRef:
        key: gitea/plane-oauth
        property: clientId
    - secretKey: secret
      remoteRef:
        key: gitea/plane-oauth
        property: clientSecret
