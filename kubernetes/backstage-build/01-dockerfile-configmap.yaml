apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-keycloak-dockerfile
  namespace: backstage
data:
  Dockerfile: |
    FROM ghcr.io/backstage/backstage:latest

    USER root

    # Install additional plugins
# NOTE: backend.add() for auth modules must be done in source code (packages/backend/src/index.ts),
# not via sed on the compiled dist. For OIDC support, rebuild with proper source modification.
    RUN cd /app && \
            yarn add @backstage-community/plugin-grafana && \
            yarn add @roadiehq/backstage-plugin-argo-cd @roadiehq/backstage-plugin-argo-cd-backend && \
            chown -R 1001:1001 /app

    USER 1001
