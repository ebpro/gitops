apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tempo-access-policy
  namespace: tempo
spec:
  description: Restrict Tempo access to kube-prometheus (Grafana + Prometheus) and alloy (OTel traces) only
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: tempo
  ingress:
    - fromEndpoints:
        - labelsSelector:
            k8s:io.kubernetes.pod.namespace: kube-prometheus
      toPorts:
        - ports:
            - port: "3200"
              protocol: TCP
    - fromEndpoints:
        - labelsSelector:
            k8s:io.kubernetes.pod.namespace: alloy
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
            - port: "4318"
              protocol: TCP
  egress:
    - toEndpoints:
        - labelsSelector:
            k8s:io.kubernetes.pod.namespace: kube-prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
            - port: "9153"
              protocol: TCP
    - toEntities:
        - cluster
