# OVH DNS Credentials Secret
# IMPORTANT: Replace placeholder values with real OVH API credentials.
# In production, these should be managed by ExternalSecrets → HashiCorp Vault.
# 
# To get OVH API credentials:
# 1. Go to https://eu.api.ovh.com/auth/?configStep=configStepAPI and create an OVH API key
# 2. Fill in APPLICATION_KEY, APPLICATION_SECRET, CONSUMER_KEY
# 3. Apply this secret: kubectl apply -f ovh-credentials.yaml -n cert-manager
apiVersion: v1
kind: Secret
metadata:
  name: ovh-credentials
  namespace: cert-manager
type: Opaque
stringData:
  applicationKey: "<PLACEHOLDER - GET FROM OVH API>"
  applicationSecret: "<PLACEHOLDER - GET FROM OVH API>"
  consumerKey: "<PLACEHOLDER - GET FROM OVH API>"
