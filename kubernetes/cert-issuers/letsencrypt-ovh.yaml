apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-ovh
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: acme@ebruno.fr
    privateKeySecretRef:
      name: letsencrypt-ovh
    solvers:
      - dns01:
          dnsProviders:
            - provider: ovh
              apiKeySecretRef:
                name: ovh-credentials
                key: applicationKey
