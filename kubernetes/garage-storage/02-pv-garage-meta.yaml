# Static Local PV for garage metadata (design A', Phase 2).
#
# MAINTENANCE NOTE: this PV is pre-bound via spec.claimRef. If the garage
# PVCs are ever deleted+recreated, the PV transitions to Released — clear
# spec.claimRef and status.phase to rebind it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: garage-meta-hdd
  labels:
    app: garage
    tier: meta
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path-hdd
  claimRef:
    namespace: garage
    name: meta-garage-0
  local:
    path: /mnt/hdd/k3s-storage/garage/meta
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - compute-lsis-2
