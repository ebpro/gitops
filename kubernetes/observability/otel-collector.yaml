apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: platform-collector
  namespace: alloy
spec:
  mode: sidecar

  observability:
    metrics:
      enableMetrics: true

  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: K8S_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 10s
              static_configs:
                - targets: ['0.0.0.0:8888']

    processors:
      batch:
        send_batch_size: 512
        send_batch_max_size: 1024
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
        spike_limit_mib: 64
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.node.name
            - k8s.pod.start_time
          labels:
            - tag_name: k8s.label.app
              key: app
              from: pod
            - tag_name: k8s.label.app.kubernetes.io/name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: k8s.label.app.kubernetes.io/instance
              key: app.kubernetes.io/instance
              from: pod
        pod_association:
          - sources:
            - from: resource
              name: k8s.pod.ip
          - sources:
            - from: connection
              name: k8s.pod.ip
      resource:
        attributes:
          - key: service.instance.id
            value: "$K8S_POD_NAME.$K8S_NAMESPACE"
            action: upsert
          - key: cluster.name
            value: compute-lsis-2
            action: upsert
          - key: k8s.node.name
            value: "$K8S_NODE_NAME"
            action: upsert
      transform:
        trace_statements:
          - context: span
            statements:
              - set(status.code, Status_CODE_ERROR) where attributes["exception.message"] != nil
              - set(attributes["service.namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil
              - set(attributes["service.instance"], resource.attributes["service.instance.id"]) where resource.attributes["service.instance.id"] != nil
      probabilities:
        logs: 1.0
        metrics: 1.0
        traces: 1.0

    exporters:
      otlp/tempo:
        endpoint: tempo.tempo.svc.cluster.local:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 100
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      prometheusremotewrite:
        endpoint: http://kube-prometheus-kube-prome-prometheus.kube-prometheus.svc.cluster.local:9090/api/v1/write
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 100
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      logging:
        verbosity: basic
        logfire:
          sampler:
            keep_first: 500
            decision_wait: 60000

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, k8sattributes, resource, transform]
          exporters: [otlp/tempo, logging]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch, k8sattributes, resource]
          exporters: [prometheusremotewrite, logging]
