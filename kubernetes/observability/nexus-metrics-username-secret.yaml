# Non-sensitive username half of the nexus ServiceMonitor basicAuth
# (helm/releases/nexus/values.yaml -> metrics.serviceMonitor.endpointConfig.basicAuth.username).
# The prometheus-operator ServiceMonitor CRD requires BOTH basicAuth.username and
# basicAuth.password to be SecretKeySelector objects, so the literal `username: admin`
# added in 6b009e2 is schema-invalid; it must reference a Secret key instead.
# The password half references the pre-existing Vault-seeded Secret
# `nexus-root-password` (key `password`), already present in-namespace and consumed
# by the nexus StatefulSet as NEXUS_SECURITY_INITIAL_PASSWORD.
# This is NOT a credentials dump: the value below is the public local admin login name.
apiVersion: v1
kind: Secret
metadata:
  name: nexus-metrics-username
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/part-of: monitoring
type: Opaque
stringData:
  username: admin
