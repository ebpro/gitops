# ServiceMonitors for apps scattered across namespaces
# Scrape path: Prometheus (kube-prometheus) → Grafana dashboards
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sonarqube
  namespace: sonarqube
  labels:
    release: kube-prometheus
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - sonarqube
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarqube
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      params:
        passcode:
          - ''
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backstage
  namespace: backstage
