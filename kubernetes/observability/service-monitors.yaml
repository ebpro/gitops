  namespaceSelector:
    matchNames:
      - backstage
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  endpoints:
    - port: http-backend
      path: /.backstage/health/v1/metrics
      interval: 30s
      scrapeTimeout: 10s
