# ServiceMonitors for apps scattered across namespaces
# Scrape path: Prometheus (kube-prometheus) → Grafana dashboards
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sonarqube
  namespace: sonarqube
  labels:
    release: kube-prometheus
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - sonarqube
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarqube
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      params:
        passcode:
          - ''
# --- backstage ServiceMonitor REMOVED 2026-10-15 (was: http-backend port, path
# /.backstage/health/v1/metrics). Root cause: the endpoint never existed. Live
# probes on the backend pod :7007 showed /.backstage/health/v1/metrics and
# /metrics both return the SPA index HTML (fallthrough) and
# /api/prometheus/metrics returns 404 — the custom image (dd74672) has no
# prometheus backend plugin and helm/releases/backstage/values.yaml appConfig
# declares no `prometheus:` block, so no metrics route is registered anywhere.
# The old scrape only returned text/html, which Prometheus rejects
# ("unsupported Content-Type"). Removing the monitor instead of pointing it at
# a fake path keeps the targets page honest.
# RESTORE once the image installs the prometheus backend plugin AND appConfig
# declares a `prometheus:` block — the endpoint is then /api/prometheus/metrics
# on :7007, e.g.:
#   apiVersion: monitoring.coreos.com/v1
#   kind: ServiceMonitor
#   metadata: {name: backstage, namespace: backstage, labels: {release: kube-prometheus}}
#   spec:
#     jobLabel: app.kubernetes.io/name
#     namespaceSelector: {matchNames: [backstage]}
#     selector: {matchLabels: {app.kubernetes.io/name: backstage}}
#     endpoints: [{port: http-backend, path: /api/prometheus/metrics, interval: 30s, scrapeTimeout: 10s}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: microcks
  namespace: microcks
  labels:
    release: kube-prometheus
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - microcks
  selector:
    matchLabels:
      app.kubernetes.io/name: microcks
      microcks-metrics: "true"
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
