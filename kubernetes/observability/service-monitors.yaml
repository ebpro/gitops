apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitea
  namespace: gitea
  labels:
    release: kube-prometheus
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - gitea
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  endpoints:
    - port: http
      # /api/prometheus/metrics is the pre-1.19 legacy path (removed upstream);
      # gitea 1.26 serves metrics at /metrics once [metrics] ENABLED=true
      # (see GITEA__metrics__ENABLED in helm/releases/gitea/values.yaml).
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: woodpecker
  namespace: ci
  labels:
    release: kube-prometheus
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - ci
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  endpoints:
    # woodpecker v3.17.0 returns 404 on the main :8000/metrics unless
    # WOODPECKER_PROMETHEUS_AUTH_TOKEN is set. The chart's supported mechanism
    # is a dedicated unauthenticated metrics listener (:9001, Service port
    # `metrics`), enabled via server.metrics in woodpecker-values.yaml.
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: link-shortener
  namespace: link-shortener
  labels:
    release: kube-prometheus
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - link-shortener
  selector:
    matchLabels:
      app.kubernetes.io/name: link-shortener
  endpoints:
    - port: management
      # Quarkus management metrics path on this build (verified live:
      # :9000/q/metrics returns Prometheus text; /q/management/metrics 404s).
      path: /q/metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
          targetLabel: app
        - action: replace
          sourceLabels:
            - __meta_kubernetes_namespace
          targetLabel: namespace
