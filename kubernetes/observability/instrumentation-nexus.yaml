apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: nexus-otel
  namespace: nexus
spec:
  exporter:
    endpoint: http://alloy.alloy.svc.cluster.local:4317
  sampler:
    type: parentbased_traceidratio
    argument: "0.1"
  propagators:
    - tracecontext
    - baggage
  java:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
  env:
    - name: OTEL_SERVICE_NAME
      value: nexus
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: namespace=nexus,cluster=compute-lsis-2
    - name: OTEL_METRICS_EXPORTER
      value: "none"
