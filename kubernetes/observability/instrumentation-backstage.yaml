apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: backstage-otel
  namespace: backstage
spec:
  exporter:
    endpoint: http://alloy.alloy.svc.cluster.local:4318
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  propagators:
    - tracecontext
    - baggage
  nodejs:
  env:
    - name: OTEL_SERVICE_NAME
      value: backstage
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: namespace=backstage,cluster=compute-lsis-2
    - name: OTEL_METRICS_EXPORTER
      value: "none"
    - name: OTEL_LOGS_EXPORTER
      value: "none"
