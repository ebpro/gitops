apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-alertmanager-config
  namespace: kube-prometheus
data:
  config.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default
      group_by: ['alertname', 'namespace', 'cluster']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: default
          matchers:
            - severity =~ "critical|warning"
          group_wait: 10s
          repeat_interval: 1h
        - receiver: null
          matchers:
            - severity = "info"

    receivers:
      - name: default
        webhook_configs:
          - url: http://0.0.0.0:9096/webhook
            send_resolved: true
            max_alerts: 100
      - name: null
