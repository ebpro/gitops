apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.3
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: databaseUrl
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: webuiSecretKey
            - name: WEBUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: adminPassword
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauthClientSecret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: openaiApiKey
            - name: WEBUI_ADMIN_EMAIL
              value: bruno@ebruno.fr
            - name: WEBUI_ADMIN_NAME
              value: Bruno
            - name: WEBUI_URL
              value: https://openwebui.ebruno.fr
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_CLIENT_ID
              value: open-webui
            - name: OAUTH_PROVIDER_NAME
              value: Keycloak
            - name: OPENID_PROVIDER_URL
              value: https://keycloak.ebruno.fr/realms/platform/.well-known/openid-configuration
            - name: OPENID_REDIRECT_URI
              value: https://openwebui.ebruno.fr/oauth/oidc/callback
            - name: OAUTH_SCOPES
              value: openid email profile roles
            - name: OAUTH_USERNAME_CLAIM
              value: email
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "true"
            - name: OAUTH_ADMIN_ROLES
              value: platform-admin
            - name: DEFAULT_USER_ROLE
              value: pending
            - name: OPENAI_API_BASE_URL
              value: http://litellm.llm-gateway.svc:4000/v1
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: UVICORN_WORKERS
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
