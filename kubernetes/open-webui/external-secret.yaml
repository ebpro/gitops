apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secrets
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: open-webui-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - remoteRef:
        key: secret/open-webui
        property: webuiSecretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: webuiSecretKey
    - remoteRef:
        key: secret/open-webui
        property: adminPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: adminPassword
    - remoteRef:
        key: secret/keycloak
        property: clientSecretOpenWebUI
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: oauthClientSecret
    - remoteRef:
        key: secret/postgresql/open-webui
        property: url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: databaseUrl
    - remoteRef:
        key: secret/llm-gateway
        property: litellmMasterKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: openaiApiKey
