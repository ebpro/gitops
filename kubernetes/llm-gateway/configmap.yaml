apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: litellm
data:
  config.yaml: |
    model_list:
      - model_name: qwen3.8-27b
        litellm_params:
          model: openai/qwen3.8-27b
          api_base: http://localhost:8001/v1
          api_key: os.environ/VLLM_API_KEY
          max_parallel_requests: 8
          timeout: 600
      - model_name: qwen3.8-flash
        litellm_params:
          model: openai/Qwen3.8-Flash-Next
          api_base: http://compute-lsis-1.lis-lab.fr:8002/v1
          max_parallel_requests: 4
          timeout: 600
      - model_name: gemma-4-31b-nvfp4
        litellm_params:
          model: openai/unsloth/gemma-4-31B-it-NVFP4
          api_base: https://chat.lis-lab.fr/api
          api_key: os.environ/LIS_LAB_API_KEY
          max_parallel_requests: 2
          timeout: 600
      - model_name: gemma-4-31b-fp16
        litellm_params:
          model: openai/google/gemma-4-31B-it
          api_base: https://chat.lis-lab.fr/api
          api_key: os.environ/LIS_LAB_API_KEY
          max_parallel_requests: 2
          timeout: 600

    router_settings:
      num_retries: 2
      request_timeout: 600
      cooldown_time: 300
      allowed_fails: 3
      fallbacks:
        - qwen3.8-27b:
            - qwen3.8-flash
            - gemma-4-31b-nvfp4
            - gemma-4-31b-fp16
        - qwen3.8-flash:
            - gemma-4-31b-nvfp4
        - gemma-4-31b-nvfp4:
            - gemma-4-31b-fp16

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY

    litellm_settings:
      success_callback: ["prometheus"]
      failure_callback: ["prometheus"]
