apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: litellm
data:
  config.yaml: |
    model_list:
      # ---- PRIMARY: own Qwen3.8 Flash Next (llama.cpp, Mac Studio Ultra, no auth) ----
      # reachable via hostAlias compute-lsis-1.lis-lab.fr -> 10.2.248.32 (see deployment.yaml)
      - model_name: qwen3.8-flash-next
        litellm_params:
          model: openai/Qwen3.8-Flash-Next
          api_base: http://compute-lsis-1.lis-lab.fr:8002/v1
          api_key: "not-needed"
          max_parallel_requests: 4
          timeout: 600
      # ---- PRIMARY: own Qwen3.8-27B (ouranos1 vLLM, A100 80G) on-node localhost:8001 ----
      - model_name: qwen3.8-27b
        litellm_params:
          model: openai/qwen3.8-27b
          api_base: http://localhost:8001/v1
          api_key: os.environ/VLLM_API_KEY
          max_parallel_requests: 8
          timeout: 600
      # ---- BACKUP / manual: lab Qwen3.8 Flash Next (chat.lis-lab.fr) ----
      - model_name: qwen3.8-flash-next-lab
        litellm_params:
          model: openai/qwen3.8-flash-next
          api_base: https://chat.lis-lab.fr/api
          api_key: os.environ/LIS_LAB_API_KEY
          max_parallel_requests: 2
          timeout: 600
      # ---- manual: lab Qwen 3.8 preset ----
      - model_name: lismodel1
        litellm_params:
          model: openai/lismodel1
          api_base: https://chat.lis-lab.fr/api
          api_key: os.environ/LIS_LAB_API_KEY
          max_parallel_requests: 2
          timeout: 600

    router_settings:
      num_retries: 2
      request_timeout: 600
      cooldown_time: 300
      allowed_fails: 3
      fallbacks:
        - qwen3.8-flash-next:
            - qwen3.8-flash-next-lab
            - lismodel1
        - qwen3.8-27b:
            - qwen3.8-flash-next
        - qwen3.8-flash-next-lab:
            - lismodel1

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY

    litellm_settings:
      success_callback: ["prometheus"]
      failure_callback: ["prometheus"]
