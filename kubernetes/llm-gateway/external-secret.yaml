apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: llm-gateway
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - remoteRef:
        key: secret/llm-gateway
        property: litellmMasterKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: LITELLM_MASTER_KEY
    - remoteRef:
        key: secret/llm-gateway
        property: vllmApiKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: VLLM_API_KEY
    - remoteRef:
        key: secret/llm-gateway
        property: lisLabApiKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: LIS_LAB_API_KEY
