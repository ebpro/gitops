apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: fwd-auth-transport
  namespace: oauth2-proxy
spec:
  serverName: oauth2-proxy
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/checkauth
    trustForwardHeader: true
    authResponseHeaders:
      - Gap-Auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth-headers
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/signin
    authResponseHeaders:
      - X-Forwarded-User
      - X-Forwarded-Email
      - X-Forwarded-Access-Token
    trustForwardHeader: true
