apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-devops-realm-sync-script
  namespace: keycloak
data:
  sync.sh: |
    #!/bin/bash
    set -euo pipefail
    KCADM=/opt/keycloak/bin/kcadm.sh

    echo "Logging into Keycloak admin API..."
    "$KCADM" config credentials --server http://keycloak-http.keycloak.svc.cluster.local:80 \
      --realm master --user admin --password "$KEYCLOAK_ADMIN_PASSWORD"

    echo "Ensuring realm 'devops' exists..."
    if ! "$KCADM" get realms/devops >/dev/null 2>&1; then
      "$KCADM" create realms -s realm=devops -s enabled=true -s sslRequired=external \
        -s registrationAllowed=false -s bruteForceProtected=true
    fi

    echo "Ensuring realm roles exist..."
    for role in devops-admin devops-developer devops-viewer; do
      if ! "$KCADM" get roles/"$role" -r devops >/dev/null 2>&1; then
        "$KCADM" create roles -r devops -s name="$role" -s description="DevOps platform role: $role"
      fi
    done

    echo "Ensuring groups exist and are mapped to matching realm roles..."
    for grp in devops-admin devops-developer devops-viewer; do
      GID=$("$KCADM" get groups -r devops -q search="$grp" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'] if d else '')")
      if [ -z "$GID" ]; then
        "$KCADM" create groups -r devops -s name="$grp"
        GID=$("$KCADM" get groups -r devops -q search="$grp" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'])")
      fi
      "$KCADM" add-roles -r devops --gid "$GID" --rolename "$grp" || true
    done

    sync_client() {
      client_id="$1"
      json_file="$2"
      secret_value="$3"
      redirect_uri="$4"
      admin_url="$5"

      CID=$("$KCADM" get clients -r devops -q clientId="$client_id" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'] if d else '')")
      if [ -z "$CID" ]; then
        echo "Creating client $client_id ..."
        "$KCADM" create clients -r devops -f "$json_file"
        CID=$("$KCADM" get clients -r devops -q clientId="$client_id" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'])")
      else
        echo "Client $client_id already exists (id=$CID), updating core attributes..."
        "$KCADM" update clients/"$CID" -r devops -f "$json_file" --merge
      fi

      echo "Setting real client secret for $client_id from Vault..."
      "$KCADM" update clients/"$CID" -r devops -s "secret=$secret_value"

      echo "Removing role_list from default client scopes (avoid SAML duplicated Name error)..."
      ROLE_LIST_ID=$("$KCADM" get clients/"$CID"/default-client-scopes -r devops 2>/dev/null | python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    for s in d:
        if s['name'] == 'role_list':
            print(s['id'])
    ")
      if [ -n "$ROLE_LIST_ID" ]; then
        "$KCADM" delete clients/"$CID"/default-client-scopes/"$ROLE_LIST_ID" -r devops || true
      fi

      echo "Ensuring protocol mappers for $client_id..."
      existing_mappers=$("$KCADM" get clients/"$CID"/protocol-mappers/models -r devops 2>/dev/null | python3 -c "import sys,json; print(','.join(m['name'] for m in json.load(sys.stdin)))")

      add_mapper() {
        name="$1"; shift
        case ",$existing_mappers," in
          *",$name,"*) echo "  mapper $name already present" ;;
          *) echo "  creating mapper $name"; "$KCADM" create clients/"$CID"/protocol-mappers/models -r devops -s name="$name" "$@" ;;
        esac
      }

      if [ "$client_id" = "nexus" ]; then
        add_mapper username -s protocol=saml -s protocolMapper=saml-user-property-mapper -s 'config."user.attribute"=username' -s 'config."attribute.name"=uid' -s 'config."friendly.name"=uid'
        add_mapper email -s protocol=saml -s protocolMapper=saml-user-property-mapper -s 'config."user.attribute"=email' -s 'config."attribute.name"=mail' -s 'config."friendly.name"=mail'
        add_mapper fullName -s protocol=saml -s protocolMapper=saml-user-property-mapper -s 'config."user.attribute"=firstName' -s 'config."attribute.name"=displayName' -s 'config."friendly.name"=displayName'
        add_mapper groups -s protocol=saml -s protocolMapper=saml-group-membership-mapper -s 'config."attribute.name"=groups' -s 'config."full.path"=false' -s 'config."friendly.name"=groups'
      else
        add_mapper loginName -s protocol=saml -s protocolMapper=saml-user-property-mapper -s 'config."user.attribute"=username' -s 'config."attribute.name"=login' -s 'config."friendly.name"=login'
        add_mapper fullName -s protocol=saml -s protocolMapper=saml-user-property-mapper -s 'config."user.attribute"=firstName' -s 'config."attribute.name"=name' -s 'config."friendly.name"=name'
        add_mapper email -s protocol=saml -s protocolMapper=saml-user-property-mapper -s 'config."user.attribute"=email' -s 'config."attribute.name"=email' -s 'config."friendly.name"=email'
        add_mapper groups -s protocol=saml -s protocolMapper=saml-group-membership-mapper -s 'config."attribute.name"=groups' -s 'config."full.path"=false' -s 'config."friendly.name"=groups'
      fi
    }

    cat > /tmp/nexus-client.json << 'JSONEOF'
    {
      "clientId": "nexus",
      "protocol": "saml",
      "enabled": true,
      "publicClient": false,
      "attributes": {
        "saml.assertion.signature": "true",
        "saml.server.signature": "true",
        "saml.server.signature.keyinfo.ext": "false",
        "saml.signature.algorithm": "RSA_SHA256",
        "saml.client.signature": "false",
        "saml_name_id_format": "email",
        "saml_force_name_id_format": "true",
        "saml.authnstatement": "true",
        "saml_single_logout_service_url_redirect": "https://nexus.ebruno.fr/",
        "saml.assertion.lifespan": "300"
      },
      "redirectUris": ["https://nexus.ebruno.fr/*"],
      "adminUrl": "https://nexus.ebruno.fr/service/rest/v1/security/saml/callback",
      "baseUrl": "https://nexus.ebruno.fr/"
    }
    JSONEOF

    cat > /tmp/sonarqube-client.json << 'JSONEOF'
    {
      "clientId": "sonarqube",
      "protocol": "saml",
      "enabled": true,
      "publicClient": false,
      "attributes": {
        "saml.assertion.signature": "true",
        "saml.server.signature": "true",
        "saml.server.signature.keyinfo.ext": "false",
        "saml.signature.algorithm": "RSA_SHA256",
        "saml.client.signature": "false",
        "saml_name_id_format": "email",
        "saml_force_name_id_format": "true",
        "saml.authnstatement": "true",
        "saml_single_logout_service_url_redirect": "https://sonarqube.ebruno.fr/",
        "saml.assertion.lifespan": "300"
      },
      "redirectUris": ["https://sonarqube.ebruno.fr/*"],
      "adminUrl": "https://sonarqube.ebruno.fr/oauth2/callback/saml",
      "baseUrl": "https://sonarqube.ebruno.fr/"
    }
    JSONEOF

    sync_client nexus /tmp/nexus-client.json "$CLIENT_SECRET_NEXUS_SAML" "https://nexus.ebruno.fr/*" "https://nexus.ebruno.fr/service/rest/v1/security/saml/callback"
    sync_client sonarqube /tmp/sonarqube-client.json "$CLIENT_SECRET_SONARQUBE_SAML" "https://sonarqube.ebruno.fr/oauth2/callback/saml" "https://sonarqube.ebruno.fr/oauth2/callback/saml"

    echo "devops realm reconciliation complete."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-devops-realm-sync
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kcadm-sync
          image: quay.io/keycloak/keycloak:26.7.0
          command:
            - /bin/bash
            - /scripts/sync.sh
          env:
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: adminPassword
            - name: CLIENT_SECRET_NEXUS_SAML
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: CLIENT_SECRET_NEXUS_SAML
            - name: CLIENT_SECRET_SONARQUBE_SAML
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: CLIENT_SECRET_SONARQUBE_SAML
          volumeMounts:
            - name: sync-script
              mountPath: /scripts
      volumes:
        - name: sync-script
          configMap:
            name: keycloak-devops-realm-sync-script
            defaultMode: 0755
