apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-platform-realm-setup-20260818
  namespace: keycloak
  annotations: {}
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kcadm-setup
          image: quay.io/keycloak/keycloak:26.7.0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              KCADM=/opt/keycloak/bin/kcadm.sh
              KC_SERVER=http://keycloak-http.keycloak.svc.cluster.local:80
              REALM="platform"

              echo "=== Keycloak Platform Realm Setup ==="

              # --- Login (with retry) ---
              echo "Waiting for Keycloak admin API..."
              LOGIN_RETRIES=15
              for attempt in $(seq 1 $LOGIN_RETRIES); do
                printf "  Login attempt %d/%d... " "$attempt" "$LOGIN_RETRIES"
                if "$KCADM" config credentials \
                  --server "$KC_SERVER" \
                  --realm master \
                  --user admin \
                  --password "$KEYCLOAK_ADMIN_PASSWORD" 2>/dev/null; then
                  echo "OK"
                  break
                fi
                if [ "$attempt" -eq "$LOGIN_RETRIES" ]; then
                  echo "FATAL: Authentication failed after $LOGIN_RETRIES attempts"
                  exit 1
                fi
                echo "retrying..."
                sleep 10
              done

              # --- Helper: add user to group ---
              add_to_group() {
                local grp_name="$1"
                local username="$2"

                echo "    Adding $username to $grp_name..."

                local uid
                uid=$("$KCADM" get users -r "$REALM" -q username="$username" 2>/dev/null \
                  | grep -oP '"id"\s*:\s*"\K[^"]+' \
                  | head -1 || true)

                local gid
                gid=$("$KCADM" get groups -r "$REALM" -q search="$grp_name" 2>/dev/null \
                  | grep -oP '"id"\s*:\s*"\K[^"]+' \
                  | head -1 || true)

                if [ -z "$uid" ] || [ -z "$gid" ]; then
                  echo "    ERROR: user/group missing"
                  return 1
                fi

                "$KCADM" update users/"$uid"/groups/"$gid" -r "$REALM"

                echo "    Added to $grp_name"
              }

              # --- User: bruno ---
              echo "Setting up user bruno..."
              UID_BRUNO=$("$KCADM" get users -r "$REALM" -q username=bruno 2>/dev/null | grep -oP '"id"\s*:\s*"\K[^"]+' | head -1 || true)
              if [ -z "$UID_BRUNO" ]; then
                echo "  Creating user bruno..."
                "$KCADM" create users -r "$REALM" -s username=bruno -s enabled=true -s emailVerified=true -s email=bruno@ebruno.fr
                UID_BRUNO=$("$KCADM" get users -r "$REALM" -q username=bruno 2>/dev/null | grep -oP '"id"\s*:\s*"\K[^"]+' | head -1)
              fi
              echo "  Setting password..."
              "$KCADM" set-password --username bruno --new-password "$BRUNO_PASSWORD" -r "$REALM"
              echo "  Assigning to /platform-admins..."
              add_to_group "platform-admins" "bruno"

              # --- User: ci-runner ---
              echo "Setting up user ci-runner..."
              UID_CI=$("$KCADM" get users -r "$REALM" -q username=ci-runner 2>/dev/null | grep -oP '"id"\s*:\s*"\K[^"]+' | head -1 || true)
              if [ -z "$UID_CI" ]; then
                echo "  Creating user ci-runner..."
                "$KCADM" create users -r "$REALM" -s username=ci-runner -s enabled=true -s emailVerified=true -s email=ci-runner@ebruno.fr
                UID_CI=$("$KCADM" get users -r "$REALM" -q username=ci-runner 2>/dev/null | grep -oP '"id"\s*:\s*"\K[^"]+' | head -1)
              fi
              echo "  Setting password..."
              "$KCADM" set-password --username ci-runner --new-password "$CI_RUNNER_PASSWORD" -r "$REALM"
              echo "  Assigning to /platform-engineers..."
              add_to_group "platform-engineers" "ci-runner"

              # --- User: gitops-user ---
              echo "Setting up user gitops-user..."
              UID_GITOPS=$("$KCADM" get users -r "$REALM" -q username=gitops-user 2>/dev/null | grep -oP '"id"\s*:\s*"\K[^"]+' | head -1 || true)
              if [ -z "$UID_GITOPS" ]; then
                echo "  Creating user gitops-user..."
                "$KCADM" create users -r "$REALM" -s username=gitops-user -s enabled=true -s emailVerified=true -s email=gitops-bot@platform.local
                UID_GITOPS=$("$KCADM" get users -r "$REALM" -q username=gitops-user 2>/dev/null | grep -oP '"id"\s*:\s*"\K[^"]+' | head -1)
              fi
              echo "  Setting password..."
              "$KCADM" set-password --username gitops-user --new-password "$GITOPS_USER_PASSWORD" -r "$REALM"
              echo "  Assigning to /platform-engineers..."
              add_to_group "platform-engineers" "gitops-user"

              echo "=== Platform realm setup complete ==="
          env:
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: adminPassword
            - name: BRUNO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: userPasswordBruno
            - name: CI_RUNNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: userPasswordCiRunner
            - name: GITOPS_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: gitopsUserPassword
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
