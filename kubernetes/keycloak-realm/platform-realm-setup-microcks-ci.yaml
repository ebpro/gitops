apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-microcks-ci-setup-20260818-r4
  namespace: keycloak
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kcadm-setup
          # shellcheck disable=SC2087
          image: quay.io/keycloak/keycloak:26.7.0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              KCADM=/opt/keycloak/bin/kcadm.sh
              KC_SERVER=http://keycloak-http.keycloak.svc.cluster.local:80
              REALM="platform"

              echo "=== microcks-ci service account role setup ==="

              # --- Login (with retry) ---
              LOGIN_RETRIES=20
              for attempt in $(seq 1 $LOGIN_RETRIES); do
                printf "  Login attempt %d/%d... " "$attempt" "$LOGIN_RETRIES"
                if "$KCADM" config credentials \
                  --server "$KC_SERVER" \
                  --realm master \
                  --user admin \
                  --password "$KEYCLOAK_ADMIN_PASSWORD" 2>/dev/null; then
                  echo "OK"
                  break
                fi
                if [ "$attempt" -eq "$LOGIN_RETRIES" ]; then
                  echo "FATAL: Authentication failed after $LOGIN_RETRIES attempts"
                  exit 1
                fi
                echo "retrying..."
                sleep 15
              done

              id_of() { grep -oP '"id"\s*:\s*"\K[^"]+' | head -1; }

              # --- Wait for microcks-ci client (created by keycloak-reconciler cron) ---
              for attempt in $(seq 1 24); do
                CI_UUID=$("$KCADM" get clients -r "$REALM" -q clientId=microcks-ci 2>/dev/null | id_of || true)
                if [ -n "$CI_UUID" ]; then
                  echo "  microcks-ci client found (uuid=${CI_UUID:0:8}...)"
                  break
                fi
                if [ "$attempt" -eq 24 ]; then
                  echo "FATAL: microcks-ci client not found after 6m (was the reconciler spec pushed?)"
                  exit 1
                fi
                sleep 15
              done

              SVC_USER=$("$KCADM" get users -r "$REALM" -q username=service-account-microcks-ci 2>/dev/null | id_of || true)
              if [ -z "$SVC_USER" ]; then
                echo "FATAL: service-account-microcks-ci user not found (serviceAccountsEnabled not effective?)"
                exit 1
              fi
              echo "  service account user found (uuid=${SVC_USER:0:8}...)"

              APP_UUID=$("$KCADM" get clients -r "$REALM" -q clientId=microcks-app 2>/dev/null | id_of || true)
              if [ -z "$APP_UUID" ]; then
                echo "FATAL: microcks-app client not found"
                exit 1
              fi
              echo "  microcks-app client found (uuid=${APP_UUID:0:8}...)"

              # --- Resolve the 'admin' client role (id required in the mapping payload) ---
              ROLE_DOC=$("$KCADM" get "clients/$APP_UUID/roles/admin" -r "$REALM" 2>/dev/null || true)
              ROLE_ID=$(echo "$ROLE_DOC" | id_of || true)
              if [ -z "$ROLE_ID" ]; then
                echo "FATAL: 'admin' client role not found on microcks-app"
                exit 1
              fi
              echo "  admin role resolved (id=${ROLE_ID:0:8}...)"

              # --- Assign microcks-app:admin to the service account user (idempotent) ---
              PAYLOAD='[{"id":"'"$ROLE_ID"'","name":"admin","clientRole":true,"composite":false,"containerId":"'"$APP_UUID"'"}]'
              if "$KCADM" add "users/$SVC_USER/role-mappings/clients/$APP_UUID" -r "$REALM" --payload "$PAYLOAD" 2>/dev/null; then
                echo "  role mapping applied"
              else
                echo "  role mapping POST returned non-zero (may already be applied); verifying..."
              fi

              # --- Verify (kcadm prints Jackson-style spaced JSON) ---
              MAPS=$("$KCADM" get "users/$SVC_USER/role-mappings/clients/$APP_UUID" -r "$REALM" 2>/dev/null || true)
              if echo "$MAPS" | grep -Eq '"name" *: *"admin"'; then
                echo "  [OK] service-account-microcks-ci -> microcks-app:admin verified"
                echo "=== microcks-ci role setup complete ==="
              else
                echo "FATAL: mapping not visible after apply"
                echo "$MAPS"
                exit 1
              fi
          env:
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: adminPassword
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
