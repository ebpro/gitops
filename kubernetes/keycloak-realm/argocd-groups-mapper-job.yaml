# One-shot kcadm Job: ensure the realm 'groups' client-scope has an
# oidc-group-membership-mapper so Keycloak emits a "groups" claim in the id_token.
# Why: ArgoCD OIDC login authenticated bruno but the token carried no groups, so
# the RBAC binding "g, /platform-admins, role:admin" never matched and the UI was
# empty. The realm import is IGNORE_EXISTING, so the mapper defined in the realm
# JSON was never applied to the pre-existing empty 'groups' scope.
# Notes:
#  - kcadm create of protocol-mappers fails ("Cannot parse the JSON"); the mapper
#    is POSTed via raw /dev/tcp (same pattern as platform-realm-microcks-roles-job).
#  - client-scopes list INLINES protocol mappers; microprofile-jwt has a mapper
#    literally named "groups". The scope is discriminated by requiring the object
#    be followed by ,"attributes" (mappers are followed by ,"protocolMapper").
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-argocd-groups-mapper-20260912c
  namespace: keycloak
  annotations: {}
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kcadm-groups-mapper
          image: quay.io/keycloak/keycloak:26.7.0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              KCADM=/opt/keycloak/bin/kcadm.sh
              KC_HOST=keycloak-http.keycloak.svc.cluster.local
              KC_PORT=80
              KC_SERVER=http://$KC_HOST:$KC_PORT
              REALM="platform"

              echo "=== Ensure oidc-group-membership-mapper on realm 'groups' client-scope ==="

              # --- Login (with retry) ---
              for attempt in $(seq 1 20); do
                printf "  Login attempt %d/20... " "$attempt"
                if "$KCADM" config credentials \
                  --server "$KC_SERVER" --realm master \
                  --user admin --password "$KEYCLOAK_ADMIN_PASSWORD" 2>/dev/null; then
                  echo "OK"; break
                fi
                if [ "$attempt" -eq 20 ]; then echo "FATAL: auth failed"; exit 1; fi
                echo "retrying..."; sleep 10
              done

              # --- Extract admin token from kcadm session ---
              ADMIN_TOKEN=$(grep -oP '"token"\s*:\s*"\K[^"]+' /opt/keycloak/.keycloak/kcadm.config 2>/dev/null || true)
              if [ -z "$ADMIN_TOKEN" ]; then echo "FATAL: no admin token"; exit 1; fi
              printf "  admin token extracted (%d chars)\n" "${#ADMIN_TOKEN}"

              # --- Resolve the 'groups' SCOPE id (exclude inlined mappers named 'groups') ---
              SCOPE_ID=$("$KCADM" get client-scopes -r "$REALM" 2>/dev/null \
                | tr -d ' \n' \
                | grep -oP '"id":"\K[^"]+(?=","name":"groups","protocol":"openid-connect","attributes")' \
                | head -1 || true)
              if [ -z "$SCOPE_ID" ]; then echo "FATAL: 'groups' client-scope not found"; exit 1; fi
              echo "  'groups' client-scope uuid=${SCOPE_ID:0:8}..."

              # --- Idempotency: skip if a mapper named 'groups' already exists on the scope ---
              MAPS=$("$KCADM" get "client-scopes/$SCOPE_ID/protocol-mappers/models" -r "$REALM" 2>/dev/null || true)
              if echo "$MAPS" | grep -Eq '"name" *: *"groups"'; then
                echo "  [OK] 'groups' mapper already present — nothing to do"; exit 0
              fi

              # --- POST the Group Membership mapper via raw /dev/tcp ---
              PAYLOAD='{"name":"groups","protocol":"openid-connect","protocolMapper":"oidc-group-membership-mapper","consentRequired":false,"config":{"claim.name":"groups","full.group.path":"true","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true","multivalued":"true","jsonType.label":"String"}}'
              echo "  POSTing oidc-group-membership-mapper to the 'groups' scope..."
              HTTP_CODE=$({ exec 3<>"/dev/tcp/$KC_HOST/$KC_PORT"; \
                printf "POST /admin/realms/%s/client-scopes/%s/protocol-mappers/models HTTP/1.1\r\n" "$REALM" "$SCOPE_ID" >&3; \
                printf "Host: %s:%s\r\n" "$KC_HOST" "$KC_PORT" >&3; \
                printf "Authorization: Bearer %s\r\n" "$ADMIN_TOKEN" >&3; \
                printf "Content-Type: application/json\r\n" >&3; \
                printf "Content-Length: %s\r\n" "${#PAYLOAD}" >&3; \
                printf "Connection: close\r\n" >&3; \
                printf "\r\n" >&3; \
                printf "%s" "$PAYLOAD" >&3; \
                head -1 <&3; \
                exec 3>&-; } 2>/dev/null || echo "FAILED")
              echo "  response: $HTTP_CODE"
              if ! echo "$HTTP_CODE" | grep -qE ' 20[014]'; then
                echo "FATAL: mapper POST did not succeed: ${HTTP_CODE:-no-response}"; exit 1
              fi

              # --- Verify ---
              MAPS2=$("$KCADM" get "client-scopes/$SCOPE_ID/protocol-mappers/models" -r "$REALM" 2>/dev/null || true)
              if echo "$MAPS2" | grep -Eq '"name" *: *"groups"'; then
                echo "=== groups mapper created & verified ==="
              else
                echo "FATAL: mapper not found after create"; exit 1
              fi
          env:
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: adminPassword
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
