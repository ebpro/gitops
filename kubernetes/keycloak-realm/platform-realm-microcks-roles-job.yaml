apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-microcks-roles-cumulative-20260818-r6
  namespace: keycloak
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kcadm-setup
          image: quay.io/keycloak/keycloak:26.7.0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              KCADM=/opt/keycloak/bin/kcadm.sh
              KC_SERVER=http://keycloak-http.keycloak.svc.cluster.local:80
              REALM="platform"

              echo "=== microcks-app cumulative role setup (user<manager<admin) ==="
              echo "Microcks 1.13.2 Spring Security checks are strict per-path:"
              echo "  GET /api/services/{id} and /api/services/search require ROLE_user,"
              echo "  so higher roles must be granted together with lower ones."

              # --- Login (with retry) ---
              LOGIN_RETRIES=20
              for attempt in $(seq 1 $LOGIN_RETRIES); do
                printf "  Login attempt %d/%d... " "$attempt" "$LOGIN_RETRIES"
                if "$KCADM" config credentials \
                  --server "$KC_SERVER" \
                  --realm master \
                  --user admin \
                  --password "$KEYCLOAK_ADMIN_PASSWORD" 2>/dev/null; then
                  echo "OK"
                  break
                fi
                if [ "$attempt" -eq "$LOGIN_RETRIES" ]; then
                  echo "FATAL: Authentication failed after $LOGIN_RETRIES attempts"
                  exit 1
                fi
                echo "retrying..."
                sleep 10
              done

              id_of() { grep -oP '"id"\s*:\s*"\K[^"]+' | head -1; }

              # --- Extract admin token from kcadm session (KC26 kcadm has no
              #     generic 'add' subcommand and the image ships no curl, so
              #     grants go through direct REST over /dev/tcp) ---
              ADMIN_TOKEN=$(grep -oP '"token"\s*:\s*"\K[^"]+' /opt/keycloak/.keycloak/kcadm.config 2>/dev/null || true)
              if [ -z "$ADMIN_TOKEN" ]; then
                echo "FATAL: Could not extract admin token from kcadm session"
                exit 1
              fi
              printf "  admin token extracted (%d chars)\n" "${#ADMIN_TOKEN}"

              # --- Resolve microcks-app client ---
              APP_UUID=$("$KCADM" get clients -r "$REALM" -q clientId=microcks-app 2>/dev/null | id_of || true)
              if [ -z "$APP_UUID" ]; then
                echo "FATAL: microcks-app client not found"
                exit 1
              fi
              echo "  microcks-app client found (uuid=${APP_UUID:0:8}...)"

              # --- Resolve the three client role ids (KC26 spaced JSON) ---
              ROLE_DOC=$("$KCADM" get "clients/$APP_UUID/roles" -r "$REALM" 2>/dev/null)
              role_id() {
                echo "$ROLE_DOC" | tr -d ' \n' | \
                  grep -oP "\"id\":\"[^\"]+\",\"name\":\"$1\"" | \
                  grep -oP '(?<="id":")[^"]+' | head -1
              }
              ROLE_ADMIN=$(role_id admin || true)
              ROLE_MANAGER=$(role_id manager || true)
              ROLE_USER=$(role_id user || true)
              for v in "admin=$ROLE_ADMIN" "manager=$ROLE_MANAGER" "user=$ROLE_USER"; do
                if [ -z "${v#*=}" ]; then
                  echo "FATAL: role ${v%%=*} not found on microcks-app (create from realm export first)"
                  exit 1
                fi
              done
              echo "  roles resolved: admin=${ROLE_ADMIN:0:8}... manager=${ROLE_MANAGER:0:8}... user=${ROLE_USER:0:8}..."

              # --- Helper: POST a client-role-mapping payload (idempotent: 201 new / 204 existing) ---
              post_role_mapping() {
                local kind="$1" uuid="$2" payload="$3"
                local http_code
                http_code=$({ exec 5<>/dev/tcp/keycloak-http.keycloak.svc.cluster.local/80; \
                  printf "POST /admin/realms/%s/%s/%s/role-mappings/clients/%s HTTP/1.1\r\n" "$REALM" "$kind" "$uuid" "$APP_UUID" >&5; \
                  printf "Host: keycloak-http.keycloak.svc.cluster.local:80\r\n" >&5; \
                  printf "Authorization: Bearer %s\r\n" "$ADMIN_TOKEN" >&5; \
                  printf "Content-Type: application/json\r\n" >&5; \
                  printf "Content-Length: %s\r\n" "${#payload}" >&5; \
                  printf "Connection: close\r\n" >&5; \
                  printf "\r\n" >&5; \
                  printf "%s" "$payload" >&5; \
                  head -1 <&5; \
                  exec 5>&-; \
                  } 2>/dev/null || echo "FAILED")
                echo "$http_code"
              }

              # --- Helper: idempotently grant one client role to a target (user|group) ---
              grant() {
                local kind="$1" uuid="$2" rname="$3" rid="$4"
                local payload http_code
                payload='[{"id":"'"$rid"'","name":"'"$rname"'","clientRole":true,"composite":false,"containerId":"'"$APP_UUID"'"}]'
                http_code=$(post_role_mapping "$kind" "$uuid" "$payload")
                if echo "$http_code" | grep -qE ' 20[14]'; then
                  echo "    granted $kind/$(echo "$uuid" | cut -c1-8)... -> microcks-app:$rname (HTTP $(echo "$http_code" | awk '{print $2}'))"
                else
                  echo "  WARNING: grant $kind -> $rname returned: ${http_code:-no-response}"
                fi
              }

              # --- Group -> cumulative role mappings ---
              group_uuid() {
                "$KCADM" get groups -r "$REALM" -q search="$1" 2>/dev/null | id_of || true
              }
              declare -A GROUP_ROLES=(
                ["platform-admins"]="admin manager user"
                ["platform-engineers"]="manager user"
                ["developers"]="manager user"
                ["readonly"]="user"
              )
              for g in platform-admins platform-engineers developers readonly; do
                GID=$(group_uuid "$g")
                if [ -z "$GID" ]; then
                  echo "FATAL: group $g not found"
                  exit 1
                fi
                echo "  group $g (uuid=${GID:0:8}...): ${GROUP_ROLES[$g]}"
                for r in ${GROUP_ROLES[$g]}; do
                  case "$r" in
                    admin) RID=$ROLE_ADMIN;;
                    manager) RID=$ROLE_MANAGER;;
                    user) RID=$ROLE_USER;;
                  esac
                  grant groups "$GID" "$r" "$RID"
                done
              done

              # --- microcks-ci service account -> full role set ---
              SVC_USER=$("$KCADM" get users -r "$REALM" -q username=service-account-microcks-ci 2>/dev/null | id_of || true)
              if [ -z "$SVC_USER" ]; then
                echo "FATAL: service-account-microcks-ci user not found"
                exit 1
              fi
              echo "  service account user (uuid=${SVC_USER:0:8}...): admin manager user"
              grant users "$SVC_USER" admin "$ROLE_ADMIN"
              grant users "$SVC_USER" manager "$ROLE_MANAGER"
              grant users "$SVC_USER" user "$ROLE_USER"

              # --- Verification (KC26 prints Jackson-style spaced JSON) ---
              echo "=== verifying mappings ==="
              verify() {
                local kind="$1" uuid="$2" label="$3"
                shift 3
                local maps
                maps=$("$KCADM" get "$kind/$uuid/role-mappings/clients/$APP_UUID" -r "$REALM" 2>/dev/null || true)
                local missing=0
                for r in "$@"; do
                  if echo "$maps" | grep -Eq '"name" *: *"'"$r"'"'; then
                    echo "    [OK] $label -> microcks-app:$r"
                  else
                    echo "  MISSING: $label -> microcks-app:$r"
                    missing=1
                  fi
                done
                return $missing
              }
              FAIL=0
              GID=$(group_uuid "platform-admins");    verify groups "$GID" "platform-admins" admin manager user || FAIL=1
              GID=$(group_uuid "platform-engineers"); verify groups "$GID" "platform-engineers" manager user || FAIL=1
              GID=$(group_uuid "developers");         verify groups "$GID" "developers" manager user || FAIL=1
              GID=$(group_uuid "readonly");           verify groups "$GID" "readonly" user || FAIL=1
              verify users "$SVC_USER" "service-account-microcks-ci" admin manager user || FAIL=1
              if [ "$FAIL" -ne 0 ]; then
                echo "FATAL: verification failed"
                exit 1
              fi
              echo "=== microcks-app cumulative role setup complete ==="
          env:
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: adminPassword
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
