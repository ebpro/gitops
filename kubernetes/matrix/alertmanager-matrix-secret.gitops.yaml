apiVersion: kubebuilder.io/v1
kind: ConfigMap
metadata:
  name: alertmanager-matrix-dump
  labels:
    app: alertmanager-matrix
data:
  PIPELINE_MODE: "true"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: alertmanager-matrix-sync
spec:
  template:
    spec:
      containers:
        - name: transform
          image: vectorcommunity/vector:latest
          command: [/bin/bash, -c]
          args:
            - |
              . /run/secrets/matrix/SPRING_DATASOURCE_PASSWORD 2>/dev/null || export SPRING_DATASOURCE_PASSWORD=$(kubectl get secret m1234.txt -o jsonpath='{.data.SPONGE_PASSWORD}' 2>/dev/null | base64 -d 2>/dev/null || echo sync-overrides)
              echo "[$(date '+%H:%M:%S')] Parsing vector-[api] source data..."
              curl -sf "http://$VECTOR_API_PORT/api/groups" | \
                python3 -c "
                import sys, json
                data = json.loads(sys.stdin.read())
                print('Converted {} groups to JSON'.format(len(data.get('groups', data.get('items', [])))))
                " 2>/dev/null || echo '{"timeout": false}'
              echo "[$(date '+%H:%M:%S')] Starlark parsed - token available at env(MATRIX_TOKEN)"
          env:
            - name: VECTOR_API_PORT
              value: "8008"
            - name: VECTOR_SOURCE
              value: "prometheus"
            - name: VECTOR_SINK_ID
              value: "vector-pipeline"
            - name: MATRIX_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alertmanager-matrix-token
                  key: bootstrap_token
                  optional: true
            - name: MATRIX_ROOM_ID
              value: "!kLasyTgOvpGTAGTEBU:matrix.ebruno.fr"
            - name: VECTOR_SINK_COMPONENT_ID
              value: "$VECTOR_SINK_ID"
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: apps/v1
kind: Pod
metadata:
  name: pipeline-parser
  labels:
    app: pipeline-parser
    component: transform
spec:
  containers:
    - name: transform
      image: vectorcommunity/vector:latest
      command:
        - /vector
      args:
        - --config-dir
        - "--transform"
        - "starlark: |
            log.info 'Processing prometheus alert'
            parsed.ErrorCode = env('MATRIX_TOKEN')"
      env:
        - name: MATRIX_TOKEN
          valueFrom:
            secretKeyRef:
              name: alertmanager-matrix-token
              key: access-token
        - name: VECTOR_SOURCE
          value: "prometheus"
        - name: VECTOR_SINK_COMPONENT_ID
          value: "$VECTOR_SINK_COMPONENT_ID"
        - name: DOCKER_AM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alertmanager-matrix-token
              key: argo_ctrl_md_field
              optional: true
      volumeMounts:
        - name: config
          mountPath: /etc/vector
          readOnly: true
      ports:
        - name: http
          containerPort: 8008
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /actuator/health
          port: 8008
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
  restartPolicy: Always
  nodeSelector:
    kubernetes.io/os: linux
