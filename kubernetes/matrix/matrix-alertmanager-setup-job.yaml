apiVersion: batch/v1
kind: Job
metadata:
  name: matrix-alertmanager-setup
  namespace: keycloak
  annotations: {}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: quay.io/keycloak/keycloak:26.7.0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              KC_SERVER="http://keycloak-http.keycloak.svc.cluster.local:80"
              KCADMIN="/opt/keycloak/bin/kcadm.sh"
              SYNAPSE="http://synapse.synapse.svc.cluster.local:8008"
              MATRIX_ROOM="!kLasyTgOvpGTAGTEBU:matrix.ebruno.fr"
              USERNAME="gitops-user"
              KC_PASSWORD="${GITOPS_USER_PASSWORD}"
              KEYCLOAK_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}"

              echo "[1/6] Waiting for Keycloak admin API..."
              for i in $(seq 1 20); do
                if "$KCADMIN" config credentials \
                  --server "$KC_SERVER" \
                  --realm master \
                  --user admin \
                  --password "$KEYCLOAK_ADMIN_PASSWORD" 2>/dev/null; then
                  break
                fi
                echo "  Keycloak not ready (attempt $i/20), retrying..."
                sleep 10
              done

              echo "[2/6] Setting password for gitops-user in Keycloak..."
              UID=$("$KCADMIN" get users -r platform -q "username=$USERNAME" 2>/dev/null | \
                python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'])" 2>/dev/null || true)
              if [ -z "$UID" ]; then
                echo "  User $USERNAME not found in Keycloak realm"
                exit 1
              fi
              "$KCADMIN" set-password --username "$USERNAME" --new-password "$KC_PASSWORD" -r platform

              echo "[3/6] Waiting for Synapse..."
              for i in $(seq 1 30); do
                if curl -sf "$SYNAPSE/_matrix/client/versions" >/dev/null 2>&1; then
                  break
                fi
                echo "  Synapse not ready (attempt $i/30), retrying..."
                sleep 10
              done

              echo "[4/6] Obtaining Keycloak OIDC token..."
              OIDC_TOKEN=$(curl -sf \
                -d "grant_type=password" \
                -d "client_id=admin-cli" \
                -d "username=$USERNAME" \
                -d "password=$KC_PASSWORD" \
                -d "audience=synapse" \
                "https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/token" | \
                python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
              echo "  OIDC token obtained (${#OIDC_TOKEN} chars)"

              echo "[5/6] Registering/Login in Synapse via CAS..."
              CAS_RESP=$(curl -sf \
                -d "ticket=$OIDC_TOKEN" \
                -d 'apiVersion=r0' \
                "$SYNAPSE/_matrix/client/v3/login/sso/redirect" 2>&1 || true)

              REDIRECT=$(echo "$CAS_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['redirect_url'])" 2>/dev/null || true)

              if [ -z "$REDIRECT" ]; then
                echo "  WARNING: No redirect. Checking for same_server response..."
                SAME=$(echo "$CAS_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('user_id','') or d.get('access_token',''))" 2>/dev/null || true)
                if echo "$CAS_RESP" | grep -q "access_token"; then
                  ACCESS_TOKEN_FRONTEND=$(echo "$CAS_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
                  USER_ID=$(echo "$CAS_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['user_id'])")
                  echo "  Direct login succeeded!"
                  echo ""
                  echo "========================================"
                  echo "  MATRIX_TOKEN=$ACCESS_TOKEN_FRONTEND"
                  echo "  USER_ID=$USER_ID"
                  echo "========================================"
                  echo ""
                  exit 0
                else
                  echo "  CAS response parsing failed. Raw response:"
                  echo "$CAS_RESP"
                  exit 1
                fi
              fi

              CALLBACK=$(echo "$REDIRECT" | sed -E 's|https?://[^/]+||')
              echo "  Following callback to: $CALLBACK"

              CALLBACK_RESP=$(curl -sf "$SYNAPSE$CALLBACK" 2>&1 || true)

              ACCESS_TOKEN_FRONTEND=$(echo "$CALLBACK_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])" 2>/dev/null || true)
              USER_ID=$(echo "$CALLBACK_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['user_id'])" 2>/dev/null || true)

              if [ -z "$ACCESS_TOKEN_FRONTEND" ] || [ -z "$USER_ID" ]; then
                echo "  WARNING: Login result has no token. Attempting fallback OIDC login..."
                FALLBACK=$(curl -sf \
                  -H "Authorization: Bearer $OIDC_TOKEN" \
                  "$SYNAPSE/_synapse/client/pickid/keycloak" 2>&1)
                PICKID_URL=$(echo "$FALLBACK" | python3 -c "import sys,json; print(json.load(sys.stdin).get('login_url', json.load(sys.stdin).get('redirectUrl','')))" 2>/dev/null || true)
                if [ -n "$PICKID_URL" ]; then
                  CALLBACK_PATH=$(echo "$PICKID_URL" | sed -E 's|https?://[^/]+||')
                  CALLBACK_RESP=$(curl -sf "$SYNAPSE$CALLBACK_PATH" 2>&1 || true)
                  ACCESS_TOKEN_FRONTEND=$(echo "$CALLBACK_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])" 2>/dev/null || true)
                  USER_ID=$(echo "$CALLBACK_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['user_id'])" 2>/dev/null || true)
                fi
              fi

              if [ -z "$ACCESS_TOKEN_FRONTEND" ]; then
                echo "  ERROR: failed to obtain Matrix access token"
                echo "  CAS Response: $CAS_RESP"
                echo "  Callback Response: $CALLBACK_RESP"
                exit 1
              fi

              echo "  Synapse login succeeded! User: $USER_ID"

              echo "[6/6] Joining room $MATRIX_ROOM..."
              curl -sf \
                -H "Authorization: Bearer $ACCESS_TOKEN_FRONTEND" \
                -X JOIN \
                "$SYNAPSE/_matrix/client/v3_rooms/$MATRIX_ROOM/join" >/dev/null 2>&1 || {
                echo "  (Room join may have failed - checking if API differs...)"
                curl -sf \
                  -H "Authorization: Bearer $ACCESS_TOKEN_FRONTEND" \
                  -X POST \
                  -d "{\"room_id\": \"$MATRIX_ROOM\"}" \
                  "$SYNAPSE/_matrix/client/v3/join/$MATRIX_ROOM" >/dev/null 2>&1 || true
              }
              echo "  Room join attempted."

              echo ""
              echo "========================================"
              echo "  MATRIX_TOKEN=$ACCESS_TOKEN_FRONTEND"
              echo "  USER_ID=$USER_ID"
              echo "========================================"
              echo ""
            env:
              - name: KEYCLOAK_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: keycloak-secrets
                    key: adminPassword
              - name: GITOPS_USER_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: keycloak-secrets
                    key: gitopsUserPassword
              - name: CURL_CA_BUNDLE
                value: /etc/ssl/certs/ca-certificates.crt
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
