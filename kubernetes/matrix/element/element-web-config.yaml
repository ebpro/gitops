apiVersion: v1
kind: ConfigMap
metadata:
  name: element-web-config
  namespace: element
data:
  config.json: |
    {
      "default_country_code": "FR",
      "show_labs_settings": false,
      "features": {
        "feature.sso": true
      },
      "default_hs_url": "https://matrix.ebruno.fr",
      "brand": "Element",
      "integrations_ui_url": "",
      "integrations_rest_url": "",
      "integrations_widgets_urls": [],
      "bug_report_endpoint_url": "",
      "update_base_url": "",
      "enable_cross_proxying_tokens": false,
      "setting_defaults": {
        "Rageshake": {
          "enabled": false
        }
      },
      "screensharing": {
        "chrome_media_source_debug": false
      },
      "jitsi": {
        "preferredDomain": "meet.element.io"
      },
      "voip": {
        "obey_validation_highlight": true,
        "use_mcu": true
      },
      "map_style_url": "",
      "posthog": {
        "projectAPIKey": "",
        "apiHost": ""
      },
      "roomDirectory": {
        "servers": []
      },
      "enable_set_displayname": true
    }
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /app;
        index index.html;

        client_max_body_size 50M;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /config.json {
            alias /config/config.json;
        }

        location /_matrix {
            proxy_pass http://synapse.synapse.svc.cluster.local:8008;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
