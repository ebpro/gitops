apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  namespace: element
  labels:
    app: element-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: element-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: element-web
    spec:
      containers:
        - name: element-web
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          volumeMounts:
            - name: element-web-app
              mountPath: /app
              readOnly: true
            - name: element-web-config
              mountPath: /config
              readOnly: true
            - name: element-nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      initContainers:
        - name: download-element
          image: vectorim/element-web:11.8.3
          command:
            - sh
            - -c
            - |
              cp -r /app/* /mnt/app/
              echo "Element web assets copied"
          volumeMounts:
            - name: element-web-app
              mountPath: /mnt/app
      volumes:
        - name: element-web-app
          emptyDir:
            sizeLimit: 300Mi
        - name: element-web-config
          configMap:
            name: element-web-config
        - name: element-nginx-conf
          configMap:
            name: element-web-config
