apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-homeserver
  namespace: synapse
data:
  homeserver.yaml: |
    # Server Identification
    server_name: "matrix.ebruno.fr"
    pid_file: /data/homeserver.pid
    report_stats: false
    listeners:
      - port: 8008
        tls: false
        type: http
        x_forwarded: true
        resources:
          - names: [client, federation]
            compress: false
      - port: 9090
        tls: false
        type: http
        x_forwarded: false
        resources:
          - names: [metrics]
            compress: false

    # Signing Keys
    signing_key_path: /data/signing.key.matrix.ebruno.fr
    trusted_key_servers:
      - server_name: "matrix.org"

    # Database (PostgreSQL via CNPG)
    database:
      name: psycopg2
      args:
        host: matrix-db-rw.synapse.svc.cluster.local
        port: 5432
        user: postgres
        password: SYNAPSE_DB_PASSWORD_PLACEHOLDER
        database: synapse
        cp_min: 5
        cp_max: 10

    # Media Storage
    media_store_path: /data/media
    dynamic_thumbnails: false

    # Registration disabled - SSO only
    enable_registration: false
    enable_registration_cas: false
    enable_3pid_lookup: false

    # OIDC / SSO Authentication (Keycloak)
    oidc_discovery_endpoint: "https://keycloak.ebruno.fr/realms/platform/.well-known/openid-configuration"
    oidc_client_id: "synapse"
    oidc_client_secret: SYNAPSE_OIDC_SECRET_PLACEHOLDER
    oidc_allow_existing_users: true
    oidc_auto_redirect: true
    oidc_skip_verification: false
    oidc_provision_enabled: true
    oidc_permit_explicit_sign_up: true
    oidc_icon: "sso"
    oidc_displayname_claims: ["displayname", "nickname", "name"]

    # User Attribute Mapping
    oidc_username_from_auth_server: false
    oidc_username_template: '${utf8email.local}'
    oidc_email_required: true

    # Login (disable password login, enforce OIDC)
    oauth_enabled: false
    experimental_enable_password_auth: false

    # Well-known discovery
    public_baseurl: "https://matrix.ebruno.fr"
    server_base_url: "https://matrix.ebruno.fr"

    # Media & upload limits
    max_request_body_size: "50M"
    max_upload_size: "50M"
    max_avatar_size: "10M"

    # Metrics
    enable_metrics: true

    # DNS/Reputation (single node, no reputation needed)
    macaroon_retry_convert_seconds: 0
