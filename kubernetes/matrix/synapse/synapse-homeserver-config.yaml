apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-homeserver
  namespace: synapse
data:
  homeserver.yaml: |
    # Server Identification
    server_name: "matrix.ebruno.fr"
    pid_file: /data/homeserver.pid
    report_stats: false
    listeners:
      - port: 8008
        tls: false
        type: http
        x_forwarded: true
        resources:
          - names: [client, federation]
            compress: false
      - port: 9090
        tls: false
        type: http
        x_forwarded: false
        resources:
          - names: [metrics]
            compress: false

    # Signing Keys
    signing_key_path: /data/signing.key.matrix.ebruno.fr
    trusted_key_servers:
      - server_name: "matrix.org"
    suppress_key_server_warning: true

    # Database (PostgreSQL via CNPG)
    database:
      name: psycopg2
      args:
        host: matrix-db-rw.synapse.svc.cluster.local
        port: 5432
        user: postgres
        password: SYNAPSE_DB_PASSWORD_PLACEHOLDER
        database: synapse
        cp_min: 5
        cp_max: 10

    # Media Storage
    media_store_path: /data/media
    dynamic_thumbnails: false

    # Registration disabled - SSO only
    enable_registration: true
    enable_registration_cas: false
    enable_3pid_lookup: false

    # Admin registration API for alertmanager bot (persistent token, never expires)
    registration_shared_secret: "synapse-alertmanager-bot-reg-2026-XK9mP2qR7vN3wZ8f"

    # OIDC / SSO Authentication (Keycloak) - new provider list format
    macaroon_secret_key: "MATRIX-BRUNO-SECURE-SECRET-KEY-2026"

    # OIDC / SSO Authentication (Keycloak) - new provider list format
    oidc_providers:
      - idp_id: keycloak
        idp_name: "Keycloak SSO"
        issuer: "https://keycloak.ebruno.fr/realms/platform"
        client_id: "synapse"
        client_secret: SYNAPSE_OIDC_SECRET_PLACEHOLDER
        client_auth_method: client_secret_post
        discover: true
        skip_verification: false
        auto_register: true
        user_mapping_provider:
          module: synapse.handlers.oidc.JinjaOidcMappingProvider
          config:
            localpart_template: "{{ ((email | default('')) | lower).split('@')[0] if (email | default('')) else (preferred_username | default('user')) | lower }}"
            displayname_template: "{{ (given_name | default('') ~ ' ' ~ (family_name | default(''))) | trim }}"
            emails:
              - '{{ email | default("") }}'

    # SSO settings (applies to all providers)
    sso:
      enable_username_in_pickle: true

    # Login (disable password login, enforce OIDC)
    experimental_enable_password_auth: true

    # Well-known discovery
    public_baseurl: "https://matrix.ebruno.fr"
    server_base_url: "https://matrix.ebruno.fr"

    # Media & upload limits
    max_request_body_size: "50M"
    max_upload_size: "50M"
    max_avatar_size: "10M"

    # Require registration via SSO
    macaroon_retry_convert_seconds: 0
