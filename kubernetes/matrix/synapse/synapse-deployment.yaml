apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synapse
  namespace: synapse
  labels:
    app: synapse
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  revisionHistoryLimit: 10
  serviceName: synapse
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      annotations:
        synapse-image-hash: "45d1347"
      labels:
        app: synapse
    spec:
      volumes:
        - name: synapse-config
          configMap:
            name: synapse-homeserver
            defaultMode: 0644
        - name: synapse-db-secret
          secret:
            secretName: matrix-db-superuser
        - name: synapse-oidc-secret
          secret:
            secretName: synapse-oidc-secret
      containers:
        - name: synapse
          image: ghcr.io/element-hq/synapse:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8008
              protocol: TCP
              name: http
            - containerPort: 9090
              protocol: TCP
              name: metrics
          env:
            - name: SYNAPSE_CONFIG_PATH
              value: /data/homeserver.yaml
            - name: SYNAPSE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matrix-db-superuser
                  key: password
            - name: SYNAPSE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: synapse-oidc-secret
                  key: SYNAPSE_OIDC_CLIENT_SECRET
          volumeMounts:
            - name: synapse-data
              mountPath: /data
            - name: synapse-config
              mountPath: /config
              readOnly: true
            - name: synapse-db-secret
              mountPath: /secrets/db-password
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8008
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 10
            periodSeconds: 10
      initContainers:
        - name: wait-for-db
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              COUNT=0
              until nslookup matrix-db-rw.synapse.svc.cluster.local >/dev/null 2>&1; do
                COUNT=$((COUNT + 1))
                [ $COUNT -ge 120 ] && { echo "DNS timeout"; exit 1; }
                echo "Waiting for DNS... ($COUNT/120)"
                sleep 1
              done
              echo "PostgreSQL DNS ready"
        - name: create-db
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              PGPASSWORD=$POSTGRES_PASSWORD psql -h matrix-db-rw.synapse.svc.cluster.local \
                -U postgres -c "CREATE DATABASE synapse;" 2>/dev/null || true
              echo "Synapse database ready"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matrix-db-superuser
                  key: password
        - name: copy-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              PW=$(cat /secrets/db-password/password)
              OIDC=$(cat /secrets/oidc/SYNAPSE_OIDC_CLIENT_SECRET)
              sed -e "s|SYNAPSE_DB_PASSWORD_PLACEHOLDER|${PW}|g" \
                  -e "s|SYNAPSE_OIDC_SECRET_PLACEHOLDER|${OIDC}|g" \
                /config/homeserver.yaml > /data/homeserver.yaml
              chmod 600 /data/homeserver.yaml
              chown 991:991 /data/homeserver.yaml 2>/dev/null || true
          volumeMounts:
            - name: synapse-config
              mountPath: /config
              readOnly: true
            - name: synapse-db-secret
              mountPath: /secrets/db-password
              readOnly: true
            - name: synapse-oidc-secret
              mountPath: /secrets/oidc
              readOnly: true
            - name: synapse-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: synapse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        volumeMode: Filesystem
        resources:
          requests:
            storage: 10Gi
