# Vault-backed management token for Reposilite.
#
# - Source:  Vault path `secret/reposilite`, key `token` (64-hex, never committed).
# - Target:  K8s Secret `reposilite-management` in ns `reposilite`, with two keys:
#     token          -> the raw secret (for console/API Basic auth: user `root`, password <token>)
#     reposiliteOpts -> the full REPOSILITE_OPTS value, so the Helm values only reference
#                       a secretKeyRef (the value is never rendered into git).
#
# Applied by the `reposilite-secrets` manifests Application (see bootstrap/appset-manifests.yaml).
# Pattern mirrors kubernetes/postgresql/nexus-postgresql-external-secret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reposilite-management
  namespace: reposilite
spec:
  dataFrom:
  - extract:
      key: reposilite
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: reposilite-management
    template:
      data:
        # Raw token — used for console/API auth: Basic base64("root:<token>").
        token: '{{ .token }}'
        # Full container flag string. The image entrypoint runs
        # `java -jar reposilite.jar $REPOSILITE_OPTS` (word-split), so this single
        # value carries BOTH the shared-configuration path and the management token.
        # `--token root:<value>` creates a temporary manager token named `root`;
        # it is re-created from this env on every start (not DB-persisted).
        reposiliteOpts: '--shared-configuration=/app/data/configuration.shared.json --token root:{{ .token }}'
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/instance: reposilite
          app.kubernetes.io/part-of: reposilite
      type: Opaque
