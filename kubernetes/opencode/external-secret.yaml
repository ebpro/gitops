apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode-secrets
  namespace: opencode
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/component: agent-server
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: opencode-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - remoteRef:
        key: secret/opencode
        property: serverPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: serverPassword
    - remoteRef:
        key: secret/opencode
        property: vllmApiKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: vllmApiKey
    - remoteRef:
        key: secret/opencode
        property: lisLabApiKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: lisLabApiKey
    - remoteRef:
        key: secret/opencode
        property: sonarToken
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: sonarToken
    - remoteRef:
        key: secret/opencode
        property: githubToken
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: githubToken
    - remoteRef:
        key: secret/opencode
        property: giteaToken
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: giteaToken
    - remoteRef:
        key: secret/opencode
        property: woodpeckerToken
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: woodpeckerToken
    - remoteRef:
        key: secret/opencode
        property: gitopsGiteaToken
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: gitopsGiteaToken
