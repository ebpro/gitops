apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth
  namespace: opencode
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/checkauth
    trustForwardHeader: true
    authResponseHeaders:
      - Gap-Auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth-headers
  namespace: opencode
spec:
  headers:
    sslRedirect: true
    sslHost: opencode.ebruno.fr
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opencode-ingress
  namespace: opencode
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`opencode.ebruno.fr`) && PathPrefix(`/oauth2/`)
      priority: 20
      services:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 4180
    - kind: Rule
      match: Host(`opencode.ebruno.fr`) && !PathPrefix(`/oauth2/`)
      priority: 10
      middlewares:
        - name: fwd-auth
        - name: fwd-auth-headers
      services:
        - name: opencode
          namespace: opencode
          port: 4096
  tls:
    certResolver: letsencrypt-ovh
