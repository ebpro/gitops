# =============================================================================
# Backstage catalog — 6-system realignment (Phase 1)
# Polled by Backstage (NOT ArgoCD-synced) from this raw URL.
# Structure: 1 Domain, 6 Systems, 35 Components, 1 API, 12 Resources, 1 Group, 1 User.
# Relations (partOf / dependsOn / memberOf / consumesApi) carry all structure;
# the Group no longer lists children.
# =============================================================================
