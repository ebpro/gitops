# verify on deploy — serviceAccount auth is ignored on catalog cluster entities;
# the config-based locator in values.yaml is the working in-cluster connection.
# This Resource maps entities to the cluster BY NAME (local-cluster) under multiTenant.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: local-cluster
  description: Single K3s cluster (local-cluster) — the platform's only Kubernetes cluster
  annotations:
    kubernetes.io/api-server: https://kubernetes.default.svc
    kubernetes.io/api-server-certificate-authority: ""
    kubernetes.io/auth-provider: serviceAccount
spec:
  type: kubernetes-cluster
  lifecycle: production
  owner: group/platform
---
