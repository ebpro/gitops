apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault-active.vault.svc.cluster.local:8200
      path: secret
      version: v2
      namespace: external-secrets
      auth:
        approle:
          path: approle
          roleRef:
            key: role-id
            name: vault-approle
            namespace: external-secrets
          secretRef:
            key: secret-id
            name: vault-approle
            namespace: external-secrets
