apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-app-vars
  namespace: plane
data:
  API_KEY_RATE_LIMIT: 60/minute
  CORS_ALLOWED_ORIGINS: https://plane.ebruno.fr
  DEBUG: "0"
  DOCKERIZED: "1"
  GUNICORN_WORKERS: "1"
  MINIO_ENDPOINT_SSL: "0"
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: ""
  WEB_URL: https://plane.ebruno.fr
  PLANE_URL: https://plane.ebruno.fr
  AMQP_URL: redis://plane-redis.plane.svc.cluster.local:6379/1
