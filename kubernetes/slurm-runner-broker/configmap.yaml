# Non-secret broker knobs (consumed via envFrom). Secrets (App creds, SSH keypair)
# are separate: see external-secret-github.yaml / external-secret-ssh.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: broker-config
  namespace: slurm-runner-broker
  labels:
    app.kubernetes.io/name: slurm-runner-broker
data:
  # Submit gateway (ssh:22, sbatch). NO slurmrestd on SMS — ssh is the only channel.
  # Phase 1 authenticates as the lab account; a dedicated `ghaci` user is future
  # work (see README runbook §Phase-2).
  # sms-ext (192.168.4.2) verified 2026-10-19: same resolution + TCP/22 open from
  # workstation AND in-cluster; the previous cluster-internal gateway name is dead
  # (cluster-side NXDOMAIN) — do not fall back to it.
  SMS_HOST: "sms-ext.lis-lab.fr"
  SLURM_USER: "emmanuel.bruno"
  # GitHub org whose queued runs are polled + where runners register.
  GH_ORG: "ebpro"
  # Slurm partition + job shape for one ephemeral runner.
  SLURM_PARTITION: "ouranos"
  SLURM_CPUS: "8"
  SLURM_MEM: "16G"
  SLURM_TIME: "01:30:00"
  # Ephemeral-runner image imported by enroot on the compute nodes. MUST stay
  # digest-pinned: broker.py refuses to start on a tag (job-template.sh keys the
  # image cache by digest, never by tag).
  RUNNER_IMAGE: "harbor.ebruno.fr/quarkus-microservices/quarkus-ci-runner@sha256:9873f7da19a649c2b2e6eb1395a97174e01d27449ea307a44427a7de26a0e766"
  # Path where the job template is mounted in the broker pod (separate
  # broker-job-template ConfigMap, see job-template-configmap.yaml).
  JOB_TEMPLATE: "/etc/slurm-broker/job-template.sh"
  # Broker behavior.
  MAX_PARALLEL: "4"
  POLL_SECONDS: "15"
