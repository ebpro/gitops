# GitHub App creds for the broker. Mirrors kubernetes/arc/arc-github-creds-external-secret.yaml
# EXACTLY (same Vault leaf secret/data/github/arc-app, same key mapping via dataFrom
# extract + v2 template; the ARC App's installation already covers org-runner scopes
# for ebpro-org — no new App/keys minted here). Note ESO v2.7: any target labels would
# belong under spec.target.template.metadata.labels (spec.target.labels is PRUNED);
# none are needed for this consumer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slurm-broker-github
  namespace: slurm-runner-broker
  labels:
    app.kubernetes.io/name: slurm-runner-broker
    app.kubernetes.io/component: github-app-creds
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 24h
  target:
    name: slurm-broker-github
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        github_app_id: '{{ .github_app_id }}'
        github_app_installation_id: '{{ .github_app_installation_id }}'
        github_app_private_key: '{{ .github_app_private_key }}'
  dataFrom:
    - extract:
        key: github/arc-app
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
