# Slurm ephemeral-runner broker (Phase 1). Hardening precedent: kubernetes/ci/cache-server-deployment.yaml.
#
# The broker is currently ENABLED (spec.replicas = 1): it starts and
# polls/back off even if the runtime prerequisites are incomplete. The HPC
# smoke test (kubernetes/slurm-runner-broker/README.md) requires: SMS gate +
# broker key installed, netrc-format enroot .credentials under
# $HOME/.config/enroot, a prewarmed shared lz4 .sqsh cache, and a broker
# image / SMS gate version in lockstep with this repo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slurm-runner-broker
  namespace: slurm-runner-broker
  labels:
    app.kubernetes.io/name: slurm-runner-broker
    app.kubernetes.io/instance: slurm-runner-broker
spec:
  # tier is live (1 = enabled, 0 = inert); flip via signed commit — README step D
  replicas: 1
  # Single-instance semantics (in-memory dispatch state + poll loop): never let
  # two brokers overlap during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slurm-runner-broker
      app.kubernetes.io/instance: slurm-runner-broker
  template:
    metadata:
      # No synthetic rollout annotation any more: both images below are pinned
      # to an immutable digest, and changing that digest is itself the git-only
      # lever that alters the pod template and drives the Recreate rollout.
      # (kubectl rollout restart is not permitted on this ArgoCD-managed app.)
      labels:
        app.kubernetes.io/name: slurm-runner-broker
        app.kubernetes.io/instance: slurm-runner-broker
    spec:
      automountServiceAccountToken: false
      # Lab network (192.168.4.0/x) is only reachable from the host's network
      # stack, not from the Cilium pod overlay — the broker runs on the host
      # net. DNS follows the node's resolv.conf plus cluster search domains;
      # the lab-zone dnsConfig below only takes effect if dnsPolicy is
      # switched back to None (kept as the lab-DNS fallback).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      dnsConfig:
        nameservers:
          - 10.2.248.1
        searches:
          - lis-lab.fr
        options:
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
      # NOTE: image is harbor.ebruno.fr/library/* — Harbor "library" is a PUBLIC
      # project (verified via API), so no imagePullSecret is required here.
      # NOTE: no nodeSelector needed — the arm64 worker keeps its
      # kubernetes.io/arch=arm64:NoSchedule taint and this pod carries no
      # matching toleration, so it lands on the amd64 control-plane node,
      # which is also the host with a proven route to the lab LAN.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Secret volumes bind root:fsGroup at mode 04xx; ssh(1) insists on a
        # user-owned 0600 key inside $HOME/.ssh. Seed an emptyDir copy here
        # (same image, same uid) so the main container gets a real HOME.
        - name: seed-ssh
          # Same immutable digest as the broker container below.
          image: harbor.ebruno.fr/library/slurm-runner-broker@sha256:02b63cf9d00d79901b99a4af63990cfe4579dbd5298b3f7b72048a6f90be9e52
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cp /mnt/ssh-credentials/id_ed25519     /home/broker/.ssh/id_ed25519
              chmod 600 /home/broker/.ssh/id_ed25519
              cp /mnt/ssh-credentials/id_ed25519.pub /home/broker/.ssh/id_ed25519.pub
              chmod 644 /home/broker/.ssh/id_ed25519.pub
              cp /mnt/ssh-credentials/known_hosts    /home/broker/.ssh/known_hosts
              chmod 644 /home/broker/.ssh/known_hosts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ssh-credentials
              mountPath: /mnt/ssh-credentials
              readOnly: true
            - name: broker-ssh
              mountPath: /home/broker/.ssh
      containers:
        - name: broker
          # Pinned to an immutable digest, not :latest. This is the deploy
          # lever: Harbor tag sha-6d21861 (nested commit 6d21861, Woodpecker
          # pipeline 23) == this digest. A new broker build reaches the cluster
          # only when someone edits this line, so an unrelated CI push can never
          # move it, and a rollout can never pull a half-built image. To roll
          # back, put the previous digest back here (Harbor retains them).
          # imagePullPolicy below is IfNotPresent, deliberately: the digest is
          # immutable so a cached copy can never be stale, and the pod stops
          # depending on Harbor at start-up. Unset resolved to Always on the
          # live object, so every pod start re-contacted Harbor — on a cold
          # cluster boot the broker sat in ImagePullBackoff until Harbor and its
          # DB were up, for an image already on the node.
          image: harbor.ebruno.fr/library/slurm-runner-broker@sha256:02b63cf9d00d79901b99a4af63990cfe4579dbd5298b3f7b72048a6f90be9e52
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: broker-config
          volumeMounts:
            - name: slurm-broker-config
              mountPath: /etc/slurm-broker
              readOnly: true
            - name: broker-home
              mountPath: /home/broker
            - name: broker-ssh
              mountPath: /home/broker/.ssh
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        # defaultMode 0400 per hardening rule; per-item 0440 makes the files
        # group-readable for uid 10001 via fsGroup (secret volumes are chowned
        # to fsGroup). Nothing on disk ever holds the runner registration token.
        - name: ssh-credentials
          secret:
            secretName: slurm-broker-ssh
            defaultMode: 256  # 0400
            items:
              - key: ssh_private_key
                path: id_ed25519
                mode: 288  # 0440
              - key: ssh_public_key
                path: id_ed25519.pub
                mode: 292  # 0444
              - key: known_hosts
                path: known_hosts
                mode: 292  # 0444
        # One projected volume at /etc/slurm-broker: GitHub App credentials
        # (secret, per-item 0440 group-readable for uid 10001 via fsGroup) and
        # the job template (configmap, 0755). Unlike the old subPath mount, a
        # projected volume refreshes in place, so ConfigMap content changes
        # reach a running pod without a restart annotation.
        - name: slurm-broker-config
          projected:
            defaultMode: 256  # 0400 (every item below carries an explicit mode)
            sources:
              - secret:
                  name: slurm-broker-github
                  items:
                    - key: github_app_id
                      path: github/github_app_id
                      mode: 288  # 0440
                    - key: github_app_installation_id
                      path: github/github_app_installation_id
                      mode: 288  # 0440
                    - key: github_app_private_key
                      path: github/github_app_private_key
                      mode: 288  # 0440
              - configMap:
                  name: broker-job-template
                  items:
                    - key: job-template.sh
                      path: job-template.sh
                      mode: 493  # 0755
        - name: broker-home
          emptyDir: {}
        - name: broker-ssh
          emptyDir: {}
        - name: tmp
          emptyDir: {}
