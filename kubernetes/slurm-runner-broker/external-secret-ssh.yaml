# Broker SSH keypair + pinned host key for sms-ext.lis-lab.fr.
# Vault leaf secret/data/slurm/broker (keys: ssh_private_key, ssh_public_key,
# known_hosts) generated once by the Phase-1 provisioning (runbook step A pastes
# the PUBLIC half into SMS ~/.ssh/authorized_keys). NO template here on purpose:
# raw data->secretKey pass-through keeps the multi-line PEM/known_hosts payloads
# byte-exact (template-quoted multiline worked for the App key but is not needed).
# ESO v2.7: labels belong under spec.target.template.metadata.labels — none needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slurm-broker-ssh
  namespace: slurm-runner-broker
  labels:
    app.kubernetes.io/name: slurm-runner-broker
    app.kubernetes.io/component: ssh-keypair
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  refreshInterval: 24h
  target:
    name: slurm-broker-ssh
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ssh_private_key
      remoteRef:
        key: slurm/broker
        property: ssh_private_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ssh_public_key
      remoteRef:
        key: slurm/broker
        property: ssh_public_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: known_hosts
      remoteRef:
        key: slurm/broker
        property: known_hosts
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
