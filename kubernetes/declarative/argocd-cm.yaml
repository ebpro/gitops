apiVersion: v1
data:
  timeout.reconciliation: 180s
  url: https://argocd.ebruno.fr
  cluster.inClusterEnabled: "true"
  oidc.config: |
    issuer: https://keycloak.ebruno.fr/realms/platform
    clientID: argocd
    clientSecret: $CLIENT_SECRET_ARGOCD
    requestedScopes:
      - openid
      - profile
      - email
      - groups
    requestedIDTokenClaims:
      groups:
        essential: true
  sso: "true"
  sso.providers: oidc
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
