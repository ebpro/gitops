apiVersion: v1
data:
  timeout.reconciliation: 180s
  url: https://argocd.ebruno.fr
  cluster.inClusterEnabled: "true"
  oidc.config: |
    issuer: http://keycloak-http.keycloak.svc.cluster.local/realms/platform
    clientID: argocd
    clientSecret: $CLIENT_SECRET_ARGOCD
    requestedScopes:
      - openid
      - profile
      - email
    requestedIDTokenClaims: {}
  sso: "true"
  sso.providers: oidc
  resource.customizations.health: |
    traefik.io/v1alpha1/Middleware:
      health.lua: |
        hs = { status = "Healthy", message = "Managed by Traefik" }
    traefik.io/v1alpha1/ServersTransport:
      health.lua: |
        hs = { status = "Healthy", message = "Managed by Traefik" }
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
