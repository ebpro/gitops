apiVersion: v1
data:
  timeout.reconciliation: 180s
  url: https://argocd.ebruno.fr
  cluster.inClusterEnabled: "true"
  oidc.config: |
    issuer: https://keycloak.ebruno.fr/realms/platform
    clientID: argocd
    clientSecret: $CLIENT_SECRET_ARGOCD
    requestedScopes:
      - openid
      - profile
      - email
    requestedIDTokenClaims: {}
  rbac.policy.default: |
    # Keycloak groups → ArgoCD roles
    p, g:/platform-admins, role:admin
    p, g:/platform-engineers, role:projects-admin
    p, g:/developers, role:readonly
    p, g:/readonly, role:readonly
    p, g:/developers/qa-team, role:readonly
    p, g:/developers/security-team, role:readonly
  sso: "true"
  sso.providers: oidc
  resource.customizations.health: |
    traefik.io/v1alpha1/Middleware:
      health.lua: |
        hs = { status = "Healthy", message = "Managed by Traefik" }
    traefik.io/v1alpha1/ServersTransport:
      health.lua: |
        hs = { status = "Healthy", message = "Managed by Traefik" }
    apiextensions.k8s.io/v1/CustomResourceDefinition:
      health.lua: |
        hs = { status = "Healthy", message = "CRD exists" }
    admissionregistration.k8s.io/v1/MutatingWebhookConfiguration:
      health.lua: |
        hs = { status = "Healthy", message = "Webhook exists" }
    admissionregistration.k8s.io/v1/ValidatingWebhookConfiguration:
      health.lua: |
        hs = { status = "Healthy", message = "Webhook exists" }
    apps/v1/Deployment:
      health.lua: |
        hs = { status = "Healthy", message = "Deployment exists" }
    rbac.authorization.k8s.io/v1/ClusterRole:
      health.lua: |
        hs = { status = "Healthy", message = "ClusterRole exists" }
    rbac.authorization.k8s.io/v1/ClusterRoleBinding:
      health.lua: |
        hs = { status = "Healthy", message = "ClusterRoleBinding exists" }
    rbac.authorization.k8s.io/v1/Role:
      health.lua: |
        hs = { status = "Healthy", message = "Role exists" }
    rbac.authorization.k8s.io/v1/RoleBinding:
      health.lua: |
        hs = { status = "Healthy", message = "RoleBinding exists" }
    external-secrets.io/v1beta1/ExternalSecret:
      health.lua: |
        hs = { status = "Healthy", message = "ExternalSecret exists" }
    postgresql.cnpg.io/v1/Cluster:
      health.lua: |
        hs = { status = "Healthy", message = "CNPG Cluster exists" }
    core/v1/Secret:
      health.lua: |
        hs = { status = "Healthy", message = "Secret exists" }
    core/v1/Service:
      health.lua: |
        hs = { status = "Healthy", message = "Service exists" }
    core/v1/ServiceAccount:
      health.lua: |
        hs = { status = "Healthy", message = "ServiceAccount exists" }
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
