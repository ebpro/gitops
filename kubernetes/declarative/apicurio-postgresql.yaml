apiVersion: v1
kind: Service
metadata:
  name: apicurio-postgresql
  namespace: apicurio
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: apicurio
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      name: postgresql
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: apicurio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apicurio-postgresql
  namespace: apicurio
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: apicurio
    app.kubernetes.io/part-of: apicurio
spec:
  serviceName: apicurio-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: apicurio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: apicurio
    spec:
      containers:
        - name: postgresql
          image: docker.io/library/postgres:17
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apicurio-postgresql-auth
                  key: password
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: apicurio-postgresql-auth
                  key: username
            - name: POSTGRES_DB
              value: apicurio
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgresql
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
