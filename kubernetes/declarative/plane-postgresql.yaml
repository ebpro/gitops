apiVersion: v1
kind: Service
metadata:
  name: plane-postgresql
  namespace: plane
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: plane
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      name: postgresql
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: plane
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plane-postgresql
  namespace: plane
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: plane
    app.kubernetes.io/part-of: plane
spec:
  serviceName: plane-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: plane
    spec:
      containers:
        - name: postgresql
          image: docker.io/library/postgres:17
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-postgresql-auth
                  key: password
            - name: POSTGRES_USER
              value: plane
            - name: POSTGRES_DB
              value: plane
          ports:
            - containerPort: 5432
              name: postgresql
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plane-redis
  namespace: plane
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: plane
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: plane
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plane-redis
  namespace: plane
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: plane
    app.kubernetes.io/part-of: plane
spec:
  serviceName: plane-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: plane
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
