apiVersion: v1
kind: Service
metadata:
  name: plane-redis
  namespace: plane
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: plane
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: plane
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plane-redis
  namespace: plane
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: plane
    app.kubernetes.io/part-of: plane
spec:
  serviceName: plane-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: plane
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
