apiVersion: v1
kind: Service
metadata:
  name: gitea-postgresql
  namespace: gitea
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: gitea
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      name: postgresql
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: gitea
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-postgresql
  namespace: gitea
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
spec:
  serviceName: gitea-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: gitea
    spec:
      containers:
        - name: postgresql
          image: docker.io/bitnami/postgresql:17
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-postgresql-auth
                  key: password
            - name: POSTGRES_USER
              value: gitea
            - name: POSTGRES_DB
              value: gitea
          ports:
            - containerPort: 5432
              name: postgresql
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
      volumes:
        - name: data
          emptyDir: {}
