apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-api-token
  namespace: ci
  labels:
    app.kubernetes.io/name: plane
    app.kubernetes.io/component: ci-verification
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: plane-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - remoteRef:
        key: secret/plane
        property: apiToken
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: apiToken
