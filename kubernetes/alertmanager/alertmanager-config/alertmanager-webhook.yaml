apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-matrix-webhook
  namespace: kube-prometheus
  labels:
    app: alertmanager-matrix-webhook
data:
  webhook.py: |
    import json
    import os
    import uuid
    import html as htmllib
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import requests as req
    TOKEN = os.environ["matrix-access-token"]
    ROOM = os.environ.get("MATRIX_ROOM_ID", "!kLasyTgOvpGTAGTEBU:matrix.ebruno.fr")
    SERVER = os.environ.get("MATRIX_SERVER", "http://synapse.synapse.svc.cluster.local:8008")
    # Matrix clients (Element/Synapse) only render the org.matrix.custom.html
    # tag subset; headings and style attributes are stripped/shown raw, so the
    # template uses emoji for severity/status emphasis instead of colors.
    SEVERITY_EMOJI = {"critical": "🔴", "warning": "🟠", "info": "ℹ️"}
    STATUS_EMOJI = {"firing": "🔥", "resolved": "✅"}
    def esc(value):
        return htmllib.escape(str(value), quote=True)
    def sev_emoji(severity):
        return SEVERITY_EMOJI.get(severity, "ℹ️")
    def status_emoji(status):
        return STATUS_EMOJI.get(status, "❓")
    def link_annotations(annotations):
        # Annotation values that look like URLs (e.g. dashboard_url,
        # runbook_url) become clickable links — <a href> is in the subset.
        links = []
        for key, value in annotations.items():
            k = key.lower()
            if isinstance(value, str) and value.startswith(("http://", "https://")) and ("url" in k or "link" in k):
                label = k.replace("_", " ").replace("-", " ").strip().title()
                links.append((label, value))
        return links
    def fmt(alert):
        labels = alert.get("labels", {})
        annotations = alert.get("annotations", {})
        status = alert.get("status", "unknown")
        name = labels.get("alertname", "Unknown")
        severity = labels.get("severity", "info")
        summary = annotations.get("summary", "")
        details = annotations.get("description", "")
        instance = labels.get("instance", "")
        title = f"{status_emoji(status)} <b>{esc(status.upper())}</b> — {esc(name)}"
        rows = [(esc("Severity"), f"{sev_emoji(severity)} {esc(severity)}")]
        rows.append((esc("Status"), esc(status)))
        if instance:
            rows.append((esc("Instance"), f"<code>{esc(instance)}</code>"))
        if summary:
            rows.append((esc("Summary"), esc(summary)))
        if details:
            rows.append((esc("Details"), esc(details)))
        for label, url in link_annotations(annotations):
            rows.append((esc(label), f'<a href="{esc(url)}">{esc(url)}</a>'))
        table = "<table>" + "".join(f"<tr><td><b>{k}</b></td><td>{v}</td></tr>" for k, v in rows) + "</table>"
        return f"<p>{title}</p>{table}"
    def summarize(alerts):
        # Compact plain-text fallback line, e.g.
        # "🔥 FIRING x3: NodePVCDiskCritical on /mnt/disk (critical)"
        groups = {}
        order = []
        for alert in alerts:
            labels = alert.get("labels", {})
            key = (alert.get("status", "unknown"), labels.get("alertname", "Unknown"), labels.get("severity", "info"))
            if key not in groups:
                groups[key] = {"count": 0, "instance": labels.get("instance", "")}
                order.append(key)
            groups[key]["count"] += 1
        lines = []
        for status, name, severity in order:
            g = groups[(status, name, severity)]
            times = f" x{g['count']}" if g["count"] > 1 else ""
            where = f" on {g['instance']}" if g["instance"] else ""
            lines.append(f"{status_emoji(status)} {status.upper()}{times}: {name}{where} ({severity})")
        return "; ".join(lines) if lines else "No alerts"
    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            data = json.loads(self.rfile.read(length))
            alerts = data.get("alerts", [])
            html = "<hr/>".join(fmt(a) for a in alerts) if alerts else "<p>No alerts</p>"
            txn = str(uuid.uuid4()).replace("-", "")
            url = f"{SERVER}/_matrix/client/v3/rooms/{ROOM}/send/m.room.message/{txn}"
            # Matrix spec: only msgtype m.text/m.notice (+format,formatted_body)
            # triggers HTML rendering. "m.html" is not a valid msgtype — clients
            # fell back to printing body verbatim, so body must stay plain text.
            body = summarize(alerts)
            msg = {"msgtype": "m.text", "body": body, "format": "org.matrix.custom.html", "formatted_body": html}
            try:
                r = req.put(url, json=msg, headers={"Authorization": f"Bearer {TOKEN}"}, timeout=10)
                print(f"Sent to Matrix: {r.status_code} {r.text[:100]}")
            except Exception as e:
                print(f"Failed to send to Matrix: {e}")
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"{}")
        def log_message(self, fmt, *args):
            print(f"webhook: {args}")
    if __name__ == "__main__":
        print("Alertmanager Matrix Webhook starting on 8080")
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-matrix-webhook
  namespace: kube-prometheus
  labels:
    app: alertmanager-matrix-webhook
spec:
  selector:
    app: alertmanager-matrix-webhook
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-matrix-webhook
  namespace: kube-prometheus
  labels:
    app: alertmanager-matrix-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-matrix-webhook
  template:
    metadata:
      labels:
        app: alertmanager-matrix-webhook
      annotations:
        # Bump this value whenever the webhook.py ConfigMap changes — the
        # Deployment template otherwise stays identical and ArgoCD never
        # rolls the pods, so the running Python process keeps serving the
        # previous script from memory.
        config-version: "2026-10-14-nicer-template"
    spec:
      containers:
        - name: webhook
          image: python:3.13-alpine
          command:
            - sh
            - -ec
          args:
            - |
              pip install --no-cache-dir -q requests && python3 /opt/webhook/webhook.py
          env:
            - name: MATRIX_USER_ID
              value: "@alertmanager:matrix.ebruno.fr"
            - name: MATRIX_ROOM_ID
              value: "!kLasyTgOvpGTAGTEBU:matrix.ebruno.fr"
            - name: MATRIX_SERVER
              value: "http://synapse.synapse.svc.cluster.local:8008"
            - name: matrix-access-token
              valueFrom:
                secretKeyRef:
                  name: alertmanager-matrix-token
                  key: matrix-access-token
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: webhook
              mountPath: /opt/webhook
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: webhook
          configMap:
            name: alertmanager-matrix-webhook
