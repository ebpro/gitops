apiVersion: batch/v1
kind: Job
metadata:
  name: matrix-token-setup
  namespace: synapse
spec:
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      serviceAccountName: alertmanager-token-writer
      restartPolicy: Never
      volumes:
        - name: synapse-data
          persistentVolumeClaim:
            claimName: synapse-data-synapse-0
      containers:
        - name: register-bot
          image: python:3.13-alpine
          command:
            - sh
            - -ec
          args:
            - |
              echo "=== Registering bot user ==="
              wget -qO /tmp/reg.json --post-data='{"username":"alertmanager","password":"bot-password-alertmanager","initial_device_display_name":"alertmanager"}' \
                --header="Content-Type: application/json" \
                "http://synapse:8008/_matrix/client/v3/register" \
                || echo "Registration may have failed, continuing..."
              cat /tmp/reg.json 2>/dev/null || true

              echo "=== Login for bot-access-token ==="
              wget -qO- --post-data='{"type":"m.login.password","user":"alertmanager","password":"bot-password-alertmanager"}' \
                --header="Content-Type: application/json" \
                -O /tmp/login.json \
                "http://synapse:8008/_matrix/client/v3/login"

              echo "LOGIN response:"; cat /tmp/login.json

              ACCESS_TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/login.json'))['access_token'])")
              USER_ID=$(python3 -c "import json;print(json.load(open('/tmp/login.json'))['user_id'])")

              echo "Login: ${USER_ID}, Token: ${#ACCESS_TOKEN} chars"

              echo "=== Joining Matrix room ${MATRIX_ROOM_ID} ==="
              wget -qO- --method=POST \
                --header="Authorization: Bearer ${ACCESS_TOKEN}" \
                "http://synapse:8008/_matrix/client/v3/join/${MATRIX_ROOM_ID}" 2>/dev/null || echo "Join skipped"

              echo "=== Writing K8s Secret ==="
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              TOKEN_B64=$(printf '%s' "$ACCESS_TOKEN" | base64)
              SECRET_JSON=$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"alertmanager-matrix-token","namespace":"kube-prometheus"},"type":"Opaque","data":{"matrix-access-token":"%s"}}' "$TOKEN_B64")

              apk add -q curl || true
              curl -s -X PUT \
                --header="Authorization: Bearer $SA_TOKEN" \
                "https://kubernetes.default.svc/api/v1/namespaces/kube-prometheus/secrets/alertmanager-matrix-token" \
                --header="Content-Type: application/json" \
                --data "$SECRET_JSON" \
                --insecure || echo "Warning: Secret write failed"

              echo "=== ALL GOOD ==="
          env:
            - name: MATRIX_ROOM_ID
              value: "!kLasyTgOvpGTAGTEBU:matrix.ebruno.fr"
          volumeMounts:
            - name: synapse-data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
