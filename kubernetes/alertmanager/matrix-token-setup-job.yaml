apiVersion: batch/v1
kind: Job
metadata:
  name: matrix-token-setup
  namespace: synapse
spec:
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: alertmanager-token-writer
      restartPolicy: Never
      volumes:
        - name: synapse-data
          persistentVolumeClaim:
            claimName: synapse-data-synapse-0
      containers:
        - name: register-bot
          image: python:3.13-alpine
          command:
            - sh
            - -ec
          args:
            - |
              echo "Installing Synapse CLI tools..."
              pip install matrix-synapse

              echo "Registering bot user..."
              register_new_matrix_user \
                -c /data/homeserver.yaml \
                --yes-to-eula \
                --no-validate-server \
                --username alertmanager \
                --displayname "Alertmanager Bot (GitOps)" \
                --password bot-password-alertmanager 2>&1 || echo "User may already exist, continuing..."

              echo "Login to get access token..."
              ACCESS_TOKEN=$(wget -qO- --post-data='{"type":"m.login.password","user":"alertmanager","password":"bot-password-alertmanager"}' \
                --header="Content-Type: application/json" \
                "http://synapse:8008/_matrix/client/v3/login" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")

              USER_ID=$(wget -qO- --post-data='{"type":"m.login.password","user":"alertmanager","password":"bot-password-alertmanager"}' \
                --header="Content-Type: application/json" \
                "http://synapse:8008/_matrix/client/v3/login" | python3 -c "import sys,json;print(json.load(sys.stdin)['user_id'])")

              echo "Joined bot: ${USER_ID}"
              echo "Token length: ${#ACCESS_TOKEN}"

              echo "Joining room ${MATRIX_ROOM_ID}..."
              wget -qO- --method=POST \
                --header="Authorization: Bearer ${ACCESS_TOKEN}" \
                "http://synapse:8008/_matrix/client/v3/join/${MATRIX_ROOM_ID}" >/dev/null 2>&1 || echo "Room join skipped"

              echo "Writing token to K8s Secret..."
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              TOKEN_B64=$(printf '%s' "$ACCESS_TOKEN" | python3 -c "import sys,base64;print(base64.b64encode(sys.stdin.buffer.read()).decode().rstrip('\n'))")
              SECRET_JSON=$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"alertmanager-matrix-token","namespace":"kube-prometheus"},"type":"Opaque","data":{"matrix-access-token":"%s"}}' "$TOKEN_B64")

              wget -qO- --method=PUT \
                --header="Authorization: Bearer $SA_TOKEN" \
                --no-check-certificate \
                --header="Content-Type: application/json" \
                --body-data="$SECRET_JSON" \
                "https://kubernetes.default.svc/api/v1/namespaces/kube-prometheus/secrets/alertmanager-matrix-token" 2>&1 || echo "Warning: Secret write failed"

              echo "=== Done ==="
          env:
            - name: MATRIX_ROOM_ID
              value: "!kLasyTgOvpGTAGTEBU:matrix.ebruno.fr"
          volumeMounts:
            - name: synapse-data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
