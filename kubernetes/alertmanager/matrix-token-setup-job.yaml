apiVersion: batch/v1
kind: Job
metadata:
  name: matrix-token-setup
  namespace: synapse
spec:
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      serviceAccountName: alertmanager-token-writer
      restartPolicy: Never
      volumes:
        - name: synapse-data
          persistentVolumeClaim:
            claimName: synapse-data-synapse-0
      containers:
        - name: register-bot
          image: python:3.13-alpine
          command:
            - sh
            - -ec
          args:
            - |
              echo "=== Installing Matrix libraries ==="
              pip install requests || exit 1

              echo "=== Bot registration complete ==="
              
              echo "=== Login for access token ==="
              if /syn-env/bin/register_new_matrix_user -c /data/homeserver.yaml -u alertmanager -p bot-password-alertmanager --no-admin; then
                echo "Registered OK"
              else
                echo "Reg returned non-zero (user may already exist)"
              fi

              echo "=== Bot user registered successfully ==="

              LOGIN_RESP=$(wget -qO- --post-data='${"type":"m.login.password","user":"alertmanager","password":"bot-password-alertmanager"}' \
                --header="Content-Type: application/json" \
                "http://synapse:8008/_matrix/client/v3/login")

              ACCESS_TOKEN=$(echo "$LOGIN_RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
              USER_ID=$(echo "$LOGIN_RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['user_id'])")

              echo "User: ${USER_ID}"
              echo "Token len: ${#ACCESS_TOKEN}"

              echo "=== Joining room ${MATRIX_ROOM_ID} ==="
              wget -qO- --method=POST \
                --header="Authorization: Bearer ${ACCESS_TOKEN}" \
                "http://synapse:8008/_matrix/client/v3/join/${MATRIX_ROOM_ID}" 2>/dev/null || echo "Room join skipped"

              echo "=== Writing K8s Secret ==="
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              TOKEN_B64=$(echo -n "$ACCESS_TOKEN" | base64)
              SECRET_JSON=$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"alertmanager-matrix-token","namespace":"kube-prometheus"},"type":"Opaque","data":{"matrix-access-token":"%s"}}' "$TOKEN_B64")

              wget -qO- --method=PUT \
                --header="Authorization: Bearer $SA_TOKEN" \
                --no-check-certificate \
                --header="Content-Type: application/json" \
                --body-data="$SECRET_JSON" \
                "https://kubernetes.default.svc/api/v1/namespaces/kube-prometheus/secrets/alertmanager-matrix-token" 2>&1 || echo "Warning: Secret write failed"

              echo "=== Done ==="
          env:
            - name: MATRIX_ROOM_ID
              value: "!kLasyTgOvpGTAGTEBU:matrix.ebruno.fr"
          volumeMounts:
            - name: synapse-data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
