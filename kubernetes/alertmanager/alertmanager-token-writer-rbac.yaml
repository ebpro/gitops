apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager-token-writer
  namespace: synapse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alertmanager-token-writer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alertmanager-token-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alertmanager-token-writer
subjects:
  - kind: ServiceAccount
    name: alertmanager-token-writer
    namespace: synapse
