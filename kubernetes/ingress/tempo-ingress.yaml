apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempo-ingress
  namespace: tempo
  annotations:
    traefik.ingress.kubernetes.io/service.serverscheme: "http"
spec:
  ingressClassName: traefik
  rules:
    - host: tempo.ebruno.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tempo
                port:
                  number: 3100
  tls:
    - hosts:
      - tempo.ebruno.fr
