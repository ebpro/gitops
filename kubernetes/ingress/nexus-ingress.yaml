apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-ingress
  namespace: nexus
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-ovh
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy/fwd-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: nexus.ebruno.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-nexus3
                port:
                  number: 8081
  tls:
    - hosts:
      - nexus.ebruno.fr
