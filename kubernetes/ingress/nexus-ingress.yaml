apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nexus-ingress
  namespace: nexus
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`nexus.ebruno.fr`) && PathPrefix(`/`)
      middlewares:
        - name: fwd-auth
      services:
        - name: nexus-nexus3
          port: http
    - kind: Rule
      match: Host(`nexus.ebruno.fr`) && PathPrefix(`/oauth2/`)
      middlewares:
        - name: oauth2-prefix-stripprefix
      services:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 4180
  tls:
    certResolver: letsencrypt-ovh
