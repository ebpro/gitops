apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth
  namespace: sonarqube
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/start?rd=https://sonarqube.ebruno.fr/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
      - X-Forwarded-Email
      - X-Forwarded-Access-Token
    authRequestHeaders:
      - X-Forwarded-User
      - X-Forwarded-Email
      - X-Forwarded-Access-Token
      - Host
      - X-Forwarded-Host
      - X-Forwarded-Proto
      - Cookie
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth-headers
  namespace: sonarqube
spec:
  headers:
    sslRedirect: true
    sslHost: sonarqube.ebruno.fr
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
    customRequestHeaders:
      X-Forwarded-User: "(({{ .Get X-Forwarded-User }}))"
      X-Forwarded-Email: "(({{ .Get X-Forwarded-Email }}))"
