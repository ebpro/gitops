apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-public
  namespace: sonarqube
spec:
  selector:
    app: oauth2-proxy-forward
  ports:
    - port: 4180
      name: http
      targetPort: 4180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-forward
  namespace: sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-forward
  template:
    metadata:
      labels:
        app: oauth2-proxy-forward
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          ports:
            - containerPort: 4180
              name: http
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
      volumes:
        - name: config
          configMap:
            name: oauth2-proxy-forward-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-forward-config
  namespace: sonarqube
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - address:
            socket_address:
              address: 0.0.0.0
              port_value: 4180
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: oauth2
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: oauth2
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: oauth2_upstream
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: oauth2_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          connect_timeout: 5s
          load_assignment:
            cluster_name: oauth2_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: oauth2-proxy.oauth2-proxy.svc.cluster.local
                          port_value: 4180
