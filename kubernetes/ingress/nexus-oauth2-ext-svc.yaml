apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: oauth2-transport
  namespace: nexus
spec:
  serverName: oauth2-proxy.oauth2-proxy.svc.cluster.local
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: oauth2-proxy-lb
  namespace: nexus
spec:
  loadBalancer:
    servers:
      - url: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180
