apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth
  namespace: pact-broker
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/checkauth
    trustForwardHeader: true
    authResponseHeaders:
      - Gap-Auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth-headers
  namespace: pact-broker
spec:
  headers:
    sslRedirect: true
    sslHost: pactbroker.ebruno.fr
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
