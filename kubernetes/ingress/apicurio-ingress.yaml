apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apicurio-ingress
  namespace: apicurio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-ovh
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: apicurio.ebruno.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apicurio-api
                port:
                  number: 8080
  tls:
    - hosts:
        - apicurio.ebruno.fr
      secretName: apicurio-tls
