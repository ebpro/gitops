apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: plane-sso-env-patch
spec:
  admission: true
  background: false
  emitWarning: false
  validationFailureAction: Audit
  rules:
  - name: inject-plane-admin
    match:
      any:
      - resources:
          kinds:
          - Pod
          names:
          - plane-admin-wl-*
          namespaces:
          - plane
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - name: plane-admin
            env:
                - name: IS_GITEA_ENABLED
                  value: "1"
                - name: GITEA_HOST
                  value: https://gitea.ebruno.fr
                - name: GITEA_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: plane-gitea-oauth
                      key: id
                - name: GITEA_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: plane-gitea-oauth
                      key: secret
  - name: inject-plane-api
    match:
      any:
      - resources:
          kinds:
          - Pod
          names:
          - plane-api-wl-*
          namespaces:
          - plane
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - name: plane-api
            env:
                - name: IS_GITEA_ENABLED
                  value: "1"
                - name: GITEA_HOST
                  value: https://gitea.ebruno.fr
                - name: GITEA_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: plane-gitea-oauth
                      key: id
                - name: GITEA_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: plane-gitea-oauth
                      key: secret
  - name: inject-plane-beat-worker
    match:
      any:
      - resources:
          kinds:
          - Pod
          names:
          - plane-beat-worker-wl-*
          namespaces:
          - plane
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - name: plane-beat-worker
            env:
                - name: IS_GITEA_ENABLED
                  value: "1"
                - name: GITEA_HOST
                  value: https://gitea.ebruno.fr
                - name: GITEA_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: plane-gitea-oauth
                      key: id
                - name: GITEA_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: plane-gitea-oauth
