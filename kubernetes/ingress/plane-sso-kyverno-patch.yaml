                - name: GITEA_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: plane-gitea-oauth
                      key: id
                - name: GITEA_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: plane-gitea-oauth
                      key: secret
  - name: inject-plane-space
    match:
      any:
      - resources:
          kinds:
          - Pod
          names:
          - plane-space-wl-*
          namespaces:
          - plane
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - name: plane-space
            env:
                - name: IS_GITEA_ENABLED
                  value: "1"
                - name: GITEA_HOST
