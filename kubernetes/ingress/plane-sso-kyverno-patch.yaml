            env:
                - name: IS_GITEA_ENABLED
                  value: "1"
                - name: GITEA_HOST
                  value: https://gitea.ebruno.fr
                - name: GITEA_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: plane-gitea-oauth
                      key: id
                - name: GITEA_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: plane-gitea-oauth
