apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-ovh
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@ebruno.fr
    privateKeySecretRef:
      name: letsencrypt-ovh-key
    solvers:
    - http01:
        ingress:
          class: traefik
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plane-tls
  namespace: plane
spec:
  secretName: plane-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: letsencrypt-ovh
    kind: ClusterIssuer
  dnsNames:
  - plane.ebruno.fr
