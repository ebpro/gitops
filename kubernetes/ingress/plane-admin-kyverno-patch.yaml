apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: plane-admin-custom-nginx
spec:
  admission: true
  background: true
  emitWarning: false
  validationFailureAction: Audit
  rules:
  - name: inject-nginx-fix
    match:
      any:
      - resources:
          kinds:
          - Deployment
          names:
          - plane-admin-wl
          namespaces:
          - plane
    mutate:
      patchStrategicMerge:
        spec:
          template:
            spec:
              initContainers:
              - name: nginx-fix
                image: busybox:1.36
                command:
                - sh
                - -c
                - |
                  cat > /nginx/nginx.conf << 'CONFEOF'
                  worker_processes 4;
                  events { worker_connections 1024; }
                  http {
                    include mime.types;
                    default_type application/octet-stream;
                    set_real_ip_from 0.0.0.0/0;
                    real_ip_recursive on;
                    real_ip_header X-Forward-For;
                    access_log /dev/stdout;
                    error_log /dev/stderr;
                    port_in_redirect off;
                    server {
                      listen 3000;
                      server_name plane.ebruno.fr localhost;
                      location = / {
                        return 302 /god-mode/;
                      }
                      location / {
                        root /usr/share/nginx/html/god-mode;
                        try_files $uri $uri/ /index.html;
                      }
                      location @fixredirect {
                        if ($http_x_forwarded_proto = https) {
                          set $target https://$host$uri/;
                        }
                        if ($http_x_forwarded_proto != https) {
                          set $target http://$host$uri/;
                        }
                        return 301 $target;
                      }
                      location /api/ {
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "upgrade";
                        proxy_connect_timeout 300s;
                        proxy_read_timeout 300s;
                        proxy_pass http://plane-api:8000;
                      }
                      location /live/ {
                        proxy_pass http://plane-live:3000;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "upgrade";
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header Host $host;
                        proxy_redirect default;
                        proxy_read_timeout 120s;
                        proxy_send_timeout 120s;
                        proxy_connect_timeout 7d;
                      }
                    }
                  }
                  CONFEOF
                volumeMounts:
                - name: nginx-conf
                  mountPath: /nginx
              volumes:
              - name: nginx-conf
                emptyDir: {}
              containers:
              - name: plane-admin
                volumeMounts:
                - name: nginx-conf
                  mountPath: /etc/nginx/nginx.conf
                  subPath: nginx.conf
