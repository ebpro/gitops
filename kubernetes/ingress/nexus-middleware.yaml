apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth
  namespace: nexus
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/checkauth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
      - X-Forwarded-Email
      - X-Forwarded-Access-Token
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth-headers
  namespace: nexus
spec:
  headers:
    sslRedirect: true
    sslHost: nexus.ebruno.fr
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
