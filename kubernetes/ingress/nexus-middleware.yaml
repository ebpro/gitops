apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth
  namespace: nexus
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
      - X-Forwarded-Email
      - Set-Cookie
    authRequestHeaders:
      - X-Forwarded-User
      - X-Forwarded-Email
      - X-Forwarded-Proto
      - Cookie
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-errors
  namespace: nexus
spec:
  errors:
    status:
      - "401-403"
    statusRewrites:
      "401-403": 302
    service:
      name: oauth2-proxy
      namespace: oauth2-proxy
      port: 4180
    query: "/oauth2/start?rd={url}"
