apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth
  namespace: nexus
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/start?rd=https://nexus.ebruno.fr/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
      - X-Forwarded-Email
    authRequestHeaders:
      - X-Forwarded-User
      - X-Forwarded-Email
      - X-Forwarded-Proto
    authResponseHeadersRegex: ".*"
