apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth-redirect-url
  namespace: nexus
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-Redirect: "https://nexus.ebruno.fr/"
      X-Forwarded-Proto: "https"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth
  namespace: nexus
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
      - X-Forwarded-Email
      - X-Forwarded-Access-Token
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fwd-auth-chain
  namespace: nexus
spec:
  chain:
    middlewares:
      - name: fwd-auth-redirect-url
      - name: fwd-auth
