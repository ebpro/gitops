apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: woodpecker-grpc
  namespace: ci
spec:
  entryPoints:
    - websecure
  routes:
    # gRPC agent traffic only; UI (priority-less, matched by absence of the
    # Content-Type header) is served by kubernetes/ingress/woodpecker-ingress.yaml.
    # If that UI route's priority is ever raised to >=100 this discrimination breaks.
    - match: Host(`woodpecker.ebruno.fr`) && HeadersRegexp(`Content-Type`, `^application/grpc`)
      kind: Rule
      priority: 100
      services:
        - name: woodpecker-server
          port: 9000
          scheme: h2c
  tls:
    certResolver: letsencrypt-ovh
    domains:
      - main: woodpecker.ebruno.fr
