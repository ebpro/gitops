apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarqube-ingress
  namespace: sonarqube
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`sonarqube.ebruno.fr`)
      services:
        - name: sonarqube-sonarqube
          port: http
  tls:
    certResolver: letsencrypt-ovh
