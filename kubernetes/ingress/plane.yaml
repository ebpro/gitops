apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-admin-nginx
  namespace: plane
data:
  nginx.conf: |
    worker_processes 4;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;

      default_type application/octet-stream;

      set_real_ip_from 0.0.0.0/0;
      real_ip_recursive on;
      real_ip_header X-Forwarded-For;

      server {
        listen 3000;
        server_name plane.ebruno.fr localhost;

        location / {
          root /usr/share/nginx/html;
          index index.html index.htm;
          error_page 301 =301 @fixredirect;
          try_files $uri $uri/ /god-mode/index.html;
        }

        location @fixredirect {
          set $target $scheme://$host$uri/;
          if ($http_x_forwarded_proto = https) {
            set $target https://$host$uri/;
          }
          return 301 $target;
        }
      }
    }
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: plane-backend-transport
  namespace: plane
spec:
  serverName: plane-backend
