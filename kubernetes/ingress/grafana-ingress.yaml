---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-redirect
  namespace: kube-prometheus
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: kube-prometheus@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.ebruno.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-redirect-svc
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-redirect-svc
  namespace: kube-prometheus
spec:
  clusterIP: None
  ports:
    - name: http
      port: 80
  selector:
    traefik.io/expressly-wrong: "true"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-https-redirect
  namespace: kube-prometheus
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: kube-prometheus
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-ovh
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.ebruno.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-grafana
                port:
                  number: 80
  tls:
    - hosts:
      - grafana.ebruno.fr
