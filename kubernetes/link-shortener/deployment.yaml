apiVersion: apps/v1
kind: Deployment
metadata:
  name: link-shortener
  namespace: link-shortener
  labels:
    app.kubernetes.io/name: link-shortener
    app.kubernetes.io/managed-by: quarkus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: link-shortener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: link-shortener
      annotations:
        instrumentation.opentelemetry.io/inject: link-shortener-otel
    spec:
      containers:
        - name: link-shortener
          image: harbor.ebruno.fr/link-shortener/link-shortener:latest
          imagePullPolicy: Always
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: link-shortener-db-credentials
                  key: url
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: link-shortener-db-credentials
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: link-shortener-db-credentials
                  key: password
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /q/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
