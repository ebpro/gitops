# Woodpecker CI pipeline for GitOps repository
# Run when .woodpecker.yaml is committed to main or pushed to PR branch

when:
  branch: main

# ─── YAML Lint + K8s Manifest Validation ────────────────
steps:
  lint-yaml:
    image: docker.io/mumats/yamllint:latest
    commands:
      - yamllint -d relaxed bootstrap/ helm/releases/ kubernetes/
    when:
      event: [push, pull_request]

  validate-k8s:
    image: docker.io/instrumenta/kubeval:latest
    commands:
      - kubeval --strict --force-color $(find kubernetes/ -name '*.yaml')
      - kubeval --strict --force-color bootstrap/appset-*.yaml
    when:
      event: [push, pull_request]

  validate-helm-lint:
    image: alpine/helm:latest
    commands:
      - for dir in helm/releases/*/; do helm lint "$dir"; done
    when:
      event: [push, pull_request]

# ─── Image Security Scan (Trivy) ─────────────────────────
  scan-helm-dependencies:
    image: docker.io/aquasec/trivy:latest
    commands:
      - trivy config --severity HIGH,CRITICAL --exit-code 1 bootstrap/
      - trivy config --severity HIGH,CRITICAL --exit-code 1 kubernetes/
    when:
      event: [push, pull_request]

# ─── Keycloak Realm Validation ─────────────────────────────
  validate-realm:
    image: python:3.11-slim
    commands:
      - pip install pyyaml
      - python3 -c "
import yaml, json
with open('kubernetes/keycloak-realm/platform-realm-configmap.yaml') as f:
    cm = yaml.safe_load(f)
realm = json.loads(cm['data']['platform.json'])
print(f'Realm validated: {len(realm[\"clients\"])} clients, realm={realm[\"realm\"]}')
for c in realm['clients']:
    assert 'clientId' in c, f'Missing clientId in client {c}'
    assert 'redirectUris' in c, f'Missing redirectUris for {c[\"clientId\"]}'
print('All clients have required fields')
"
    when:
      event: [push, pull_request]

# ─── Plane Liveness + API Token + Version Drift Guard ──────
  verify-plane:
    image: python:3.11-slim
    commands:
      - python -m pip install -q requests
      - >
        python - <<'PYEOF'
        import os
        import requests

        base = os.environ["PLANE_URL"].rstrip("/")
        token = os.environ["PLANE_API_TOKEN"]

        r = requests.get(
            f"{base}/api/v1/users/me/",
            headers={"X-Api-Key": token},
            timeout=15,
        )
        assert r.status_code == 200, (
            f"plane API-key auth failed: {r.status_code} {r.text[:200]}"
        )
        print(f"plane token ok: {r.json().get('email')}")

        r = requests.get(f"{base}/api/instances/", timeout=15)
        assert r.status_code == 200, f"plane instances probe failed: {r.status_code}"
        version = r.json()["instance"]["current_version"]
        expected = os.environ["PLANE_EXPECTED_VERSION"]
        assert version == expected, (
            f"plane version drift: running {version}, expected {expected}"
        )
        print(f"plane version ok: {version}")
        PYEOF
    environment:
      PLANE_URL: https://plane.ebruno.fr
      PLANE_EXPECTED_VERSION: "1.4.1"
      PLANE_API_TOKEN:
        from_secret: plane_api_token
    when:
      event: [push, pull_request]
