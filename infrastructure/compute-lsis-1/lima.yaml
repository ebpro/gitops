minimumLimaVersion: 2.0.0
vmType: vz
arch: aarch64
images:
- location: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-arm64.img
cpus: 8
memory: 48GiB
disk: 128GiB
mounts: []
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/sh
      if [ -f /var/lib/dbus/machine-id ]; then
        rm -f /var/lib/dbus/machine-id
      fi
  - mode: system
    script: |
      #!/bin/sh
      sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      echo 'kernel.apparmor_restrict_unprivileged_userns=0' > /etc/sysctl.d/99-rootless-containers.conf
  - mode: system
    script: |
      #!/bin/sh
      apt-get update
      apt-get install -y nfs-common
networks:
- lima: bridged
