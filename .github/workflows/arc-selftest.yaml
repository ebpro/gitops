name: ARC selftest

on:
  workflow_dispatch:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        label: [x64, arm64]
    name: selftest (${{ matrix.label }})
    runs-on:
      - ebpro-org
      - linux
      - self-hosted
      - ${{ matrix.label }}
    steps:
      - name: Runner info
        run: |
          echo "hostname: $(hostname)"
          uname -a
          echo "arch: $(uname -m)"
          df -h /home/runner | tail -1
      - name: DinD check
        run: |
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}} arch={{.Server.Arch}}'
      - name: Buildx check
        run: |
          docker buildx version
          docker buildx imagetools create --help >/dev/null
      - name: hello-world (native arch)
        run: |
          docker run --rm hello-world
