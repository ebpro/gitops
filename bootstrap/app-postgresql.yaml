apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '15'

spec:
  project: platform

  source:
    repoURL: https://github.com/ebpro/gitops
    targetRevision: main
    path: kubernetes/postgresql

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true

  ignoreDifferences:
  - group: postgresql.cnpg.io
    kind: Cluster
    jqPathExpressions:
    - .spec.affinity
    - .spec.enablePDB
    - .spec.failoverDelay
    - .spec.imageName
    - .spec.logLevel
    - .spec.monitoring
    - .spec.postgresGID
    - .spec.postgresUID
    - .spec.primaryUpdateMethod
    - .spec.primaryUpdateStrategy
    - .spec.probes
    - .spec.replicationSlots
    - .spec.smartShutdownTimeout
    - .spec.startDelay
    - .spec.stopDelay
    - .spec.switchoverDelay
