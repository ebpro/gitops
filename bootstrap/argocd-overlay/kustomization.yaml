apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - github.com/argoproj/argo-cd//manifests/cluster-install?ref=v3.5.1
patches:
  - path: patches/argocd-cm.yaml
  - path: patches/argocd-cmd-params-cm.yaml
  - path: patches/argocd-rbac-cm.yaml
  - path: patches/argocd-server-deployment-patch.yaml
  - path: patches/argocd-application-controller-restart.yaml
  - target:
      kind: CustomResourceDefinition
      name: applications.argoproj.io
    path: patches/crd-applications-resource-ignore-differences.yaml
  - target:
      kind: ConfigMap
      name: argocd-cm
    path: patches/remove-status-stripping-patch.json
