apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  admin.enabled: "true"
  application.instanceLabelKey: argocd.argoproj.io/instance
  exec.enabled: "false"
  server.rbac.log.enforce.able: "false"
  statusbadge.enabled: "false"
  cluster.inClusterEnabled: "true"
  timeout.reconciliation: 180s
  timeout.hard.reconciliation: 0s
  url: https://argocd.ebruno.fr
  oidc.config: |
    issuer: https://keycloak.ebruno.fr/realms/platform
    clientID: argocd
    clientSecret: $CLIENT_SECRET_ARGOCD
    requestedScopes:
      - openid
      - profile
      - email
    requestedIDTokenClaims: {}
  rbac.policy.default: |
    # Keycloak groups → ArgoCD roles
    p, g:/platform-admins, role:admin
    p, g:/platform-engineers, role:projects-admin
    p, g:/developers, role:readonly
    p, g:/readonly, role:readonly
    p, g:/developers/qa-team, role:readonly
    p, g:/developers/security-team, role:readonly
  resource.customizations.health: |
    v1/Service:
      health.lua: |
        hs = { status = "Healthy", message = "Service exists" }
        return hs
    v1/Secret:
      health.lua: |
        hs = { status = "Healthy", message = "Secret exists" }
        return hs
    v1/ConfigMap:
      health.lua: |
        hs = { status = "Healthy", message = "ConfigMap exists" }
        return hs
    v1/PersistentVolumeClaim:
      health.lua: |
        hs = { status = "Healthy", message = "PVC exists" }
        return hs
    v1/ServiceAccount:
      health.lua: |
        hs = { status = "Healthy", message = "ServiceAccount exists" }
        return hs
