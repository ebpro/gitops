apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  admin.enabled: "true"
  application.instanceLabelKey: argocd.argoproj.io/instance
  exec.enabled: "false"
  server.rbac.log.enforce.able: "false"
  statusbadge.enabled: "false"
  cluster.inClusterEnabled: "true"
  timeout.reconciliation: 180s
  timeout.hard.reconciliation: 0s
  url: https://argocd.ebruno.fr
  oidc.config: |
    issuer: https://keycloak.ebruno.fr/realms/platform
    clientID: argocd
    clientSecret: $CLIENT_SECRET_ARGOCD
    requestedScopes:
      - openid
      - profile
      - email
    requestedIDTokenClaims: {}
  rbac.policy.default: |
    # Keycloak groups → ArgoCD roles
    p, g:/platform-admins, role:admin
    p, g:/platform-engineers, role:projects-admin
    p, g:/developers, role:readonly
    p, g:/readonly, role:readonly
    p, g:/developers/qa-team, role:readonly
    p, g:/developers/security-team, role:readonly
  resource.customizations.postgresql_cnpg_io_Cluster: |
    healthLuke: |
      hs.status = "Progressing"
      hs.message = ""
      if obj.status then
        if obj.status.conditions then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" then
              if condition.status == "True" then
                hs.status = "Healthy"
                hs.message = "Cluster is Ready"
              elseif condition.status == "False" then
                hs.status = "Degraded"
                hs.message = condition.message or "Cluster not Ready"
              end
            elseif condition.type == "Created" and condition.status == "True" then
              hs.status = "Progressing"
              hs.message = "Cluster has been created"
            end
          end
        end
        if obj.status.phase then
          hs.message = hs.message .. " (phase: " .. obj.status.phase .. ")"
        end
      end
