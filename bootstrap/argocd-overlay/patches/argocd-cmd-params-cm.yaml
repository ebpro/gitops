apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  application.namespaces: ""
  applicationsetcontroller.enable.leader.election: "false"
  applicationsetcontroller.enable.progressive.syncs: "false"
  applicationsetcontroller.log.format: text
  applicationsetcontroller.log.level: info
  applicationsetcontroller.namespaces: ""
  applicationsetcontroller.policy: sync
  controller.ignore.normalizer.jq.timeout: 1s
  controller.log.format: text
  controller.log.level: info
  controller.operation.processors: "10"
  controller.repo.server.timeout.seconds: "60"
  controller.self.heal.timeout.seconds: "5"
  controller.status.processors: "20"
  otlp.address: ""
  redis.server: argocd-redis:6379
  repo.server: argocd-repo-server:8081
  reposerver.log.format: text
  reposerver.log.level: info
  reposerver.parallelism.limit: "0"
  resource.customizations.health: |
    traefik.io/v1alpha1/Middleware:
      health.lua: |
        hs = { status = "Healthy", message = "Managed by Traefik" }
    traefik.io/v1alpha1/ServersTransport:
      health.lua: |
        hs = { status = "Healthy", message = "Managed by Traefik" }
    apiextensions.k8s.io/v1/CustomResourceDefinition:
      health.lua: |
        hs = { status = "Healthy", message = "CRD exists" }
    admissionregistration.k8s.io/v1/MutatingWebhookConfiguration:
      health.lua: |
        hs = { status = "Healthy", message = "Webhook exists" }
    admissionregistration.k8s.io/v1/ValidatingWebhookConfiguration:
      health.lua: |
        hs = { status = "Healthy", message = "Webhook exists" }
    rbac.authorization.k8s.io/v1/ClusterRole:
      health.lua: |
        hs = { status = "Healthy", message = "ClusterRole exists" }
    rbac.authorization.k8s.io/v1/ClusterRoleBinding:
      health.lua: |
        hs = { status = "Healthy", message = "ClusterRoleBinding exists" }
    rbac.authorization.k8s.io/v1/Role:
      health.lua: |
        hs = { status = "Healthy", message = "Role exists" }
    rbac.authorization.k8s.io/v1/RoleBinding:
      health.lua: |
        hs = { status = "Healthy", message = "RoleBinding exists" }
    external-secrets.io/v1beta1/ExternalSecret:
      health.lua: |
        hs = { status = "Healthy", message = "ExternalSecret exists" }
    postgresql.cnpg.io/v1/Cluster:
      health.lua: |
        hs = { status = "Healthy", message = "CNPG Cluster exists" }
  resource.exclusions: |
    - groups: ['']
      kinds: ['Deployment', 'Secret', 'Service', 'ServiceAccount']
    - groups: ['admissionregistration.k8s.io']
      kinds: ['MutatingWebhookConfiguration', 'ValidatingWebhookConfiguration']
    - groups: ['apiextensions.k8s.io']
      kinds: ['CustomResourceDefinition']
    - groups: ['rbac.authorization.k8s.io']
      kinds: ['ClusterRole', 'ClusterRoleBinding', 'Role', 'RoleBinding']
    - groups: ['external-secrets.io']
      kinds: ['ExternalSecret']
    - groups: ['postgresql.cnpg.io']
      kinds: ['Cluster']
  server.basehref: /
  server.dex.server: https://argocd-dex-server.argocd.svc:5556
  server.dex.server.strict.tls: "false"
  server.disable.auth: "false"
  server.enable.gzip: "true"
  server.enable.proxy.protocol.extension: "false"
  server.insecure: "false"
  server.log.format: text
  server.log.level: info
  server.repo.server.strict.tls: "false"
  server.rootpath: ""
  server.staticassets: /shared/app
  server.x.frame.options: sameorigin
