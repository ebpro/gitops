apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: link-shortener
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: platform
  source:
    repoURL: https://github.com/ebpro/gitops
    targetRevision: main
    path: kubernetes/link-shortener
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
    - CreateNamespace=true
