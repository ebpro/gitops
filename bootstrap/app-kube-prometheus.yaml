apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 80.6.0
    chart: kube-prometheus-stack
    helm:
      releaseName: kube-prometheus
      valuesObject:
        grafana:
          dashboards: false
      values: "alertmanager:\n  alertmanagerSpec:\n    storage:\n      volumeClaimTemplate:\n\
        \        spec:\n          accessModes:\n          - ReadWriteOnce\n      \
        \    resources:\n            requests:\n              storage: 5Gi\n     \
        \     storageClassName: local-path\n    resources:\n      requests:\n    \
        \    cpu: 50m\n        memory: 64Mi\n      limits:\n        cpu: 200m\n  \
        \      memory: 256Mi\n    volumeMounts:\n    - name: alertmanager-config\n\
        \      mountPath: /etc/alertmanager/config\n      readOnly: true\n    volumes:\n\
        \    - name: alertmanager-config\n      configMap:\n        name: alertmanager-config\n\
        \  enabled: true\ncoreDns:\n  enabled: true\nkubeScheduler:\n  enabled: false\n\
        kubeControllerManager:\n  enabled: false\nkubeEtcd:\n  enabled: false\nkubeApiServer:\n\
        \  enabled: false\nkubeStateMetrics:\n  enabled: true\nnodeExporter:\n  enabled:\
        \ true\n  releaseLabel: true\n  prometheus:\n    enabled: true\n    prometheusSpec:\n\
        \      retention: 30d\n      retentionSize: 45GB\n      enableCompression:\
        \ true\n      walCompression: true\n      resources:\n        limits:\n  \
        \        cpu: 2\n          memory: 4Gi\n      requests:\n        cpu: 500m\n\
        \        memory: 2Gi\n    serviceMonitorSelectorNilUsesHelmValues: false\n\
        \    podMonitorSelectorNilUsesHelmValues: false\n    storageSpec:\n      volumeClaimTemplate:\n\
        \        spec:\n          accessModes:\n          - ReadWriteOnce\n      \
        \    resources:\n            requests:\n              storage: 50Gi\n    \
        \      storageClassName: local-path\n    podAnnotations:\n      prometheus.io/scrape:\
        \ 'false'\ngrafana:\n  enabled: true\n  adminPassword: ''\n  existingSecret:\
        \ grafana-admin-password\n  existingSecretKey: admin-password\n  initChownData:\n\
        \    enabled: false\n  extraSecretMounts:\n  - name: grafana-oidc-secrets\n\
        \    mountPath: /etc/grafana/secrets\n    secretName: grafana-oidc-secrets\n\
        \    readOnly: true\n  grafana.ini:\n    auth.generic_oauth:\n      allow_assign_grafana_admin:\
        \ true\n      allow_sign_up: true\n      allowed_groups: platform-admins,platform-engineers,developers,security-team,qa-team,readonly\n\
        \      api_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/userinfo\n\
        \      auth_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/auth\n\
        \      client_id: grafana\n      client_secret: $__file{/etc/grafana/secrets/CLIENT_SECRET_GRAFANA}\n\
        \      enabled: true\n      login_attribute_path: email\n      name: Keycloak\n\
        \      name_attribute_path: full_name\n      redirect_uri: https://grafana.ebruno.fr/login/generic_oauth\n\
        \      role_attribute_path: contains(groups,\"platform-admins\") && \"GrafanaAdmin\"\
        \ ||\n        contains(groups,\"readonly\") && \"Viewer\" || \"Editor\"\n\
        \      scopes: openid profile email groups offline_access\n      signout_redirect_url:\
        \ https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.ebruno.fr%2Flogin\n\
        \      token_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/token\n\
        \      use_refresh_token: true\n    analytics:\n      check_for_updates: false\n\
        \      reporting_enabled: false\n    unifiedAlerting:\n      enabled: true\n\
        \    explore:\n      enabled: true\n    trace:\n      enabled: true\n    trace.legacy:\n\
        \      attributes.datasource: Prometheus\n    security:\n      cookie_secure:\
        \ true\n      cookie_samesite: lax\n    server:\n      domain: grafana.ebruno.fr\n\
        \      root_url: https://grafana.ebruno.fr\n    log:\n      mode: console\n\
        \      level: warn\n  ingress:\n    enabled: false\n  persistence:\n    enabled:\
        \ true\n    size: 10Gi\n    storageClassName: local-path\n  additionalDataSources:\n\
        \  - access: proxy\n    name: Loki\n    type: loki\n    url: http://loki.loki.svc.cluster.local:3100\n\
        \    editable: true\n    isDefault: false\n  - access: proxy\n    name: Tempo\n\
        \    type: tempo\n    url: http://tempo.tempo.svc.cluster.local:3200\n   \
        \ editable: true\n    isDefault: false\n    jsonData:\n      tracesToLogs:\n\
        \        datasourceUid: loki\n        filterByTraceID: true\n        spanStartTimeShift:\
        \ -1h\n        spanEndTimeShift: +1h\n        mapTag:\n          enabled:\
        \ true\n          tagName: app\n        tags:\n        - app\n        - namespace\n\
        \        - pod\n        - container\n        - cluster\n      tracesToMetrics:\n\
        \        datasourceUid: prometheus\n      lokiSearch:\n        datasourceUid:\
        \ loki\n  - access: proxy\n    name: Alloy\n    type: prometheus\n    url:\
        \ http://alloy.alloy.svc.cluster.local:12345\n    editable: true\n    isDefault:\
        \ false\n  dashboards: false\n  defaultDashboardsEnabled: false\n  securityContext:\n\
        \    fsGroup: 472\n    runAsUser: 472\n    runAsNonRoot: true\n"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    resourceIgnoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
      - del(.metadata)
      - del(.spec.versions)
      - del(.spec.conversion)
      - del(.spec.validation)
      - del(.spec.additionalPrinterColumns)
      - del(.spec.preserveUnknownFields)
      - del(.spec.group)
      - del(.spec.names)
      - del(.spec.scope)
      - del(.status)
      jsonPointers:
      - /spec
      - /status
    - group: monitoring.coreos.com
      kind: Alertmanager
      jqPathExpressions:
      - del(.metadata)
      - del(.status)
      - del(.spec.resources.requests)
      - del(.spec.template)
    - group: monitoring.coreos.com
      kind: Prometheus
      jqPathExpressions:
      - del(.metadata)
      - del(.status)
      - del(.spec.resources.requests)
      - del(.spec.template)
      - del(.spec.externalUrl)
      - del(.spec.alerting.alertmanagers[].namespace)
      - del(.spec.evaluationInterval)
      - del(.spec.scrapeInterval)
      - del(.spec.scrapeConfigSelector)
      - del(.spec.tsdb)
    - group: monitoring.coreos.com
      kind: ServiceMonitor
      jsonPointers:
      - /metadata/managedFields
      - /metadata/annotations
      - /metadata/resourceVersion
    - group: monitoring.coreos.com
      kind: PodMonitor
      jsonPointers:
      - /metadata/managedFields
      - /metadata/annotations
      - /metadata/resourceVersion
    - group: monitoring.coreos.com
      kind: PrometheusRule
      jsonPointers:
      - /metadata/managedFields
      - /metadata/annotations
    - group: batch
      kind: Job
      jsonPointers:
      - /status
      - /metadata/managedFields
      - /metadata/annotations
      jqPathExpressions:
      - .status
    - group: ''
      kind: PersistentVolumeClaim
      jsonPointers:
      - /spec/volumeName
    - group: ''
      kind: Secret
      name: kube-prometheus-grafana
      jsonPointers:
      - /data
    - group: ''
      kind: ConfigMap
      name: kube-prometheus-grafana
      jsonPointers:
      - /data
      - /metadata
