apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 80.6.0
    chart: kube-prometheus-stack
    helm:
      releaseName: kube-prometheus
      parameters:
      - name: crds.enabled
        value: "false"
      - name: grafana.dashboards
        value: "false"
      values: |
        alertmanager:
          alertmanagerSpec:
            config:
              global:
                resolve_timeout: 5m
              route:
                receiver: default
                group_by: ['alertname', 'namespace', 'cluster']
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
                routes:
                  - receiver: default
                    matchers:
                      - severity =~ "critical|warning"
                    group_wait: 10s
                    repeat_interval: 1h
                  - receiver: null
                    matchers:
                      - severity = "info"
              receivers:
                - name: default
                  matrix_configs:
                    - homeserver: "matrix.ebruno.fr"
                      api_url: "http://synapse.synapse.svc.cluster.local:8008"
                      access_token_file: "/etc/alertmanager/secrets/matrix-access-token"
                      recipients:
                        - "!kLasyTgOvpGTAGTEBU:matrix.ebruno.fr"
                      send_resolved: true
                - name: null
            extraSecretMounts:
            - name: alertmanager-matrix-credentials
              mountPath: /etc/alertmanager/secrets
              secretName: alertmanager-matrix-token
              readOnly: true
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi
                  storageClassName: local-path
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
          enabled: true
        coreDns:
          enabled: true
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeApiServer:
          enabled: false
        kubeStateMetrics:
          enabled: true
        nodeExporter:
          enabled: true
          releaseLabel: true
        prometheus:
          enabled: true
          prometheusSpec:
            retention: 30d
            retentionSize: 45GB
            enableCompression: true
            walCompression: true
            webEnableRemoteWriteReceiver: true
            resources:
              limits:
                cpu: 2
                memory: 4Gi
              requests:
                cpu: 500m
                memory: 2Gi
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi
                  storageClassName: local-path
            podAnnotations:
              prometheus.io/scrape: 'false'
        grafana:
          enabled: true
          adminPassword: ''
          existingSecret: grafana-admin-password
          existingSecretKey: admin-password
          initChownData:
            enabled: false
          extraSecretMounts:
          - name: grafana-oidc-secrets
            mountPath: /etc/grafana/secrets
            secretName: grafana-oidc-secrets
            readOnly: true
          grafana.ini:
            auth.generic_oauth:
              allow_assign_grafana_admin: true
              allow_sign_up: true
              # allowed_groups disabled temporarily - add user to Keycloak group first
              hide_login_form: true
              api_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/userinfo
              auth_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/auth
              client_id: grafana
              client_secret: $__file{/etc/grafana/secrets/CLIENT_SECRET_GRAFANA}
              enabled: true
              login_attribute_path: email
              name: Keycloak
              name_attribute_path: full_name
              redirect_uri: https://grafana.ebruno.fr/login/generic_oauth
              role_attribute_path: contains(groups,"/platform-admins") && "GrafanaAdmin" ||
                contains(groups,"/readonly") && "Viewer" || "Editor"
              scopes: openid profile email groups offline_access
              signout_redirect_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.ebruno.fr%2Flogin
              token_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/token
              use_refresh_token: true
            analytics:
              check_for_updates: false
              reporting_enabled: false
            unifiedAlerting:
              enabled: true
            explore:
              enabled: true
            trace:
              enabled: true
            trace.legacy:
              attributes.datasource: Prometheus
            security:
              cookie_secure: true
              cookie_samesite: lax
            server:
              domain: grafana.ebruno.fr
              root_url: https://grafana.ebruno.fr
            log:
              mode: console
              level: warn
          ingress:
            enabled: false
          persistence:
            enabled: true
            size: 10Gi
            storageClassName: local-path
          additionalDataSources:
          - access: proxy
            name: Loki
            type: loki
            url: http://loki.loki.svc.cluster.local:3100
            editable: true
            isDefault: false
          - access: proxy
            name: Tempo
            type: tempo
            url: http://tempo.tempo.svc.cluster.local:3200
            editable: true
            isDefault: false
            jsonData:
              tracesToLogs:
                datasourceUid: loki
                filterByTraceID: true
                spanStartTimeShift: -1h
                spanEndTimeShift: +1h
                mapTag:
                  enabled: true
                  tagName: app
                tags:
                - app
                - namespace
                - pod
                - container
                - cluster
              tracesToMetrics:
                datasourceUid: prometheus
              lokiSearch:
                datasourceUid: loki
          - access: proxy
            name: Alloy
            type: prometheus
            url: http://alloy.alloy.svc.cluster.local:12345
            editable: true
            isDefault: false
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
              - name: default
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
              - name: observability
                orgId: 1
                folder: Observability
                type: file
                disableDeletion: false
                editable: true
                options:
                      path: /var/lib/grafana/dashboards/observability
           dashboards: {}
           downloadDashboards:
             "1860":
               gnetId: 1860
               revision: 36
               datasource: Prometheus
             "10000":
               gnetId: 10000
               revision: 17
               datasource: Prometheus
             "10003":
               gnetId: 10003
               revision: 16
               datasource: Prometheus
             "10001":
               gnetId: 10001
               revision: 16
               datasource: Prometheus
             "10005":
               gnetId: 10005
               revision: 1
               datasource: Prometheus
             "7681":
               gnetId: 7681
               revision: 22
               datasource: Prometheus
             "10015":
               gnetId: 10015
               revision: 23
               datasource: Prometheus
             "14059":
               gnetId: 14059
               revision: 11
               datasource: Prometheus
             "16257":
               gnetId: 16257
               revision: 7
               datasource: Prometheus
             "15983":
               gnetId: 15983
               revision: 3
               datasource: Prometheus
             "14945":
               gnetId: 14945
               revision: 2
               datasource: Prometheus
             "13436":
               gnetId: 13436
               revision: 28
               datasource: Prometheus
             "12889":
               gnetId: 12889
               revision: 9
               datasource: Prometheus
             "15622":
               gnetId: 15622
               revision: 3
               datasource: Prometheus
             "11509":
               gnetId: 11509
               revision: 12
               datasource: Prometheus
             "12291":
               gnetId: 12291
               revision: 11
               datasource: Prometheus
             "11090":
               gnetId: 11090
               revision: 2
               datasource: Prometheus
           defaultDashboardsEnabled: false
          securityContext:
            fsGroup: 472
            runAsUser: 472
            runAsNonRoot: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true

