apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 80.6.0
    chart: kube-prometheus-stack
    helm:
      releaseName: kube-prometheus
      parameters:
      - name: crds.enabled
        value: "false"
      - name: grafana.dashboards
        value: "false"
      valueFiles:
      - https://raw.githubusercontent.com/ebpro/gitops/main/bootstrap/helm-values/kube-prometheus.yaml?v=3
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - CreateNamespace=true
    - Replace=true
    - ForceReplacement=true
