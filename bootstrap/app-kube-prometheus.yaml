apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 80.6.0
    chart: kube-prometheus-stack
    helm:
      releaseName: kube-prometheus
      values: |
        crds:
          enabled: true
      valueFiles:
      - https://raw.githubusercontent.com/ebpro/gitops/main/bootstrap/helm-values/kube-prometheus.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    resourceIgnoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
      - del(.metadata)
      - del(.spec.versions)
      - del(.spec.conversion)
      - del(.spec.validation)
      - del(.spec.additionalPrinterColumns)
      - del(.spec.preserveUnknownFields)
      - del(.spec.group)
      - del(.spec.names)
      - del(.spec.scope)
      - del(.status)
      jsonPointers:
      - /spec
      - /status
    - group: monitoring.coreos.com
      kind: Alertmanager
      jqPathExpressions:
      - del(.metadata)
      - del(.status)
      - del(.spec.resources.requests)
      - del(.spec.template)
    - group: monitoring.coreos.com
      kind: Prometheus
      jqPathExpressions:
      - del(.metadata)
      - del(.status)
      - del(.spec.resources.requests)
      - del(.spec.template)
      - del(.spec.externalUrl)
      - del(.spec.alerting.alertmanagers[].namespace)
      - del(.spec.evaluationInterval)
      - del(.spec.scrapeInterval)
      - del(.spec.scrapeConfigSelector)
      - del(.spec.tsdb)
    - group: monitoring.coreos.com
      kind: ServiceMonitor
      jsonPointers:
      - /metadata/managedFields
      - /metadata/annotations
      - /metadata/resourceVersion
    - group: monitoring.coreos.com
      kind: PodMonitor
      jsonPointers:
      - /metadata/managedFields
      - /metadata/annotations
      - /metadata/resourceVersion
    - group: monitoring.coreos.com
      kind: PrometheusRule
      jsonPointers:
      - /metadata/managedFields
      - /metadata/annotations
    - group: batch
      kind: Job
      jsonPointers:
      - /status
      - /metadata/managedFields
      - /metadata/annotations
      jqPathExpressions:
      - .status
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
      - /spec/volumeName
    - group: ""
      kind: Secret
      name: kube-prometheus-grafana
      jsonPointers:
      - /data
    - group: ""
      kind: Secret
      name: kube-prometheus-grafana-dashboards
      jsonPointers:
      - /data

