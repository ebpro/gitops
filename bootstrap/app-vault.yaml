apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: platform
  source:
    repoURL: https://helm.releases.hashicorp.com
    targetRevision: 0.32.0
    chart: vault
    helm:
      releaseName: vault
      valueFiles:
      - https://raw.githubusercontent.com/ebpro/gitops/main/bootstrap/helm-values/vault.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
