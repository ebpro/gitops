apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: platform
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      targetRevision: 0.32.0
      chart: vault
      helm:
        releaseName: vault
        valueFiles:
          - $values/helm/releases/vault/values.yaml

    - repoURL: https://github.com/ebpro/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    resourceIgnoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jqPathExpressions:
      - del(.webhooks[].clientConfig.caBundle)
      - del(.metadata.annotations)
      - del(.metadata.labels)
      - del(.webhooks[].namespaceSelector)
      - del(.webhooks[].objectSelector)
      - del(.webhooks[].reinvocationPolicy)
      - del(.webhooks[].sideEffects)
      jsonPointers:
      - /metadata/creationTimestamp
      - /metadata/managedFields
      - /metadata/resourceVersion
      - /metadata/uid
      - /metadata/ownerReferences
