apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-init
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '9'
spec:
  project: platform
  source:
    repoURL: https://github.com/ebpro/gitops
    targetRevision: main
    path: kubernetes/harbor-init
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Replace=true
