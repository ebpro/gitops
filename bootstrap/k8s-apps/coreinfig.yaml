apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coreinfig
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
  project: platform
  source:
    path: kubernetes/coredns
    repoURL: https://github.com/ebpro/gitops
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
