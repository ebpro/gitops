apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-build
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  destination:
    namespace: backstage
    server: https://kubernetes.default.svc
  project: platform
  source:
    repoURL: https://github.com/ebpro/gitops
    targetRevision: main
    path: kubernetes/backstage-build
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
