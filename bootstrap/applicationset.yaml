apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-apps
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/ebpro/gitops
      revision: main
      directories:
      - path: apps/*

  template:
    metadata:
      name: '{{path.basename}}'

    spec:
      project: platform

      source:
        repoURL: https://github.com/ebpro/gitops
        targetRevision: main
        path: '{{path}}'

        helm:
          valueFiles:
            - values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'

      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        syncOptions:
          - CreateNamespace=true
