apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubernetes-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  generators:
    - git:
        repoURL: https://github.com/ebpro/gitops
        revision: main
        directories:
          - path: kubernetes/cilium
          - path: kubernetes/coredns
          - path: kubernetes/oauth2-proxy
          - path: kubernetes/ingress
          - path: kubernetes/csi-snapshot-controller
          - path: kubernetes/keycloak-realm
          - path: kubernetes/matrix/element
          - path: kubernetes/matrix/synapse
          - path: kubernetes/observability
          - path: kubernetes/argocd-image-updater
          - path: kubernetes/harbor-init
          - path: bootstrap/keycloak-reconciler
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: platform
      source:
        repoURL: https://github.com/ebpro/gitops
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true


