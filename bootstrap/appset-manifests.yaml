apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubernetes-manifests
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/ebpro/gitops
        revision: main
        directories:
          - path: kubernetes/cert-issuers
          - path: kubernetes/ingress
          - path: kubernetes/postgresql
          - path: kubernetes/declarative
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: platform
      source:
        repoURL: https://github.com/ebpro/gitops
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
