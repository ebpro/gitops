apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alertmanager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
    app.kubernetes.io/managed-by: gitops
    app.kubernetes.io/version: v1
spec:
  project: platform
  source:
    repoURL: https://github.com/ebpro/gitops
    targetRevision: main
    path: kubernetes/alertmanager/alertmanager-config
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
