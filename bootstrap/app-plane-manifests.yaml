apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plane-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '11'
spec:
  project: platform
  source:
    repoURL: https://github.com/ebpro/gitops
    targetRevision: main
    path: kubernetes/plane
  destination:
    server: https://kubernetes.default.svc
    namespace: plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
