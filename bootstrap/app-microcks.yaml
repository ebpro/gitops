apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microcks
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: platform
  source:
    repoURL: https://github.com/ebpro/gitops.git
    path: helm/vendor/microcks
    targetRevision: main
    helm:
      releaseName: microcks
      valueFiles:
      - https://raw.githubusercontent.com/ebpro/gitops/main/helm/releases/microcks/values.yaml?v=7
  destination:
    server: https://kubernetes.default.svc
    namespace: microcks
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: microcks-microcks-grpc-secret
    jsonPointers:
    - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
