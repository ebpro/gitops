apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microcks
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: platform
  source:
    repoURL: https://microcks.io/helm
    targetRevision: 1.13.2
    chart: microcks
    helm:
      releaseName: microcks
      valueFiles:
      - https://raw.githubusercontent.com/ebpro/gitops/main/helm/releases/microcks/values.yaml?v=5
  postRender:
    kustomize:
      patches: |
        - target:
            kind: Deployment
            name: microcks-mongodb
          patch: |-
            - op: replace
              path: /spec/template/spec/containers/0/readinessProbe
              value:
                timeoutSeconds: 5
                initialDelaySeconds: 3
                periodSeconds: 10
                failureThreshold: 3
                exec:
                  command:
                    - /bin/sh
                    - -i
                    - -c
                    - mongosh --quiet 127.0.0.1:27017 -u $MONGODB_USER -p $MONGODB_PASSWORD --eval "1"
  destination:
    server: https://kubernetes.default.svc
    namespace: microcks
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: microcks-microcks-grpc-secret
    jsonPointers:
    - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
