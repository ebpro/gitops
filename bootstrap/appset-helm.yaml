apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-apps
  namespace: argocd

spec:
  generators:
    - git:
        repoURL: https://github.com/ebpro/gitops
        revision: main
        files:
          - path: helm/apps/*.yaml

  template:
    metadata:
      name: '{{path.basename}}'

    spec:
      project: platform

      source:
        repoURL: '{{repoURL}}'
        chart: '{{path.basename}}'
        targetRevision: '{{version}}'
        helm:
          valueFiles:
            - ../../helm/releases/{{path.basename}}/values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
