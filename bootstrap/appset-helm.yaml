apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-apps
  namespace: argocd

spec:
  generators:
  - git:
      repoURL: https://github.com/ebpro/gitops
      revision: main
      directories:
      - path: helm/releases/*

  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: platform

      source:
        repoURL: '{{values.repoURL}}'
        chart: '{{path.basename}}'
        targetRevision: '{{values.version}}'
        helm:
          valueFiles:
            - values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{values.namespace}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
