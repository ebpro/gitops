apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: helm-apps
  namespace: argocd

spec:
  generators:
    - git:
        repoURL: https://github.com/ebpro/gitops
        revision: main

        directories:
          - path: helm/releases/*

  template:
    metadata:
      name: '{{path.basename}}'

    spec:
      project: platform

      source:
        repoURL: https://github.com/ebpro/gitops
        targetRevision: main
        path: '{{path}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: argocd

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
