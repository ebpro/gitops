# Woodpecker CI v3 - values for K3s
# Chart: https://github.com/woodpecker-ci/helm/tree/main/charts/woodpecker (v3.6.5)
# Docs: https://woodpecker-ci.org/docs/

# ─── Server ─────────────────────────────────────────────
server:
  enabled: true

  image:
    tag: "v3.16.0"

  resources:
    limits:
      memory: 1Gi
      cpu: "1"
    requests:
      memory: 512Mi
      cpu: 250m

  env:
    WOODPECKER_ADMIN: "bruno,ci-runner"
    # Host
    WOODPECKER_HOST: "https://woodpecker.ebruno.fr"
    # Server binding
    WOODPECKER_HTTP_ADDR: ":8000"
    WOODPECKER_GRPC_ADDR: ":9000"
    # Database: external CNPG
    WOODPECKER_DATABASE_DRIVER: "postgres"
    WOODPECKER_DATABASE_DATASOURCE:
      valueFrom:
        secretKeyRef:
          name: woodpecker-db-vault
          key: fqdn-uri
    # Forge: Gitea (repo access, pipeline hooks, webhooks)
    WOODPECKER_GITEA: "true"
    WOODPECKER_GITEA_URL: "https://gitea.ebruno.fr"
    WOODPECKER_GITEA_CLIENT: "441a812de1904044012517b6c72819cdaa2156d31713dbed"
    WOODPECKER_GITEA_SECRET:
      valueFrom:
        secretKeyRef:
          name: woodpecker-gitea-oauth
          key: secret
    # Driver: OIDC (Keycloak) — user login only, Forge OAuth != User login
    WOODPECKER_OPEN_ID: "true"
    WOODPECKER_OPEN_ID_CONFIG: "oidc"
    WOODPECKER_OPEN_ID_ISSUER: "https://keycloak.ebruno.fr/realms/platform"
    WOODPECKER_OPEN_ID_SCOPES: "openid profile email groups"
    # Logging
    WOODPECKER_LOG_LEVEL: "debug"
    WOODPECKER_LOG_FORMAT: "text"
    # Server secret — required for agent⇆server encryption (v3)
    WOODPECKER_SECRET: "woodpecker-server-secret-2f8a9e7c-4b3d-11f0-a8c2-0242ac130002"

  # OIDC client secret injected from ExternalSecret (WOODPECKER_OPEN_ID_CLIENT, WOODPECKER_OPEN_ID_SECRET)
  extraSecretNamesForEnvFrom:
    - woodpecker-oidc-secret

  serviceAccount:
    create: true

  service:
    type: ClusterIP
    port: 80

  probes:
    liveness:
      periodSeconds: 10
      failureThreshold: 15
    readiness:
      periodSeconds: 10
      failureThreshold: 6

  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: local-path
    mountPath: "/var/lib/woodpecker"

  ingress:
    enabled: false

# ─── Agent ──────────────────────────────────────────────
agent:
  enabled: true

  replicaCount: 2

  image:
    tag: "v3.16.0"

  resources:
    limits:
      memory: 2Gi
      cpu: "2"
    requests:
      memory: 1Gi
      cpu: 500m

  env:
    WOODPECKER_SERVER: "woodpecker-server:9000"
    WOODPECKER_BACKEND: "kubernetes"
    WOODPECKER_BACKEND_K8S_NAMESPACE: "ci"
    WOODPECKER_BACKEND_K8S_NAMESPACE_PER_ORGANIZATION: "false"
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: "local-path"
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: "10G"
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: "true"
    # Must match server's WOODPECKER_SECRET
    WOODPECKER_SECRET: "woodpecker-server-secret-2f8a9e7c-4b3d-11f0-a8c2-0242ac130002"

  serviceAccount:
    create: true
    rbac:
      create: true

  persistence:
    enabled: true
    size: 2Gi
    mountPath: "/etc/woodpecker"
    storageClass: local-path

# ─── Global ────────────────────────────────────────────
imagePullSecrets:
  - name: harbor-registry-secret
