# Woodpecker CI v3 - values for K3s
hostAliases:
  - ip: "10.43.222.23"
    hostnames:
      - "gitea.ebruno.fr"
      - "keycloak.ebruno.fr"

# Chart: https://github.com/woodpecker-ci/helm/tree/main/charts/woodpecker (v3.6.5)
# Docs: https://woodpecker-ci.org/docs/
# Updated: 2026-08-05 - Unified agent/grpc secrets, pipeline network policy, internal Gitea URL

# ─── Server ─────────────────────────────────────────────
server:
  enabled: true

  image:
    tag: "v3.17.0"

  resources:
    limits:
      memory: 1Gi
      cpu: "1"
    requests:
      memory: 512Mi
      cpu: 250m

  env:
    WOODPECKER_ADMIN: "bruno,ci-runner"
    # Host
    WOODPECKER_HOST: "https://woodpecker.ebruno.fr"
    # Server binding
    WOODPECKER_HTTP_ADDR: ":8000"
    WOODPECKER_GRPC_ADDR: ":9000"
    # Database: external CNPG
    WOODPECKER_DATABASE_DRIVER: "postgres"
    WOODPECKER_DATABASE_DATASOURCE:
      valueFrom:
        secretKeyRef:
          name: woodpecker-db-vault
          key: fqdn-uri
    # Forge: Gitea. Forge = login (Gitea OAuth) + repo (Gitea API). Forge is ONE provider.
    # Note: Keycloak OIDC login for Woodpecker is NOT supported. Users login via Forge OAuth.
    WOODPECKER_FORGE: "gitea"
    WOODPECKER_GITEA: "true"
     WOODPECKER_GITEA_URL: "http://gitea-http.gitea.svc.cluster.local:3000"
    WOODPECKER_GITEA_CLIENT:
      valueFrom:
        secretKeyRef:
          name: woodpecker-gitea-oauth
          key: id
    WOODPECKER_GITEA_SECRET:
      valueFrom:
        secretKeyRef:
          name: woodpecker-gitea-oauth
          key: secret
    WOODPECKER_GITEA_SKIP_VERIFY: "false"
    # Logging
    WOODPECKER_LOG_LEVEL: "warn"
    WOODPECKER_LOG_FORMAT: "json"
    # Server secret — required for agent⇆server encryption (v3)
    WOODPECKER_SECRET:
      valueFrom:
        secretKeyRef:
          name: woodpecker-server-auth
          key: WOODPECKER_SECRET
    WOODPECKER_GRPC_SECRET:
      valueFrom:
        secretKeyRef:
          name: woodpecker-server-auth
          key: WOODPECKER_GRPC_SECRET
    WOODPECKER_AGENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: woodpecker-server-auth
          key: WOODPECKER_SECRET

  serviceAccount:
    create: true

  service:
    type: ClusterIP
    port: 80

  probes:
    liveness:
      periodSeconds: 10
      failureThreshold: 15
    readiness:
      periodSeconds: 10
      failureThreshold: 6

  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: local-path
    mountPath: "/var/lib/woodpecker"

  ingress:
    enabled: false

# ─── Agent ──────────────────────────────────────────────
agent:
  enabled: true

  replicaCount: 2

  image:
    tag: "v3.17.0"

  resources:
    limits:
      memory: 2Gi
      cpu: "2"
    requests:
      memory: 1Gi
      cpu: 500m

  env:
    WOODPECKER_SERVER: "woodpecker-server:9000"
    WOODPECKER_AGENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: woodpecker-server-auth
          key: WOODPECKER_SECRET
    WOODPECKER_GRPC_SECRET:
      valueFrom:
        secretKeyRef:
          name: woodpecker-server-auth
          key: WOODPECKER_GRPC_SECRET
    WOODPECKER_LOG_LEVEL: "warn"
    WOODPECKER_BACKEND: "kubernetes"
    WOODPECKER_BACKEND_K8S_NAMESPACE: "ci"
    WOODPECKER_BACKEND_K8S_NAMESPACE_PER_ORGANIZATION: "false"
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: "local-path"
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: "10G"
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
    WOODPECKER_BACKEND_K8S_POD_LABELS: '{"woodpecker-pipeline":"true","app.kubernetes.io/part-of":"woodpecker"}'
    WOODPECKER_BACKEND_K8S_POD_SERVICE_ACCOUNT: "woodpecker-agent"
    WOODPECKER_CONNECT_RETRY_COUNT: "20"

  serviceAccount:
    create: true
    rbac:
      create: true

  createAgentSecret: false
  mapAgentSecret: false

  persistence:
    enabled: true
    size: 2Gi
    mountPath: "/etc/woodpecker"
    storageClass: local-path

# ─── Global ────────────────────────────────────────────
imagePullSecrets:
  - name: harbor-registry-secret
