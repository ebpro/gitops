ports:
  web:
    redirectTo:
      port: websecure
  websecure:
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: ebruno.fr

certificatesResolvers:
  letsencrypt:
    email: acme@ebruno.fr
    caServer: https://acme-v02.api.letsencrypt.org/directory
    staging: false
    dnsChallenge:
      provider: ovh
      delayBeforeCheck: 10
      resolvers:
        - "1.1.1.1:53"
        - "8.8.8.8:53"

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
    allowEmptyServices: true

ingressClass:
  enabled: true
  isDefaultClass: false

env:
  - name: OVH_ENDPOINT
    value: ovh-eu
  - name: OVH_APPLICATION_KEY
    valueFrom:
      secretKeyRef:
        name: ovh-credentials
        key: applicationKey
  - name: OVH_APPLICATION_SECRET
    valueFrom:
      secretKeyRef:
        name: ovh-credentials
        key: applicationSecret
  - name: OVH_CONSUMER_KEY
    valueFrom:
      secretKeyRef:
        name: ovh-credentials
        key: consumerKey

service:
  spec:
    loadBalancerIP: 10.2.248.31

rbac:
  enabled: true

persistence:
  enabled: true
  name: traefik
  size: 1Gi

logs:
  general:
    level: INFO
metrics:
  prometheus:
    enabled: true
