ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          priority: 10
  websecure:
    http:
      tls:
        certResolver: letsencrypt-ovh
        domains:
          - main: ebruno.fr

certificatesResolvers:
  letsencrypt-ovh:
    acme:
      email: acme@ebruno.fr
      caServer: https://acme-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: ovh
        propagationTimeout: 120s
        pollingInterval: 5s
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
      storage: /data/acme.json

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
    allowEmptyServices: true

ingressClass:
  enabled: true
  isDefaultClass: false

env:
  - name: OVH_ENDPOINT
    value: ovh-eu
  - name: OVH_APPLICATION_KEY
    valueFrom:
      secretKeyRef:
        name: ovh-credentials
        key: applicationKey
  - name: OVH_APPLICATION_SECRET
    valueFrom:
      secretKeyRef:
        name: ovh-credentials
        key: applicationSecret
  - name: OVH_CONSUMER_KEY
    valueFrom:
      secretKeyRef:
        name: ovh-credentials
        key: consumerKey

persistence:
  enabled: true
  name: traefik
  size: 1Gi

logs:
  general:
    level: INFO
metrics:
  prometheus:
    enabled: true
