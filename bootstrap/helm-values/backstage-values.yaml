---
serviceAccount:
  create: true
  automountServiceAccountToken: true

backstage:
  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: latest
    pullPolicy: Always

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  strategy:
    type: Recreate

  startupProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 30

  readinessProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 10

  livenessProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 5

  extraEnvVars:
    - name: LOG_LEVEL
      value: info

    - name: BACKSTAGE_JWT
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: BACKSTAGE_JWT

    - name: APP_CONFIG_backend_database_connection_user
      valueFrom:
        secretKeyRef:
          name: backstage-db-superuser
          key: username

    - name: APP_CONFIG_backend_database_connection_password
      valueFrom:
        secretKeyRef:
          name: backstage-db-superuser
          key: password

    - name: BACKSTAGE_KEYCLOAK_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: BACKSTAGE_KEYCLOAK_CLIENT_ID

    - name: BACKSTAGE_KEYCLOAK_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: BACKSTAGE_KEYCLOAK_CLIENT_SECRET

  extraEnvVarsSecrets:
    - backstage-secrets

  extraAppConfig:
    - filename: app-config.production.yaml
      configMapRef: backstage-custom-config

extraDeploy:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: backstage-custom-config
      namespace: backstage
      annotations:
        updated: "2026-07-25- reopening staging"
    data:
      app-config.production.yaml: |
        app:
          title: Platform Developer Portal
          baseUrl: https://backstage.ebruno.fr

        backend:
          baseUrl: https://backstage.ebruno.fr
          listen:
            port: 7007
          auth:
            options:
              debug: false
            keys:
              - secret: ${BACKSTAGE_JWT}
          database:
            client: pg
            connection:
              host: backstage-db-rw.backstage.svc.cluster.local
              port: 5432
              database: backstage
              user: ${APP_CONFIG_backend_database_connection_user}
              password: ${APP_CONFIG_backend_database_connection_password}
              ssl:
                rejectUnauthorized: false
          cors:
            origin: https://backstage.ebruno.fr
            methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
            credentials: true
          csp:
            connect-src: ["'self'", 'http:', 'https:']
            frame-ancestors: ["'self'"]
            img-src: ["'self'", 'data:']
            script-src: ["'self'", "'unsafe-inline'"]
            style-src: ["'self'", "'unsafe-inline'"]
          logger:
            logLevel: info

        integrations:
          sonarqube:
            - host: sonarqube.ebruno.fr
              baseUrl: https://sonarqube.ebruno.fr

        frontend:
          baseUrl: https://backstage.ebruno.fr

        catalog:
          import:
            entityFilename: backstage.yaml
            pullRequestBranchName: backstage-integration
          rules:
            - allow:
                - kind: Component
                - kind: API
                - kind: Resource
                - kind: System
                - kind: Domain
                - kind: Group
                - kind: Template
                - kind: User
          locations:
            - type: url
              target: https://raw.githubusercontent.com/ebpro/gitops/main/kubernetes/backstage-catalog/entities.yaml

        scaffolder:
          backend:
            database:
              type: pg
            defaultRemote: origin

        auth:
          providers:
            guest:
              dangerouslyAllowInsecureLoginByDefault: true


        sonarqube:
          baseUrl: https://sonarqube.ebruno.fr

        grafana:
          dashboards:
            - name: Backstage Dashboard
              url: https://grafana.ebruno.fr

        argocd:
          ui:
            baseUrl: https://argocd.ebruno.fr
          backend:
            baseUrl: https://argocd.ebruno.fr/api/v1

        kubernetes:
          serviceLocatorMethod:
            type: multiTenant
          clusterLocatorMethods:
            - type: config
              clusters:
                - url: https://kubernetes.default.svc
                  name: local-cluster
                  authProvider: serviceAccount
                  skipTLSVerify: true
          skipConfigValidate: true

        techdocs:
          builder: local
          generator:
            runIn: local
          publisher:
            type: local
