---
image:
  registry: ghcr.io
  repository: backstage/backstage
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automountServiceAccountToken: true

backstage:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi

  strategy:
    type: Recreate

  startupProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 30

  readinessProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 10

  livenessProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 5

  extraEnvVars:
    - name: LOG_LEVEL
      value: info

    - name: APP_CONFIG_backend_database_connection_user
      valueFrom:
        secretKeyRef:
          name: backstage-db-superuser
          key: username

    - name: APP_CONFIG_backend_database_connection_password
      valueFrom:
        secretKeyRef:
          name: backstage-db-superuser
          key: password

    - name: GITEA_TOKEN
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: GITEA_TOKEN

    - name: BACKSTAGE_GITEA_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: BACKSTAGE_GITEA_CLIENT_ID

    - name: BACKSTAGE_GITEA_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: BACKSTAGE_GITEA_CLIENT_SECRET

  extraEnvVarsSecrets:
    - backstage-secrets

  extraAppConfig:
    - filename: app-config.production.yaml
      configMapRef: backstage-custom-config

extraDeploy:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: backstage-custom-config
      namespace: backstage
    data:
      app-config.production.yaml: |
        app:
          title: Platform Developer Portal
          baseUrl: https://backstage.ebruno.fr

        backend:
          baseUrl: https://backstage.ebruno.fr
          listen:
            port: 7007
          auth:
            options:
              debug: false
            keys:
              - secret: ${BACKSTAGE_JWT}
          database:
            client: pg
            connection:
              host: backstage-db-rw.backstage.svc.cluster.local
              port: 5432
              database: backstage
              user: ${APP_CONFIG_backend_database_connection_user}
              password: ${APP_CONFIG_backend_database_connection_password}
              ssl:
                rejectUnauthorized: false
          cors:
            origin: https://backstage.ebruno.fr
            methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
            credentials: true
          csp:
            connect-src: ["'self'", 'http:', 'https:']
            frame-ancestors: ["'self'"]
            img-src: ["'self'", 'data:']
            script-src: ["'self'"]
            style-src: ["'self'"]
          logger:
            logLevel: info

        integrations:
          gitea:
            - host: gitea.ebruno.fr
              baseUrl: https://gitea.ebruno.fr
              token: ${GITEA_TOKEN}
          sonarqube:
            - host: sonarqube.ebruno.fr
              baseUrl: https://sonarqube.ebruno.fr

        frontend:
          baseUrl: https://backstage.ebruno.fr

        catalog:
           import:
             entityFilename: backstage.yaml
             pullRequestBranchName: backstage-integration
           providers:
             giteaOrg:
               default:
                 host: gitea.ebruno.fr
                 organization: /
                 token: ${GITEA_TOKEN}
                 schedule:
                   wait: { seconds: 5 }
                   frequency: { seconds: 300 }
                   timeout: { seconds: 60 }
           rules:
             - allow:
                 - kind: Component
                 - kind: API
                 - kind: Resource
                 - kind: System
                 - kind: Domain
                 - kind: Group
                 - kind: Template
                 - kind: User
           locations:
             - type: gitea
               target: gitea.ebruno.fr/ebruno/backstage-entities

        scaffolder:
          backend:
            database:
              type: pg
            defaultRemote: origin

         auth:
          dangerouslyAllowExternalLoginByDefault: true

        sonarqube:
          baseUrl: https://sonarqube.ebruno.fr

        argocd:
          ui:
            baseUrl: https://argocd.ebruno.fr
          backend:
            baseUrl: https://argocd.ebruno.fr/api/v1

        kubernetes:
           serviceLocatorMethod:
             type: multiTenant
           clusterLocatorMethods:
             - type: config
               clusters: []
           skipConfigValidate: false

        techdocs:
          builder: local
          generator:
            runIn: local
          publisher:
            type: local
