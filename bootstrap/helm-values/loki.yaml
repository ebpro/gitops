backend:
  replicas: 0
chunksCache:
  enabled: false
deploymentMode: SingleBinary
gateway:
  enabled: false
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        index:
          period: 24h
          prefix: index_
        object_store: filesystem
        schema: v13
        store: tsdb
  storage:
    type: filesystem
 monitoring:
  lokiCanary:
    enabled: false
  selfMonitoring:
    enabled: false
 read:
  replicas: 0
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
resultsCache:
  enabled: false
 singleBinary:
  persistence:
    enabled: true
    size: 50Gi
    storageClass: local-path
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
 test:
  enabled: false
 write:
  replicas: 0
