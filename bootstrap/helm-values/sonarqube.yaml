community:
  enabled: true
extraInitContainers:
  - args:
      - wget -O /tmp/sonarqube-webapp.zip https://github.com/mc1arke/sonarqube-community-branch-plugin/releases/download/26.1.0/sonarqube-webapp.zip && unzip -o /tmp/sonarqube-webapp.zip -d /web && chmod -R 755 /web && chown -R 1000:0 /web && rm -f /tmp/sonarqube-webapp.zip
    command:
      - sh
      - -c
    image: busybox:1.37
    name: download-webapp
    volumeMounts:
      - mountPath: /web
        name: webapp
extraVolumeMounts:
  - mountPath: /opt/sonarqube/web
    name: webapp
extraVolumes:
  - emptyDir:
      sizeLimit: 50Mi
    name: webapp
jdbcOverwrite:
  enabled: true
  jdbcSecretName: sonarqube-postgresql
  jdbcSecretPasswordKey: postgresql-password
  jdbcUrl: jdbc:postgresql://sonarqube-postgresql.sonarqube.svc.cluster.local:5432/sonarDB
  jdbcUsername: sonarUser
jvmCeOpts: -javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-26.1.0.jar=ce
jvmOpts: -javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-26.1.0.jar=web
monitoringPasscodeSecretName: sonarqube-monitoring-password
monitoringPasscodeSecretKey: monitoring-passcode
plugins:
  install:
    - https://github.com/mc1arke/sonarqube-community-branch-plugin/releases/download/26.1.0/sonarqube-community-branch-plugin-26.1.0.jar
resources:
  limits:
    cpu: 800m
    memory: 6Gi
  requests:
    cpu: 500m
    memory: 2Gi
sonarProperties:
  sonar.ce.javaAdditionalOpts: -javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-26.1.0.jar=ce
  sonar.web.javaAdditionalOpts: -javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-26.1.0.jar=web
startupProbe:
  failureThreshold: 60
  periodSeconds: 10
