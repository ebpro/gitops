replicas: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.7.0"
  pullPolicy: Always

serviceAccount:
  create: true
  name: ""
  annotations: {}
  labels: {}

rbac:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get
        - list

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsNonRoot: true

extraEnv: |
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-secrets
        key: adminPassword
  - name: KC_DB
    value: "postgres"
  - name: KC_DB_URL
    value: "jdbc:postgresql://keycloak-db-rw.keycloak.svc.cluster.local:5432/keycloak"
  - name: KC_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-db-app
        key: username
  - name: KC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db-app
        key: password
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_PROXY_HEADERS
    value: forwarded
  - name: KC_HOSTNAME
    value: "keycloak.ebruno.fr"
  - name: KC_HOSTNAME_STRICT_HTTPS
    value: "true"
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: "true"
  - name: KC_HEALTH_ENABLED
    value: "true"
  - name: KC_METRICS_ENABLED
    value: "true"

extraEnvFrom: ""

extraInitContainers: ""

extraContainers: ""

lifecycleHooks: |

terminationGracePeriodSeconds: 60

clusterDomain: cluster.local

# Keycloak 26.7.0: kc.sh entrypoint handles build automatically on first start
command:
  - /opt/keycloak/bin/kc.sh

args:
  - start
  - "--hostname=keycloak.ebruno.fr"

priorityClassName: ""

affinity: |
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            {{- include "keycloak.selectorLabels" . | nindent 10 }}
          matchExpressions:
            - key: app.kubernetes.io/component
              operator: NotIn
              values:
                - test
        topologyKey: kubernetes.io/hostname

topologySpreadConstraints:

nodeSelector: {}

tolerations: []

podLabels: {}

podAnnotations: {}

livenessProbe: |
  httpGet:
    path: /health/live
    port: 9000
  initialDelaySeconds: 180
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe: |
  httpGet:
    path: /health/ready
    port: 9000
  initialDelaySeconds: 180
  timeoutSeconds: 1
  periodSeconds: 10
  failureThreshold: 3

startupProbe: |
  httpGet:
    path: /health/started
    port: 9000
  initialDelaySeconds: 60
  timeoutSeconds: 10
  failureThreshold: 300
  periodSeconds: 10

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 1
    memory: 4Gi

startupScripts: {}

extraVolumes: ""

extraVolumeMounts: ""

extraPorts: []

podDisruptionBudget:
  minAvailable: 1

statefulsetAnnotations: {}

statefulsetLabels: {}

secrets: {}

service:
  annotations: {}
  labels: {}
  type: ClusterIP
  loadBalancerIP: ""
  httpPort: 80
  httpNodePort: null
  httpsPort: 8443
  httpsNodePort: null
  httpManagementPort: 9990
  httpManagementNodePort: null
  extraPorts: []
  loadBalancerSourceRanges: []
  externalTrafficPolicy: "Cluster"
  sessionAffinity: ""
  sessionAffinityConfig: {}

ingress:
  enabled: false
  ingressClassName: ""
  servicePort: http
  annotations: {}
  labels: {}
  rules: []
  tls: []

networkPolicy:
  enabled: false


postgresql:
  enabled: false
  postgresqlUsername: keycloak
  postgresqlPassword: keycloak
  postgresqlDatabase: keycloak
  networkPolicy:
    enabled: false

serviceMonitor:
  enabled: false

extraServiceMonitor:
  enabled: false

prometheusRule:
  enabled: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

test:
  enabled: false

persistence:
  enabled: true
  storageClass: "local-path"
  size: 10Gi
