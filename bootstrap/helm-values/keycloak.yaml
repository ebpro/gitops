replicas: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: 17.0.1
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}
  labels: {}

rbac:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get
        - list

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsNonRoot: true

extraEnv: |
  - name: QUARKUS_DATASOURCE_JDBC_URL
    value: jdbc:postgresql://keycloak-db-rw.keycloak.svc.cluster.local:5432/keycloak
  - name: QUARKUS_DATASOURCE_JDBC_USER
    valueFrom:
      secretKeyRef:
        name: keycloak-db-credentials
        key: username
  - name: QUARKUS_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db-credentials
        key: password
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-secrets
        key: adminPassword
  - name: KC_DB
    value: "postgres"
  - name: KC_DB_URL
    value: "jdbc:postgresql://keycloak-db-rw.keycloak.svc.cluster.local:5432/keycloak"
  - name: KC_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-db-credentials
        key: username
  - name: KC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db-credentials
        key: password
  - name: KC_PROXY
    value: "edge"
  - name: KC_HOSTNAME
    value: "keycloak.ebruno.fr"

extraEnvFrom: ""

extraInitContainers: ""

extraContainers: ""

lifecycleHooks: |

terminationGracePeriodSeconds: 60

clusterDomain: cluster.local

command:
  - /opt/keycloak/bin/kc.sh

args:
  - start
  - --proxy=edge
  - --hostname=keycloak.ebruno.fr
  - --hostname-strict-backchannel=true

priorityClassName: ""

affinity: |
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            {{- include "keycloak.selectorLabels" . | nindent 10 }}
          matchExpressions:
            - key: app.kubernetes.io/component
              operator: NotIn
              values:
                - test
        topologyKey: kubernetes.io/hostname

topologySpreadConstraints:

nodeSelector: {}

tolerations: []

podLabels: {}

podAnnotations: {}

livenessProbe: |
  httpGet:
    path: /q/health/live
    port: http
  initialDelaySeconds: 120
  timeoutSeconds: 5
  periodSeconds: 30
  failureThreshold: 3

readinessProbe: |
  httpGet:
    path: /q/health/ready
    port: http
  initialDelaySeconds: 60
  timeoutSeconds: 1
  periodSeconds: 10
  failureThreshold: 3

startupProbe: |
  httpGet:
    path: /q/health/started
    port: http
  initialDelaySeconds: 30
  timeoutSeconds: 5
  failureThreshold: 180
  periodSeconds: 10

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1
    memory: 2Gi

startupScripts:
  keycloak.cli: |
    {{- .Files.Get "scripts/keycloak.cli" }}

extraVolumes: ""

extraVolumeMounts: ""

extraPorts: []

podDisruptionBudget:
  minAvailable: 1

statefulsetAnnotations: {}

statefulsetLabels: {}

secrets: {}

service:
  annotations: {}
  labels: {}
  type: ClusterIP
  loadBalancerIP: ""
  httpPort: 80
  httpNodePort: null
  httpsPort: 8443
  httpsNodePort: null
  httpManagementPort: 9990
  httpManagementNodePort: null
  extraPorts: []
  loadBalancerSourceRanges: []
  externalTrafficPolicy: "Cluster"
  sessionAffinity: ""
  sessionAffinityConfig: {}

ingress:
  enabled: false
  ingressClassName: ""
  servicePort: http
  annotations: {}
  labels: {}
  rules: []
  tls: []

networkPolicy:
  enabled: false

pgchecker:
  image:
    repository: docker.io/busybox
    tag: 1.32
    pullPolicy: IfNotPresent
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
  resources:
    requests:
      cpu: "20m"
      memory: "32Mi"
    limits:
      cpu: "20m"
      memory: "32Mi"

postgresql:
  enabled: false
  postgresqlUsername: keycloak
  postgresqlPassword: keycloak
  postgresqlDatabase: keycloak
  networkPolicy:
    enabled: false

serviceMonitor:
  enabled: false

extraServiceMonitor:
  enabled: false

prometheusRule:
  enabled: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

test:
  enabled: false
