replicas: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: 17.0.1
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}
  labels: {}

rbac:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get
        - list

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsNonRoot: true

extraEnv: |
  - name: DB_VENDOR
    value: postgres
  - name: DB_ADDR
    value: keycloak-db-primary.keycloak.svc.cluster.local
  - name: DB_PORT
    value: "5432"
  - name: DB_DATABASE
    value: keycloak
  - name: DB_USER
    value: keycloak
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db-credentials
        key: password
  - name: KEYCLOAK_USER
    value: admin
  - name: KEYCLOAK_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-secrets
        key: adminPassword
  - name: PROXY_ADDRESS_FORWARDING
    value: "true"
  - name: X_FORWARDED_PREFIX
    value: ""

extraEnvFrom: ""

extraInitContainers: ""

extraContainers: ""

lifecycleHooks: |

terminationGracePeriodSeconds: 60

clusterDomain: cluster.local

command: []

args: []

priorityClassName: ""

affinity: |
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            {{- include "keycloak.selectorLabels" . | nindent 10 }}
          matchExpressions:
            - key: app.kubernetes.io/component
              operator: NotIn
              values:
                - test
        topologyKey: kubernetes.io/hostname

topologySpreadConstraints:

nodeSelector: {}

tolerations: []

podLabels: {}

podAnnotations: {}

livenessProbe: |
  httpGet:
    path: /auth/
    port: http
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe: |
  httpGet:
    path: /auth/realms/master
    port: http
  initialDelaySeconds: 30
  timeoutSeconds: 1
  periodSeconds: 10
  failureThreshold: 3

startupProbe: |
  httpGet:
    path: /auth/
    port: http
  initialDelaySeconds: 30
  timeoutSeconds: 1
  failureThreshold: 60
  periodSeconds: 5

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1
    memory: 2Gi

startupScripts:
  keycloak.cli: |
    {{- .Files.Get "scripts/keycloak.cli" }}

extraVolumes: ""

extraVolumeMounts: ""

extraPorts: []

podDisruptionBudget:
  minAvailable: 1

statefulsetAnnotations: {}

statefulsetLabels: {}

secrets: {}

service:
  annotations: {}
  labels: {}
  type: ClusterIP
  loadBalancerIP: ""
  httpPort: 80
  httpNodePort: null
  httpsPort: 8443
  httpsNodePort: null
  httpManagementPort: 9990
  httpManagementNodePort: null
  extraPorts: []
  loadBalancerSourceRanges: []
  externalTrafficPolicy: "Cluster"
  sessionAffinity: ""
  sessionAffinityConfig: {}

ingress:
  enabled: false
  ingressClassName: ""
  servicePort: http
  annotations: {}
  labels: {}
  rules: []
  tls: []

networkPolicy:
  enabled: true

pgchecker:
  image:
    repository: docker.io/busybox
    tag: 1.32
    pullPolicy: IfNotPresent
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
  resources:
    requests:
      cpu: "20m"
      memory: "32Mi"
    limits:
      cpu: "20m"
      memory: "32Mi"

postgresql:
  enabled: false
  postgresqlUsername: keycloak
  postgresqlPassword: keycloak
  postgresqlDatabase: keycloak
  networkPolicy:
    enabled: false

serviceMonitor:
  enabled: false

extraServiceMonitor:
  enabled: false

prometheusRule:
  enabled: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

test:
  enabled: false
