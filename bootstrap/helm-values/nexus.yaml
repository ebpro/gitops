env:
  - name: NEXUS_DATASTORE_NEXUS_JDBCURL
    value: jdbc:postgresql://nexus-postgresql.nexus.svc.cluster.local:5432/nexus?currentSchema=nexus
  - name: NEXUS_DATASTORE_NEXUS_USERNAME
    valueFrom:
      secretKeyRef:
        key: username
        name: nexus-postgres-auth
  - name: NEXUS_DATASTORE_NEXUS_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: nexus-postgresql-auth
image:
  pullPolicy: IfNotPresent
  repository: docker.io/sonatype/nexus3
  tag: 3.90.2
ingress:
  enabled: false
install4jAddVmParams: -Djava.util.prefs.userRoot=${NEXUS_DATA}/javaprefs -Xms4096m -Xmx4096m -XX:MaxDirectMemorySize=8192m
persistence:
  accessMode: ReadWriteOnce
  enabled: true
  existingClaim: nexus-nexus-repository-manager-data
  retainDeleted: true
  retainScaled: true
  size: 50Gi
  storageClass: local-path
podSecurityContext:
  fsGroup: 200
replicas: 1
resources:
  limits:
    cpu: 4
    memory: 4Gi
  requests:
    cpu: 3400m
    memory: 4Gi
securityContext:
  runAsGroup: 200
  runAsNonRoot: true
  runAsUser: 200
service:
  port: 8081
  type: ClusterIP
