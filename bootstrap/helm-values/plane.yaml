planeVersion: v1.2.0

dockerRegistry:
  enabled: false

ingress:
  enabled: true
  ingressClass: traefik
  appHost: plane.ebruno.fr

redis:
  local_setup: false

postgres:
  local_setup: false

rabbitmq:
  local_setup: true

env:
  remote_redis_url: redis://plane-redis.plane.svc.cluster.local:6379/0
  pgdb_remote_url: postgresql://plane:plane2026Secure@plane-postgresql.plane.svc.cluster.local:5432/plane
  PLANE_URL: https://plane.ebruno.fr
  docstore_bucket: uploads

external_secrets:
  pgdb_existingSecret: plane-postgresql-auth
  app_env_existingSecret: plane-oidc-secret

ssl:
  enabled: true
  tls_secret_name: plane-tls

worker:
  memoryLimit: 2048Mi
  cpuLimit: 1000m
  cpuRequest: 250m
  memoryRequest: 512Mi

api:
  memoryLimit: 2048Mi
  cpuLimit: 1000m
  cpuRequest: 250m
  memoryRequest: 512Mi

beatworker:
  memoryLimit: 2048Mi
  cpuLimit: 1000m
  cpuRequest: 250m
  memoryRequest: 512Mi

replicas: 2

autoscaling:
  enabled: false
