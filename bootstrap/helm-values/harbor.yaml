expose:
  ingress:
    enabled: false
  tls:
    enabled: false
  type: clusterIP
internalTLS:
  enabled: false
database:
  type: external
  external:
    host: harbor-db-rw.harbor.svc.cluster.local
    port: "5432"
    username: postgres
    coreDatabase: registry
    password: ""
    existingSecret: harbor-db-superuser
    sslmode: disable
externalURL: https://harbor.ebruno.fr
persistence:
  enabled: true
  persistentVolumeClaim:
    chartmuseum:
      accessMode: ReadWriteOnce
      size: 10Gi
      storageClass: local-path
    database:
      accessMode: ReadWriteOnce
      size: 20Gi
      storageClass: local-path
    jobservice:
      accessMode: ReadWriteOnce
      size: 5Gi
      storageClass: local-path
    redis:
      accessMode: ReadWriteOnce
      size: 10Gi
      storageClass: local-path
    registry:
      accessMode: ReadWriteOnce
      size: 50Gi
      storageClass: local-path
  resourcePolicy: keep
resources:
  core:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  portal:
    requests:
      cpu: 50m
      memory: 128Mi
core:
  revisionHistoryLimit: 0
  initContainers:
    - name: configure-oidc
      image: docker.io/library/busybox:1.36
      command:
        - /bin/sh
        - -ec
        - |
          MAX_RETRIES=30
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            if wget -q --spider --timeout=5 "$CORE_URL/api/v2.0/ping" 2>/dev/null; then
              echo "Harbor is ready"
              break
            fi
            RETRY=$((RETRY + 1))
            sleep 5
          done
          if [ $RETRY -eq $MAX_RETRIES ]; then
            echo "Harbor did not become ready in time"
            exit 1
          fi
          echo "Applying auth_mode..."
          wget -qO- --post-data='{"auth_mode":"oidc_auth"}' --header="Content-Type: application/json" "$CORE_URL/api/v2.0/configurations" --method=PUT
          echo "Applying primary_auth_mode..."
          wget -qO- --post-data='{"primary_auth_mode":true}' --header="Content-Type: application/json" "$CORE_URL/api/v2.0/configurations" --method=PUT
          echo "Applying OIDC settings..."
          wget -qO- --post-data='{"oidc_endpoint":"https://keycloak.ebruno.fr/realms/platform","oidc_client_id":"harbor","oidc_name":"Keycloak","oidc_admin_group":"platform-admins","oidc_groups_claim":"groups","oidc_scope":"openid profile email","oidc_user_claim":"email"}' --header="Content-Type: application/json" "$CORE_URL/api/v2.0/configurations" --method=PUT
          echo "Applying oidc_auto_onboard..."
          wget -qO- --post-data='{"oidc_auto_onboard":true}' --header="Content-Type: application/json" "$CORE_URL/api/v2.0/configurations" --method=PUT
          echo "Applying oidc_verify_cert..."
          wget -qO- --post-data='{"oidc_verify_cert":true}' --header="Content-Type: application/json" "$CORE_URL/api/v2.0/configurations" --method=PUT
          echo "Applying oidc_client_secret..."
          SECRET_FIELD="oidc_client_secret"
          wget -qO- --post-data="{\"$SECRET_FIELD\":\"$HARBOR_OIDC_CLIENT_SECRET\"}" --header="Content-Type: application/json" "$CORE_URL/api/v2.0/configurations" --method=PUT
          echo "OIDC configuration complete"
      env:
        - name: CORE_URL
          value: "http://harbor-core:8080"
        - name: HARBOR_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: harbor-oidc-secret
              key: Harboroidcclientsecret
  extraEnvVars:
    - name: HARBOR_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: harbor-oidc-secret
          key: Harboroidcclientsecret
jobservice:
  revisionHistoryLimit: 0
service:
  type: ClusterIP
