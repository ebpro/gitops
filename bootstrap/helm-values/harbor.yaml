expose:
  ingress:
    enabled: false
  tls:
    enabled: false
  type: clusterIP
internalTLS:
  enabled: false
database:
  type: external
  external:
    host: harbor-db-rw.harbor.svc.cluster.local
    port: "5432"
    username: postgres
    coreDatabase: registry
    existingSecret: harbor-db-superuser
    sslmode: disable
externalURL: https://harbor.ebruno.fr
persistence:
  enabled: true
  persistentVolumeClaim:
    chartmuseum:
      accessMode: ReadWriteOnce
      size: 10Gi
      storageClass: local-path
    database:
      accessMode: ReadWriteOnce
      size: 20Gi
      storageClass: local-path
    jobservice:
      accessMode: ReadWriteOnce
      size: 5Gi
      storageClass: local-path
    redis:
      accessMode: ReadWriteOnce
      size: 10Gi
      storageClass: local-path
    registry:
      accessMode: ReadWriteOnce
      size: 50Gi
      storageClass: local-path
  resourcePolicy: keep
resources:
  core:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  portal:
    requests:
      cpu: 50m
      memory: 128Mi
auth:
  mode: oidc
  oidc:
    loginUrl: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/auth
    issuer: https://keycloak.ebruno.fr/realms/platform
    redirectURL: https://harbor.ebruno.fr/oidc/callback
    name: Keycloak
    clientID: harbor
    clientSecret: "${HARBOR_OIDC_CLIENT_SECRET}"
    verify: true
    scope: openid profile email groups
    groupsClaim: groups
    adminMetadata:
      adminGroup: platform-admins
    xsrf: ""
core:
  extraEnvVars:
    - name: HARBOR_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: harbor-oidc-secret
          key: Harboroidcclientsecret
service:
  type: ClusterIP
