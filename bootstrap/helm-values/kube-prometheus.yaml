alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: local-path
  enabled: true
coreDns:
  enabled: true
grafana:
  additionalDataSources:
    - access: proxy
      editable: true
      isDefault: false
      name: Loki
      type: loki
      url: http://loki:3100
  adminPassword: ""
  existingSecret: grafana-admin-password
  existingSecretKey: admin-password
  enabled: true
  extraSecretMounts:
    - name: grafana-oidc-secrets
      mountPath: /etc/grafana/secrets
      secretName: grafana-oidc-secrets
      readOnly: true
  grafana.ini:
    auth.generic_oauth:
      allow_sign_up: true
      allowed_groups: platform-admins,platform-engineers,developers,security-team,qa-team,readonly
      api_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/userinfo
      auth_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/auth
      client_id: grafana
      client_secret: "$__file{/etc/grafana/secrets/CLIENT_SECRET_GRAFANA}"
      enabled: true
      login_attribute_path: email
      name: Keycloak
      role_attribute_path: contains(groups,"platform-admins") && "Admin" || contains(groups,"readonly") && "Viewer" || "Editor"
      scopes: openid profile email groups
      token_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/token
  ingress:
    enabled: false
  securityContext:
    fsGroup: 472
    runAsUser: 472
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: local-path
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
prometheus:
  enabled: true
  prometheusSpec:
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi
    retention: 30d
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
          storageClassName: local-path
