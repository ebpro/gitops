alertmanager:
  alertmanagerSpec:
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: default
        group_by: ['alertname', 'namespace', 'cluster']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: default
            matchers:
              - severity =~ "critical|warning"
            group_wait: 10s
            repeat_interval: 1h
          - receiver: null
            matchers:
              - severity = "info"
      receivers:
        - name: default
          webhook_configs:
            - url: http://0.0.0.0:9096/webhook
              send_resolved: true
              max_alerts: 100
        - name: null
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: local-path
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  enabled: true

coreDns:
  enabled: true
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeApiServer:
  enabled: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
  releaseLabel: true

prometheus:
  enabled: true
  prometheusSpec:
    retention: 30d
    retentionSize: 45GB
    enableCompression: true
    walCompression: true
    webEnableRemoteWriteReceiver: true
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
          storageClassName: local-path
    podAnnotations:
      prometheus.io/scrape: "false"

grafana:
  enabled: true
  adminPassword: ""
  existingSecret: grafana-admin-password
  existingSecretKey: admin-password
  initChownData:
    enabled: false
  extraSecretMounts:
    - name: grafana-oidc-secrets
      mountPath: /etc/grafana/secrets
      secretName: grafana-oidc-secrets
      readOnly: true
  grafana.ini:
    auth.generic_oauth:
       allow_assign_grafana_admin: true
       allow_sign_up: true
       allowed_groups: platform-admins,platform-engineers,developers,security-team,qa-team,readonly
       api_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/userinfo
       auth_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/auth
       client_id: grafana
       client_secret: "$__file{/etc/grafana/secrets/CLIENT_SECRET_GRAFANA}"
       enabled: true
       login_attribute_path: email
       name: Keycloak
       name_attribute_path: full_name
       redirect_uri: https://grafana.ebruno.fr/login/generic_oauth
       role_attribute_path: contains(groups,"platform-admins") && "GrafanaAdmin" || contains(groups,"readonly") && "Viewer" || "Editor"
       scopes: openid profile email groups offline_access
       signout_redirect_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.ebruno.fr%2Flogin
       token_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/token
       use_refresh_token: true
    analytics:
       check_for_updates: false
       reporting_enabled: false
    unifiedAlerting:
       enabled: true
    explore:
       enabled: true
    trace:
       enabled: true
    trace.legacy:
       attributes.datasource: 'Prometheus'
    security:
       cookie_secure: true
       cookie_samesite: lax
    server:
      domain: grafana.ebruno.fr
      root_url: https://grafana.ebruno.fr
    log:
      mode: console
      level: warn
  ingress:
    enabled: false
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: local-path
  additionalDataSources:
    - access: proxy
      name: Loki
      type: loki
      url: http://loki.loki.svc.cluster.local:3100
      editable: true
      isDefault: false
    - access: proxy
      name: Tempo
      type: tempo
      url: http://tempo.tempo.svc.cluster.local:3200
      editable: true
      isDefault: false
      jsonData:
        tracesToLogs:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "+1h"
          mapTag:
            enabled: true
            tagName: app
          tags: [app, namespace, pod, container, cluster]
        tracesToMetrics:
          datasourceUid: prometheus
        lokiSearch:
          datasourceUid: loki
    - access: proxy
      name: Alloy
      type: prometheus
      url: http://alloy.alloy.svc.cluster.local:12345
      editable: true
      isDefault: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
        - name: observability
          orgId: 1
          folder: "Observability"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/observability
  dashboards: {}
