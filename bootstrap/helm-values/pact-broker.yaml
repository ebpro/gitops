broker:
  config:
    # In-cluster service URL so CI pact-jvm verification HAL links stay in-cluster
    # (see helm/releases/pact-broker/values.yaml for the full rationale).
    baseUrl: "http://pact-broker.pact-broker.svc:80"
    databaseSslmode: disable
    hidePactflowMessages: true
    logLevel: info
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
database:
  adapter: postgres
  auth:
    existingSecret: pact-broker-db
    existingSecretPasswordKey: user-password
    username: pactbroker
  databaseName: pact_broker
  host: pact-broker-db-rw.pact-broker.svc.cluster.local
  port: "5432"
ingress:
  enabled: false
service:
  type: ClusterIP
