broker:
  config:
    baseUrl: https://pactbroker.ebruno.fr
    databaseSslmode: disable
    hidePactflowMessages: true
    logLevel: info
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
database:
  adapter: postgres
  auth:
    existingSecret: pact-broker-db
    existingSecretPasswordKey: user-password
    username: pactbroker
  databaseName: pact_broker
  host: pact-broker-db-postgresql.pact-broker.svc.cluster.local
  port: "5432"
ingress:
  enabled: true
  className: traefik
  host: pactbroker.ebruno.fr
  tls:
    enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-ovh
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy/fwd-auth@kubernetescrd
service:
  type: ClusterIP
