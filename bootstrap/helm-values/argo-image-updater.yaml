config:
  kube.events: false
  log.level: "info"
  git.user: "ebpro"
  git.email: "gitops@ebpro.dev"
  git.write-back: secret
  git.write-back-method: commit
  git.write-back-secret: argocd/image-updater-creds
  git.commit-message-template: Update {{.images}}

  registries:
    - name: Docker Hub
      api_url: https://registry-1.docker.io
      ping: yes
      defaultns: library
      credentials: secret:argocd/image-updater-creds#.dockerconfigjson
    - name: Harbor
      api_url: https://harbor.ebruno.fr
      ping: no
      insecure: no
      prefix: harbor.ebruno.fr
      credentials: secret:argocd/image-updater-creds#.dockerconfigjson

extraArgs: []

extraEnv: []

createClusterRoles: true

rbac:
  enabled: true
