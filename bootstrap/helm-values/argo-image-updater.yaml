config:
  kube.events: false
  log.level: "info"
  git.user: "ArgoCD Image Updater"
  git.email: "image-updater@argocd"
  git.commit-message-template: |
    Update {{.Image.Name}}: {{.Image.TagVersion}} -> {{.NewImage.TagVersion}}

  registries:
    - name: Docker Hub
      api_url: https://registry-1.docker.io
      ping: yes
      defaultns: library
    - name: Harbor
      api_url: https://harbor.ebruno.fr
      ping: no
      insecure: yes
      prefix: harbor.ebruno.fr

extraArgs: []

extraEnv: []

createClusterRoles: true

rbac:
  enabled: true
