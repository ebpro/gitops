appName: microcks
features:
  async:
    enabled: false
ingresses: true
keycloak:
  enabled: true
  generateCert: true
  ingressAnnotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-ovh
  ingressClassName: traefik
  install: true
  privateUrl: http://microcks-keycloak.microcks.svc.cluster.local:8080
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 768Mi
  url: keycloak-microcks.ebruno.fr
microcks:
  generateCert: false
  ingressAnnotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-ovh
  ingressClassName: traefik
  url: microcks.ebruno.fr
