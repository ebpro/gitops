appName: microcks
features:
  async:
    enabled: false
ingresses: true
keycloak:
  enabled: true
  generateCert: false
  ingressAnnotations:
    cert-manager.io/cluster-issuer: letsencrypt-ovh
  ingressClassName: traefik
  ingressSecretRef: microcks-keycloak-tls
  install: true
  privateUrl: http://microcks-keycloak.microcks.svc.cluster.local:8080
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 768Mi
  url: keycloak-microcks.ebruno.fr
microcks:
  generateCert: false
  ingressAnnotations: {}
  ingressClassName: ""
  url: microcks.ebruno.fr
