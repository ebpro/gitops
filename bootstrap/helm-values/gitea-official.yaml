image:
  registry: docker.io
  repository: gitea/gitea
  tag: 1.26.4
  pullPolicy: IfNotPresent
  rootless: true

serviceAccount:
  create: true

deployment:
  env:
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-postgresql-auth
          key: password

postExtraInitContainers:
  - name: setup-oidc
    image: docker.io/gitea/gitea:1.26.4-rootless
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/gitea/conf/custom
        cat > /data/gitea/conf/custom/oidc.conf << 'EOCONF'
[oauth2_keycloak]
NAME = Keycloak
TYPE = oidc
ICON = keycloak
AUTO_DISCOVER_URL = https://keycloak.ebruno.fr/realms/platform/.well-known/openid-configuration
INSECURE_SKIP_VERIFY_SSL = false
ENABLE_AUTO_REGISTER = true
SHOW_ON_SIGNIN_PAGE = true
EOCONF
        # Now inject client credentials via env var REPLACE script
        sed -i "s|ISSUER|https://keycloak.ebruno.fr/realms/platform|" /data/gitea/conf/custom/oidc.conf
        printf 'CLIENT_ID = gitea\nCLIENT_SECRET = %s\n' "${OIDC_CLIENT_SECRET}" >> /data/gitea/conf/custom/oidc.conf
        echo "OIDC config written to /data/gitea/conf/custom/oidc.conf"
        cat /data/gitea/conf/custom/oidc.conf
    env:
      - name: OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: gitea-oidc-secret
            key: CLIENT_SECRET_GITEA
    volumeMounts:
      - name: data
        mountPath: /data/gitea
        subPath: gitea

gitea:
  admin:
    username: admin
    email: admin@eb
    password: gitea-admin-pwd
    passwordMode: keepUpdated

  config:
    _generals_:
      APP_NAME: Gitea
    database:
      DB_TYPE: postgres
      HOST: gitea-postgresql.gitea.svc.cluster.local:5432
      NAME: gitea
      USER: gitea
    server:
      ROOT_URL: https://gitea.ebruno.fr
      DOMAIN: gitea.ebruno.fr
      HTTP_PORT: 3000
      SSH_LISTEN_PORT: 22
      OFFLINE_MODE: true
      START_SSH_SERVER: true
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: false
    repository:
      DEFAULT_PRIVATE: private

postgresql:
  enabled: false

postgresql-ha:
  enabled: false

valkey:
  enabled: false

valkey-cluster:
  enabled: false

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 3000

persistence:
  enabled: true
  size: 20Gi
  storageClassName: local-path

podSecurityContext:
  fsGroup: 1000
