image:
  registry: docker.io
  repository: gitea/gitea
  tag: 1.26.4
  pullPolicy: IfNotPresent
  rootless: true

serviceAccount:
  create: true

deployment:
  env:
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-postgresql-auth
          key: password

postExtraInitContainers:
  - name: setup-oidc
    image: docker.io/gitea/gitea:1.26.4-rootless
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/gitea/conf/custom
        f=/data/gitea/conf/custom/oidc.conf
        echo "[oauth2_keycloak]" > "$f"
        echo "NAME = Keycloak" >> "$f"
        echo "TYPE = oidc" >> "$f"
        echo "ICON = keycloak" >> "$f"
        echo "AUTO_DISCOVER_URL = https://keycloak.ebruno.fr/realms/platform/.well-known/openid-configuration" >> "$f"
        echo "INSECURE_SKIP_VERIFY_SSL = false" >> "$f"
        echo "ENABLE_AUTO_REGISTER = true" >> "$f"
        echo "SHOW_ON_SIGNIN_PAGE = true" >> "$f"
        echo "CLIENT_ID = gitea" >> "$f"
        echo "CLIENT_SECRET = ${OIDC_CLIENT_SECRET}" >> "$f"
        echo "--- oidc.conf:"; cat "$f"
    env:
      - name: OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: gitea-oidc-secret
            key: CLIENT_SECRET_GITEA
    volumeMounts:
      - name: data
        mountPath: /data/gitea/conf

gitea:
  admin:
    username: admin
    email: admin@eb
    password: gitea-admin-pwd
    passwordMode: keepUpdated

  config:
    _generals_:
      APP_NAME: Gitea
    database:
      DB_TYPE: postgres
      HOST: gitea-postgresql.gitea.svc.cluster.local:5432
      NAME: gitea
      USER: gitea
    server:
      ROOT_URL: https://gitea.ebruno.fr
      DOMAIN: gitea.ebruno.fr
      HTTP_PORT: 3000
      SSH_LISTEN_PORT: 22
      OFFLINE_MODE: true
      START_SSH_SERVER: true
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: false
    repository:
      DEFAULT_PRIVATE: private

postgresql:
  enabled: false

postgresql-ha:
  enabled: false

valkey:
  enabled: false

valkey-cluster:
  enabled: false

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 3000

persistence:
  enabled: true
  size: 20Gi
  storageClassName: local-path

podSecurityContext:
  fsGroup: 1000
