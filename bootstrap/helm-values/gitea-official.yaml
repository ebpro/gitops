image:
  registry: docker.io
  repository: gitea/gitea
  tag: 1.26.4
  pullPolicy: IfNotPresent
  rootless: true

serviceAccount:
  create: true

strategy:
  type: "RollingUpdate"
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

deployment:
  env:
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-postgresql-auth
          key: password
    - name: GITEA_OAUTH_SECRET_0
      valueFrom:
        secretKeyRef:
          name: gitea-oidc-secret
          key: CLIENT_SECRET_GITEA
    - name: GITEA__server__ROOT_URL
      value: https://gitea.ebruno.fr
    - name: GITEA__server__DOMAIN
      value: gitea.ebruno.fr
    - name: GITEA__server__PROTOCOL
      value: http
    - name: GITEA__server__SSH_DOMAIN
      value: gitea.ebruno.fr
    - name: GITEA__service__DISABLE_REGISTRATION
      value: "true"
    - name: GITEA__service__ENABLE_PASSWORD_SIGNIN_FORM
      value: "false"
    - name: GITEA__service__REQUIRE_SIGNIN_VIEW
      value: "true"
    - name: GITEA__webhook__ALLOWED_HOST_LIST
      value: woodpecker-server.ci.svc.cluster.local
    - name: GITEA__oauth2_client__USERNAME
      value: preferred_username
    - name: GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION
      value: "true"
    - name: GITEA__oauth2_client__OPENID_CONNECT_SCOPES
      value: openid email profile
    - name: GITEA__repository__DEFAULT_PRIVATE
      value: private
    - name: GITEA__security__INSTALL_LOCK
      value: "true"
    - name: GITEA__oauth2__ACCESS_TOKEN_EXPIRATION_TIME
      value: "864000"
    - name: GITEA__oauth2__REFRESH_TOKEN_EXPIRATION_TIME
      value: "2160"

gitea:
  admin:
    username: admin
    email: admin@eb
    password: gitea-admin-pwd
    passwordMode: keepUpdated

  oauth:
    - name: Keycloak
      provider: openidConnect
      key: gitea
      autoDiscoverUrl: https://keycloak.ebruno.fr/realms/platform/.well-known/openid-configuration
      scopes: openid email profile


  config:
    _generals_:
      APP_NAME: Gitea
    database:
      DB_TYPE: postgres
      HOST: gitea-postgresql.gitea.svc.cluster.local:5432
      NAME: gitea
      USER: gitea
    server:
      ROOT_URL: https://gitea.ebruno.fr
      DOMAIN: gitea.ebruno.fr
      HTTP_PORT: 3000
      SSH_LISTEN_PORT: 22
      OFFLINE_MODE: false
      START_SSH_SERVER: true
    service:
      DISABLE_REGISTRATION: true
      ENABLE_PASSWORD_SIGNIN_FORM: false
      REQUIRE_SIGNIN_VIEW: true
    webhook:
      ALLOWED_HOST_LIST: woodpecker-server.ci.svc.cluster.local
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
      USERNAME: preferred_username
      OPENID_CONNECT_SCOPES: openid email profile
    repository:
      DEFAULT_PRIVATE: private
    oauth2:
      ACCESS_TOKEN_EXPIRATION_TIME: 864000
      REFRESH_TOKEN_EXPIRATION_TIME: 2160

postgresql:
  enabled: false

postgresql-ha:
  enabled: false

valkey:
  enabled: false

valkey-cluster:
  enabled: false

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 3000

persistence:
  enabled: true
  size: 20Gi
  storageClassName: local-path

podSecurityContext:
  fsGroup: 1000
