image:
  registry: docker.io
  repository: gitea/gitea
  tag: 1.24.5
  pullPolicy: IfNotPresent
  rootless: true

serviceAccount:
  create: true

deployment:
  env:
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-postgresql-auth
          key: password

gitea:
  admin:
    username: admin
    email: admin@eb
    password: gitea-admin-pwd
    passwordMode: keepUpdated

  config:
    _generals_:
      APP_NAME: Gitea
    database:
      DB_TYPE: postgres
      HOST: gitea-postgresql.gitea.svc.cluster.local:5432
      NAME: gitea
      USER: gitea
    server:
      ROOT_URL: https://gitea.ebruno.fr
      DOMAIN: gitea.ebruno.fr
      HTTP_PORT: 3000
      SSH_LISTEN_PORT: 22
      OFFLINE_MODE: true
      START_SSH_SERVER: true
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: false
    repository:
      DEFAULT_PRIVATE: private

postgresql:
  enabled: false

postgresql-ha:
  enabled: false

valkey:
  enabled: false

valkey-cluster:
  enabled: false

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 3000

persistence:
  enabled: true
  size: 20Gi
  storageClassName: local-path

podSecurityContext:
  fsGroup: 1000
