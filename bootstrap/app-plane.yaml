apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: platform
  source:
    repoURL: https://helm.plane.so
    targetRevision: 1.6.0
    chart: plane-ce
    helm:
      releaseName: plane
      valueFiles:
      - https://raw.githubusercontent.com/ebpro/gitops/main/helm/releases/plane/values.yaml?v=5
  destination:
    server: https://kubernetes.default.svc
    namespace: plane
  ignoreDifferences:
  - group: batch
    kind: Job
    jsonPointers:
    - /spec/template
    - /spec/selector
    - /spec/completions
    - /spec/parallelism
    - /spec/backoffLimit
    - /status
    - /metadata/managedFields
    - /metadata/annotations
    - /metadata/resourceVersion
    - /metadata/creationTimestamp
    - /metadata/uid
    - /metadata/ownerReferences
  - group: batch
    kind: CronJob
    jsonPointers:
    - /spec/jobTemplate/spec/template
    - /spec/suspend
    - /status
    - /metadata/managedFields
    - /metadata/annotations
    - /metadata/resourceVersion
    - /metadata/creationTimestamp
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/template
    - /spec/strategy
    - /spec/replicas
    - /spec/revisionHistoryLimit
    - /spec/progressDeadlineSeconds
    - /spec/minReadySeconds
    - /status
    - /metadata/managedFields
    - /metadata/annotations
    - /metadata/resourceVersion
    - /metadata/creationTimestamp
  - group: apps
    kind: StatefulSet
    jsonPointers:
    - /spec/template
    - /spec/strategy
    - /spec/replicas
    - /spec/revisionHistoryLimit
    - /spec/progressDeadlineSeconds
    - /spec/minReadySeconds
    - /status
    - /metadata/managedFields
    - /metadata/annotations
    - /metadata/resourceVersion
    - /metadata/creationTimestamp
  - group: monitoring.coreos.com
    kind: ServiceMonitor
    jsonPointers:
    - /metadata/managedFields
    - /metadata/annotations
    - /metadata/resourceVersion
  - group: monitoring.coreos.com
    kind: PodMonitor
    jsonPointers:
    - /metadata/managedFields
    - /metadata/annotations
    - /metadata/resourceVersion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
