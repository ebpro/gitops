apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: velero
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://charts.velero.io
    chart: velero
    targetRevision: latest
    helm:
      valueFiles:
        - ../releases/velero/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: velero

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
