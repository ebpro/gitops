apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kube-prometheus
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://charts.kube-prometheus.io
    chart: kube-prometheus
    targetRevision: latest
    helm:
      valueFiles:
        - ../releases/kube-prometheus/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
