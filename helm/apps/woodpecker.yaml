apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: woodpecker
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://charts.woodpecker.io
    chart: woodpecker
    targetRevision: latest
    helm:
      valueFiles:
        - ../releases/woodpecker/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: ci

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
