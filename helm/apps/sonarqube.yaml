apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sonarqube
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://charts.sonarqube.io
    chart: sonarqube
    targetRevision: latest
    helm:
      valueFiles:
        - ../releases/sonarqube/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
