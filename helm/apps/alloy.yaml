apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: alloy
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://charts.alloy.io
    chart: alloy
    targetRevision: latest
    helm:
      valueFiles:
        - ../releases/alloy/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
