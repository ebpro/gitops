apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: garage
  namespace: argocd

spec:
  project: platform

    source:
      repoURL: https://garagehq.github.io/garage-helm
      chart: garage
      targetRevision: latest
    helm:
      valueFiles:
        - ../releases/garage/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: garage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
