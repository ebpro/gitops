expose:
  ingress:
    enabled: false
  tls:
    enabled: false
  type: clusterIP
internalTLS:
  enabled: false
database:
  type: external
  external:
    host: harbor-db-rw.harbor.svc.cluster.local
    port: "5432"
    username: postgres
    coreDatabase: registry
    password: ""
    existingSecret: harbor-db-superuser
    sslmode: disable
externalURL: https://harbor.ebruno.fr
persistence:
  enabled: true
  persistentVolumeClaim:
    chartmuseum:
      accessMode: ReadWriteOnce
      size: 10Gi
      storageClass: local-path
    database:
      accessMode: ReadWriteOnce
      size: 20Gi
      storageClass: local-path
    jobservice:
      accessMode: ReadWriteOnce
      size: 5Gi
      storageClass: local-path
    redis:
      accessMode: ReadWriteOnce
      size: 10Gi
      storageClass: local-path
    registry:
      accessMode: ReadWriteOnce
      size: 50Gi
      storageClass: local-path
  resourcePolicy: keep
resources:
  core:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  portal:
    requests:
      cpu: 50m
      memory: 128Mi
core:
  extraEnvVars:
    - name: CORE_AUTH_MODE
      value: oidc_auth
    - name: CORE_OIDC_ENABLED
      value: "true"
    - name: CORE_OIDC_NAME
      value: Keycloak
    - name: CORE_OIDC_CLIENT_ID
      value: harbor
    - name: CORE_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: harbor-oidc-secret
          key: Harboroidcclientsecret
    - name: CORE_OIDC_ENDPOINT
      value: https://keycloak.ebruno.fr/realms/platform
    - name: CORE_OIDC_SCOPE
      value: openid profile email
    - name: CORE_VENDOR
      value: oidc
    - name: CORE_RESTART_TRIGGER
      value: "2026-08-10T09:50"
service:
  type: ClusterIP
