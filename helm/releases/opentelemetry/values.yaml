manager:
  collectorImage:
    repository: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-collector
    tag: "0.109.0"
  targetAllocatorImage:
    repository: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator
    tag: "v0.159.0"
  autoInstrumentationImage:
    java:
      repository: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java
      tag: "2.30.0"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

admissionWebhooks:
  certManager:
    enabled: true
  autoGenerateCert:
    enabled: false
