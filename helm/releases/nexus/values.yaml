env:
  - name: NEXUS_DATASTORE_NEXUS_JDBCURL
    value: jdbc:postgresql://nexus-postgresql.nexus.svc.cluster.local:5432/nexus
  - name: NEXUS_DATASTORE_NEXUS_SEARCHPATH
    value: nexus
  - name: NEXUS_DATASTORE_NEXUS_USERNAME
    valueFrom:
      secretKeyRef:
        key: username
        name: nexus-postgresql-auth
  - name: NEXUS_DATASTORE_NEXUS_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: nexus-postgresql-auth
extraInitContainers:
  - name: db-setup
    image: docker.io/cgr.dev/chainguard/postgres:latest
    command:
      - /bin/sh
      - -c
      - |
        until pg_isready -h nexus-postgresql.nexus.svc.cluster.local -p 5432 -U nexus;
        do echo waiting for postgres; sleep 2; done;
        PGPASSWORD="${NEXUS_PGW}" psql -h nexus-postgresql.nexus.svc.cluster.local -p 5432 -U nexus -d nexus -c CREATE SCHEMA IF NOT EXISTS nexus; -c GRANT ALL ON SCHEMA nexus TO nexus; -c GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA nexus TO nexus;
    env:
      - name: NEXUS_PGW
        valueFrom:
          secretKeyRef:
            key: password
            name: nexus-postgresql-auth
    volumeMounts: []
image:
  pullPolicy: IfNotPresent
  repository: docker.io/sonatype/nexus3
  tag: 3.90.2
ingress:
  enabled: false
install4jAddVmParams: "-Djava.util.prefs.userRoot=${NEXUS_DATA}/javaprefs -Xms4096m -Xmx4096m -XX:MaxDirectMemorySize=8192m"
persistence:
  accessMode: ReadWriteOnce
  enabled: true
  existingClaim: nexus-nexus-repository-manager-data
  retainDeleted: true
  retainScaled: true
  size: 50Gi
  storageClass: local-path
podSecurityContext:
  fsGroup: 200
replicas: 1
resources:
  limits:
    cpu: 4
    memory: 4Gi
  requests:
    cpu: 3400m
    memory: 4Gi
securityContext:
  runAsGroup: 200
  runAsNonRoot: true
  runAsUser: 200
service:
  port: 8081
  type: ClusterIP
