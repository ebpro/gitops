# Nexus3 custom values for PostgreSQL-backed datastore

env:
  - name: NEXUS_DATASTORE_NEXUS_JDBCURL
    value: jdbc:postgresql://nexus-postgresql.nexus.svc.cluster.local:5432/nexus
  - name: NEXUS_DATASTORE_NEXUS_SEARCHPATH
    value: nexus
  - name: NEXUS_DATASTORE_NEXUS_USERNAME
    valueFrom:
      secretKeyRef:
        key: username
        name: nexus-postgresql-auth
  - name: NEXUS_DATASTORE_NEXUS_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: nexus-postgresql-auth

extraInitContainers:
  - name: db-setup
    image: docker.io/library/postgres:16-alpine
    command:
      - /bin/sh
      - -c
      - |
        until pg_isready -h nexus-postgresql.nexus.svc.cluster.local -p 5432 -U nexus; do echo waiting for postgres; sleep 2; done
        psql -h nexus-postgresql.nexus.svc.cluster.local -p 5432 -U nexus -d nexus -c "CREATE SCHEMA IF NOT EXISTS nexus;"
        psql -h nexus-postgresql.nexus.svc.cluster.local -p 5432 -U nexus -d nexus -c "GRANT ALL ON SCHEMA nexus TO nexus;"
        psql -h nexus-postgresql.nexus.svc.cluster.local -p 5432 -U nexus -d nexus -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA nexus TO nexus;"
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      capabilities:
        drop:
          - ALL

image:
  repository: docker.io/sonatype/nexus3
  tag: 3.90.2
  pullPolicy: IfNotPresent

bashImage:
  repository: docker.io/library/bash
  tag: latest
  pullPolicy: IfNotPresent

jdkImage:
  repository: docker.io/eclipse-temurin
  tag: 21-jdk
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: false

install4jAddVmParams: "-Djava.util.prefs.userRoot=${NEXUS_DATA}/javaprefs -Xms4096m -Xmx4096m -XX:MaxDirectMemorySize=8192m"

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 50Gi
  storageClass: local-path
  retainDeleted: true
  retainScaled: true

replicas: 1

podSecurityContext:
  runAsNonRoot: false
  fsGroup: 200
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 200
  runAsGroup: 200

initNonRootSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

initRootSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 0
  runAsGroup: 0
  capabilities:
    drop:
      - ALL

initResources: {}

resources:
  limits:
    cpu: 4
    memory: 4Gi
  requests:
    cpu: 3400m
    memory: 4Gi

license:
  enabled: false

caCerts:
  enabled: false

config:
  enabled: false

plugins: []

chownDataDir: true

logback:
  maxHistory: 30

tailLogs:
  resources: {}

rootPassword:
  secret:
  key: password

commonLabels: {}

imagePullSecrets: []

nameOverride:
fullnameOverride:
serviceAccount:
  create: true
  automountToken: false

automountServiceAccountToken:
updateStrategy: {}
ordinals: {}
podManagementPolicy:
minReadySeconds:
podLabels: {}
podAnnotations: {}
podDisruptionBudget:
  enabled: false
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName:
terminationGracePeriodSeconds:
metrics:
  enabled: false

manualMaintenanceMode:
  enabled: false

httpRoute:
  enabled: false
