# Nexus3 custom values - PostgreSQL-backed datastore (SOTA 2026)
#
# Datastore is configured via environment variables (Sonatype's recommended
# method for containers). A single connection mechanism is used:
#   - NEXUS_DATASTORE_NEXUS_JDBCURL  (literal value)
#   - NEXUS_DATASTORE_NEXUS_USERNAME / _PASSWORD (secret nexus-postgresql-auth)
# The PG driver (postgresql-42.x.jar) is bundled in the image, so no
# extra init step is required for the driver itself.
#
# Fresh datastore bootstrap: prepare-nexus-data wipes the stale H2 artefacts
# (/nexus-data/db, /nexus-data/blobs, /nexus-data/etc/fabric) before Nexus
# boots and creates/migrates its schema in the PostgreSQL `app` database
# (owner: nexus role, pg_trgm extension pre-created).
#
# First boot: the built-in config Job (scripts/configure.sh) applies the
# declarative config below - anonymous browse role plus maven-central
# (proxy), maven-releases (hosted) and the maven-public group.
# NOTE: after a successful run, changing this config requires a new Helm
# release revision (the Job name is revision-scoped; old Jobs are pruned).

image:
  # tag intentionally omitted: the main container image renders as
  # <Chart.AppVersion>-ubi (templates/statefulset.yaml).
  repository: docker.io/sonatype/nexus3
  pullPolicy: IfNotPresent

bashImage:
  repository: docker.io/library/bash
  tag: latest
  pullPolicy: IfNotPresent

jdkImage:
  repository: docker.io/eclipse-temurin
  tag: 21-jdk
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: false

install4jAddVmParams: "-Xms2048m -Xmx2048m -XX:MaxDirectMemorySize=4096m"

# External PostgreSQL datastore (CNPG cluster nexus-db in the nexus namespace,
# compat service nexus-postgresql -> nexus-db-1 primary)
env:
  - name: NEXUS_DATASTORE_NEXUS_JDBCURL
    value: jdbc:postgresql://nexus-postgresql.nexus.svc.cluster.local:5432/app
  - name: NEXUS_DATASTORE_NEXUS_USERNAME
    valueFrom:
      secretKeyRef:
        name: nexus-postgresql-auth
        key: username
  - name: NEXUS_DATASTORE_NEXUS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: nexus-postgresql-auth
        key: password

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 50Gi
  storageClass: local-path
  retainDeleted: true
  retainScaled: true

replicas: 1

podSecurityContext:
  runAsNonRoot: false
  fsGroup: 200
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 200
  runAsGroup: 200

initNonRootSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

initRootSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  capabilities:
    drop:
      - ALL

initResources: {}

# Wipes the previous (H2) datastore so Nexus bootstraps cleanly against
# PostgreSQL, and (re)creates the log files the tail-* sidecars watch.
# Runs as root (pod allows it) then chowns everything to nexus (uid 200).
extraInitContainers:
  - name: prepare-nexus-data
    image: docker.io/library/bash:latest
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -c
      - |
        rm -rf /nexus-data/db /nexus-data/blobs /nexus-data/etc/fabric /nexus-data/etc/nexus.properties /nexus-data/javaprefs
        mkdir -p /nexus-data/etc/fabric /nexus-data/etc/logback /nexus-data/log/tasks /nexus-data/log/audit
        touch /nexus-data/log/tasks/allTasks.log
        touch /nexus-data/log/audit/audit.log
        touch /nexus-data/log/request.log
        chown -R 200:200 /nexus-data
    volumeMounts:
      - name: data
        mountPath: /nexus-data

resources:
  limits:
    cpu: 4
    memory: 6Gi
  requests:
    cpu: 1500m
    memory: 4Gi

license:
  enabled: false

caCerts:
  enabled: false

# Declarative first-boot configuration applied by scripts/configure.sh (Job)
config:
  enabled: true
  anonymous:
    enabled: true
    roles:
      - nx-anonymous
  realms:
    # RUT first, then the default realm as local fallback: RUT covers
    # Keycloak SSO (Gap-Auth), NexusAuthenticatingRealm keeps local
    # Basic auth alive (break-glass admin + CI machine accounts).
    enabled: true
    values:
      - rutauth-realm
      - NexusAuthenticatingRealm
  capabilities:
    # Resource User Token: authenticates by userId only (no header trust
    # from the network - oauth2-proxy rewrites Gap-Auth at the ingress).
    # Payload shape verified via live POST /capabilities on 3.95.1.
    - type: rutauth
      enabled: true
      notes: Keycloak SSO via Resource User Tokens (oauth2-proxy emits Gap-Auth)
      properties:
        httpHeader: Gap-Auth
  ldap:
    enabled: false
  repoCredentials:
    enabled: false
  privileges:
    # 3.95 permission model: repository-view replaces the legacy
    # n3_repository_* types (POST on old types 405). Model verified via
    # live API probes on 3.95.1.
    - id: maven-public-browse
      name: maven-public-browse
      description: Browse access to the maven-public group
      type: repository-view
      actions:
        - BROWSE
      format: maven2
      repository: maven-public
  # NOTE: no role entries reference nx-anonymous - the built-in role is
  # internal/readOnly in 3.95 (PUT 400s) and already grants
  # nx-repository-view-*-*-browse plus read/search to the anonymous user,
  # which covers the maven-public intent.
  #
  # Local roles backing the Keycloak group mapping (applied idempotently by
  # scripts/sso-sync.sh, which mirrors realm group membership onto users):
  #   platform-admins    -> nx-admin (built-in, never defined here)
  #   platform-engineers -> nexus-engineers (deploy)
  #   developers         -> nexus-developers (read/browse)
  #   readonly           -> (unmapped, nx-anonymous covers it)
  roles:
    - id: nexus-engineers
      source: default
      name: nexus-engineers
      description: Build/CI accounts - deploy to hosted maven/nuget repositories
      privileges:
        - nx-search-read
        - nx-repository-view-*-*-read
        - nx-repository-view-*-*-browse
        - nx-repository-view-maven2-maven-releases-edit
        - nx-repository-view-maven2-maven-snapshots-edit
        - nx-repository-view-nuget-nuget-hosted-edit
        - nx-repository-admin-*-*-read
        - nx-repository-admin-*-*-browse
        - nx-repository-admin-*-*-edit
        - nx-repository-admin-*-*-add
      roles: []
    - id: nexus-developers
      source: default
      name: nexus-developers
      description: Developer accounts - read and browse hosted repositories
      privileges:
        - nx-search-read
        - nx-repository-view-*-*-read
        - nx-repository-view-*-*-browse
      roles: []
  # Machine accounts for CI (Woodpecker / gitops-bot). userIds reuse the
  # Keycloak user emails so the RUT Gap-Auth (email) resolves to the same
  # local account used for in-cluster Basic auth (deploys bypass the proxy).
  # Passwords come from Vault via the nexus-ci-credentials ExternalSecret -
  # never stored in git, never touched by sso-sync (protected from prune).
  users:
    - userId: ci-runner@gitops.lan
      firstName: CI
      lastName: Runner
      emailAddress: ci-runner@gitops.lan
      source: default
      status: active
      roles:
        - nexus-developers
        - nexus-engineers
      password:
        secret: nexus-ci-credentials
        key: ci-runner
        volume: user-ci-runner-gitops-lan
    - userId: gitops-bot@platform.local
      firstName: GitOps
      lastName: User
      emailAddress: gitops-bot@platform.local
      source: default
      status: active
      roles:
        - nexus-engineers
      password:
        secret: nexus-ci-credentials
        key: gitops-user
        volume: user-gitops-bot-platform-local
  blobStores: []
  cleanup: []
  repos:
    # Nexus 3.9x repository API model: PUT is a full replacement, so every
    # repo must carry its complete model (storage + type-specific object).
    # Shapes verified against GET /service/rest/v1/repositories on 3.95.1.
    - name: maven-central
      format: maven
      type: proxy
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: false
      proxy:
        remoteUrl: https://repo1.maven.org/maven2
        contentMaxAge: -1
        metadataMaxAge: 1440
        preserveEncodedCharacters: false
      negativeCache:
        enabled: true
        # 15 min: a transient upstream 404 must not poison a GAV for a day
        # (2026-08-21: cold-fetch failure of wildfly-common:2.0.1 blocked the
        # woodpecker build for the full 1440-min TTL).
        timeToLive: 15
      httpClient:
        blocked: false
        autoBlock: false
      maven:
        versionPolicy: RELEASE
        layoutPolicy: STRICT
    - name: maven-releases
      format: maven
      type: hosted
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: false
        # 3.95 renamed legacy ALLOW_UPLOAD to ALLOW_ONCE (no redeploy)
        writePolicy: ALLOW_ONCE
      maven:
        versionPolicy: RELEASE
        layoutPolicy: STRICT
    - name: maven-public
      format: maven
      type: group
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: false
      group:
        memberNames:
          - maven-releases
          - maven-central
  tasks: []
  job:
    # The -ubi variant is UBI9-based (no apk/curl) - the job needs the explicit
    # Alpine variant so the wrapper can install bash+jq+GNU sed+curl at runtime
    # - configure.sh requires bash, jq, GNU sed and curl.
    image:
      repository: docker.io/sonatype/nexus3
      tag: "3.95.1-alpine"
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
    command:
      - /bin/sh
      - -c
    args:
      - apk update && apk add --no-cache --quiet bash jq sed curl && exec bash /scripts/configure.sh
    # 0 = never reap. With the chart default (600) ArgoCD selfHeal re-creates the
    # finished Job every ~10 min, and each run re-applies repo config through the
    # REST API, briefly stopping maven-central and 500-ing concurrent Maven pulls.
    ttlSecondsAfterFinished: 0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

plugins: []

chownDataDir: false

logback:
  maxHistory: 30

tailLogs:
  resources: {}

rootPassword:
  secret: nexus-root-password
  key: password

# Keycloak -> Nexus membership sync (CronJob, templates/cronjob-sso-sync.yaml).
# Mirrors realm group membership into local Nexus users/roles every 15 min:
# create/update the users of mapped groups, prune local users that have
# left every mapped group (protectedUsers are exempt and keep their roles).
# Passwords are never written by this sync - machine accounts are created
# once by the config Job with Vault-backed secrets, human accounts get a
# random local password (they log in via RUT only).
ssoSync:
  enabled: true
  schedule: "*/15 * * * *"
  keycloakUrl: http://keycloak-http.keycloak.svc.cluster.local:80
  keycloakRealm: platform
  groups:
    - group: platform-admins
      role: nx-admin
    - group: platform-engineers
      role: nexus-engineers
    - group: developers
      role: nexus-developers
  protectedUsers:
    - admin
    - anonymous
    - ci-runner@gitops.lan
    - gitops-bot@platform.local
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

commonLabels: {}

imagePullSecrets: []

nameOverride:
fullnameOverride:
serviceAccount:
  create: true
  automountToken: false

automountServiceAccountToken:
updateStrategy: {}
ordinals: {}
podManagementPolicy:
minReadySeconds:
podLabels: {}
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "true"

# Nexus startup with PG schema bootstrap is long; the startup probe gets a
# 20 minute window (10s x 120). Liveness only kicks in after startup
# succeeds; readiness gates endpoint availability.
startupProbe:
  httpGet:
    path: /service/rest/v1/status
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 120
livenessProbe:
  httpGet:
    path: /service/rest/v1/status
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /service/rest/v1/status
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

podDisruptionBudget:
  enabled: false
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName:
terminationGracePeriodSeconds:
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus
    endpointConfig:
      interval: 30s
      scrapeTimeout: 10s

manualMaintenanceMode:
  enabled: false

httpRoute:
  enabled: false
