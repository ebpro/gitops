# Nexus3 custom values - PostgreSQL-backed datastore (SOTA 2026)
#
# Datastore is configured via environment variables (Sonatype's recommended
# method for containers). A single connection mechanism is used:
#   - NEXUS_DATASTORE_NEXUS_JDBCURL  (literal value)
#   - NEXUS_DATASTORE_NEXUS_USERNAME / _PASSWORD (secret nexus-postgresql-auth)
# The PG driver (postgresql-42.x.jar) is bundled in the image, so no
# extra init step is required for the driver itself.
#
# Fresh datastore bootstrap: prepare-nexus-data wipes the stale H2 artefacts
# (/nexus-data/db, /nexus-data/blobs, /nexus-data/etc/fabric) before Nexus
# boots and creates/migrates its schema in the PostgreSQL `app` database
# (owner: nexus role, pg_trgm extension pre-created).
#
# First boot: the built-in config Job (scripts/configure.sh) applies the
# declarative config below - anonymous browse role plus maven-central
# (proxy), maven-releases (hosted) and the maven-public group.
# NOTE: after a successful run, changing this config requires a new Helm
# release revision (the Job name is revision-scoped; old Jobs are pruned).

image:
  # tag intentionally omitted: the main container image renders as
  # <Chart.AppVersion>-ubi (templates/statefulset.yaml).
  repository: docker.io/sonatype/nexus3
  pullPolicy: IfNotPresent

bashImage:
  repository: docker.io/library/bash
  tag: latest
  pullPolicy: IfNotPresent

jdkImage:
  repository: docker.io/eclipse-temurin
  tag: 21-jdk
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: false

install4jAddVmParams: "-Xms2048m -Xmx2048m -XX:MaxDirectMemorySize=4096m"

# External PostgreSQL datastore (CNPG cluster nexus-db in the nexus namespace,
# compat service nexus-postgresql -> nexus-db-1 primary)
env:
  - name: NEXUS_DATASTORE_NEXUS_JDBCURL
    value: jdbc:postgresql://nexus-postgresql.nexus.svc.cluster.local:5432/app
  - name: NEXUS_DATASTORE_NEXUS_USERNAME
    valueFrom:
      secretKeyRef:
        name: nexus-postgresql-auth
        key: username
  - name: NEXUS_DATASTORE_NEXUS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: nexus-postgresql-auth
        key: password

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 50Gi
  storageClass: local-path
  retainDeleted: true
  retainScaled: true

replicas: 1

podSecurityContext:
  runAsNonRoot: false
  fsGroup: 200
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 200
  runAsGroup: 200

initNonRootSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

initRootSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  capabilities:
    drop:
      - ALL

initResources: {}

# Wipes the previous (H2) datastore so Nexus bootstraps cleanly against
# PostgreSQL, and (re)creates the log files the tail-* sidecars watch.
# Runs as root (pod allows it) then chowns everything to nexus (uid 200).
extraInitContainers:
  - name: prepare-nexus-data
    image: docker.io/library/bash:latest
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -c
      - |
        rm -rf /nexus-data/db /nexus-data/blobs /nexus-data/etc/fabric /nexus-data/etc/nexus.properties /nexus-data/javaprefs
        mkdir -p /nexus-data/etc/fabric /nexus-data/etc/logback /nexus-data/log/tasks /nexus-data/log/audit
        touch /nexus-data/log/tasks/allTasks.log
        touch /nexus-data/log/audit/audit.log
        touch /nexus-data/log/request.log
        chown -R 200:200 /nexus-data
    volumeMounts:
      - name: data
        mountPath: /nexus-data

resources:
  limits:
    cpu: 4
    memory: 6Gi
  requests:
    cpu: 1500m
    memory: 4Gi

license:
  enabled: false

caCerts:
  enabled: false

# Declarative first-boot configuration applied by scripts/configure.sh (Job)
config:
  enabled: true
  anonymous:
    enabled: true
    roles:
      - nx-anonymous
  realms:
    enabled: false
  ldap:
    enabled: false
  repoCredentials:
    enabled: false
  privileges:
    - id: maven-public-browse
      name: maven-public-browse
      description: Browse access to the maven-public group
      type: n3_repository_view
      domain: repository
      repositoryPattern: maven-public
      action: browse
  roles:
    - id: nx-anonymous
      name: nx-anonymous
      description: Anonymous read-through access to maven-public
      privileges:
        - maven-public-browse
      roles: []
  users: []
  blobStores: []
  cleanup: []
  repos:
    # Nexus 3.9x repository API model: PUT is a full replacement, so every
    # repo must carry its complete model (storage + type-specific object).
    # Shapes verified against GET /service/rest/v1/repositories on 3.95.1.
    - name: maven-central
      format: maven
      type: proxy
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: false
      proxy:
        remoteUrl: https://repo1.maven.org/maven2
        contentMaxAge: -1
        metadataMaxAge: 1440
        preserveEncodedCharacters: false
      negativeCache:
        enabled: true
        timeToLive: 1440
      httpClient:
        blocked: false
        autoBlock: false
      maven:
        versionPolicy: RELEASE
        layoutPolicy: STRICT
    - name: maven-releases
      format: maven
      type: hosted
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: false
        writePolicy: ALLOW_UPLOAD
      maven:
        versionPolicy: RELEASE
        layoutPolicy: STRICT
    - name: maven-public
      format: maven
      type: group
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: false
      group:
        memberNames:
          - maven-releases
          - maven-central
  tasks: []
  job:
    # The -ubi variant is UBI9-based (no apk/curl) - the job needs the explicit
    # Alpine variant so the wrapper can install bash+jq+GNU sed+curl at runtime
    # - configure.sh requires bash, jq, GNU sed and curl.
    image:
      repository: docker.io/sonatype/nexus3
      tag: "3.95.1-alpine"
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
    command:
      - /bin/sh
      - -c
    args:
      - apk update && apk add --no-cache --quiet bash jq sed curl && exec bash /scripts/configure.sh
    ttlSecondsAfterFinished: 600
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

plugins: []

chownDataDir: false

logback:
  maxHistory: 30

tailLogs:
  resources: {}

rootPassword:
  secret: nexus-root-password
  key: password

commonLabels: {}

imagePullSecrets: []

nameOverride:
fullnameOverride:
serviceAccount:
  create: true
  automountToken: false

automountServiceAccountToken:
updateStrategy: {}
ordinals: {}
podManagementPolicy:
minReadySeconds:
podLabels: {}
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "true"

# Nexus startup with PG schema bootstrap is long; the startup probe gets a
# 20 minute window (10s x 120). Liveness only kicks in after startup
# succeeds; readiness gates endpoint availability.
startupProbe:
  httpGet:
    path: /service/rest/v1/status
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 120
livenessProbe:
  httpGet:
    path: /service/rest/v1/status
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /service/rest/v1/status
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

podDisruptionBudget:
  enabled: false
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName:
terminationGracePeriodSeconds:
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus
    endpointConfig:
      interval: 30s
      scrapeTimeout: 10s

manualMaintenanceMode:
  enabled: false

httpRoute:
  enabled: false
