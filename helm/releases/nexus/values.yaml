# Nexus3 custom values for PostgreSQL-backed datastore
# Clean reinstall - PostgreSQL JDBC driver downloaded via init container

# Nothing here - JDBC configured via init container writing nexus-store.properties

image:
  repository: docker.io/sonatype/nexus3
  tag: 3.94.0-ubi
  pullPolicy: IfNotPresent

bashImage:
  repository: docker.io/library/bash
  tag: latest
  pullPolicy: IfNotPresent

jdkImage:
  repository: docker.io/eclipse-temurin
  tag: 21-jdk
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: false

install4jAddVmParams: "-Xms2048m -Xmx2048m -XX:MaxDirectMemorySize=4096m"

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 50Gi
  storageClass: local-path
  retainDeleted: true
  retainScaled: true

replicas: 1

podSecurityContext:
  runAsNonRoot: false
  fsGroup: 200
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 200
  runAsGroup: 200

initNonRootSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

initRootSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  capabilities:
    drop:
      - ALL

initResources: {}

resources:
  limits:
    cpu: 4
    memory: 6Gi
  requests:
    cpu: 1500m
    memory: 4Gi

license:
  enabled: false

caCerts:
  enabled: false

config:
  enabled: false

plugins: []

chownDataDir: false

logback:
  maxHistory: 30

tailLogs:
  resources: {}

rootPassword:
  secret: nexus-root-password
  key: password

commonLabels: {}

imagePullSecrets: []

nameOverride:
fullnameOverride:
serviceAccount:
  create: true
  automountToken: false

automountServiceAccountToken:
updateStrategy: {}
ordinals: {}
podManagementPolicy:
minReadySeconds:
podLabels: {}
podAnnotations: {}
podDisruptionBudget:
  enabled: false
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName:
terminationGracePeriodSeconds:
metrics:
  enabled: false

manualMaintenanceMode:
  enabled: false

httpRoute:
  enabled: false

# NOTE: Data store descriptor types for Nexus 3.94.0:
# h2-embedded = Embedded H2 database (default)

# Configure Nexus 3.94.0 embedded H2 datastore
extraInitContainers:
  - name: configure-h2-db
    image: docker.io/library/bash:latest
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /nexus-data/etc/fabric /nexus-data/etc/logback /nexus-data/log/tasks /nexus-data/log/audit
        # Create Nexus 3.94.0 datastore descriptor
        cat > /nexus-data/nexus.properties << 'EOF'
        [datastore nexus]
          type=h2-embedded
          user=SA
          password=SA
          properties.algorithm=MD5
          properties.password=SA
          properties.jdbcUrl=jdbc:h2:file:/nexus-data/db/nexus
        EOF
        mkdir -p /nexus-data/db
        touch /nexus-data/log/tasks/allTasks.log
        touch /nexus-data/log/audit/audit.log
        touch /nexus-data/log/request.log
        chown -R 200:200 /nexus-data
    volumeMounts:
      - name: data
        mountPath: /nexus-data
