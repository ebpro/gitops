apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempo-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-ovh
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: tempo.ebruno.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tempo
                port:
                  number: 3100
  tls:
    - hosts:
        - tempo.ebruno.fr
      secretName: tempo-tls
