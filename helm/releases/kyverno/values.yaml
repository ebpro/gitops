cleanUp:
  enabled: true
crds:
  cleanup: false
metricsPrometheusWidget:
  enabled: true
reports:
  enableBroadcast: true

# --- Kyverno engine config (resourceFilters) ----------------------------------
# The node-arm64-arch-taint ClusterPolicy (kubernetes/arc/) needs the Kyverno
# admission webhook to process Node objects so it can re-apply the
# kubernetes.io/arch=arm64:NoSchedule taint on arm64 nodes. Kyverno's default
# resourceFilters exclude `[Node,*,*]`, which would make the admission webhook
# skip Nodes entirely. `resourceFiltersExclude` is a real chart hook (deep-merged
# into the chart default) that removes exactly that one entry, keeping
# `[Node/?*,*,*]` so Node *subresources* (status) stay filtered. excludeGroups
# stays the chart default `system:nodes` (kubelet updates are covered by the
# policy's background rescan instead).
config:
  resourceFiltersExclude:
    - '[Node,*,*]'

# --- No manual ConfigMap patch required ---------------------------------------
# The `resourceFiltersExclude` hook above removes the standalone `[Node,*,*]`
# entry at Helm render time (deep-merged into the chart default), keeping
# `[Node/?*,*,*]` so Node *subresources* (status) stay filtered.
#
# The live `kyverno` ConfigMap IS ArgoCD-managed: ArgoCD owns its `data` keys.
# The `helm.sh/resource-policy: keep` annotation only stops ArgoCD from DELETING
# the CM on prune — it does NOT stop ArgoCD from UPDATING its data. So once the
# `kyverno` app syncs, the live `resourceFilters` is already correct (no
# `[Node,*,*]`). No manual one-off `kubectl patch configmap kyverno` is needed.
