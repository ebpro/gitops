appName: microcks
commonAnnotations:
  instrumentation.opentelemetry.io/inject-java: "true"
features:
  async:
    enabled: false
ingresses: true
keycloak:
  enabled: true
  install: false
  privateUrl: http://keycloak-http.keycloak.svc.cluster.local:80
  url: keycloak.ebruno.fr
  realm: platform
microcks:
  generateCert: false
  ingressAnnotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-ovh
  ingressClassName: traefik
  url: microcks.ebruno.fr
  grpcIngressClassName: traefik
  grpcIngressAnnotations:
    ingress.traefik.io/router.grpc: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-ovh
  env:
    - name: MANAGEMENT_SERVER_PORT
      value: "9091"
    - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
      value: "health,prometheus"
mongodb:
  secretRef:
    secret: microcks-mongodb-connection
    usernameKey: username
    passwordKey: password
