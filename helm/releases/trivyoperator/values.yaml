# trivy-operator 0.33.0 (chart trivy-operator 0.35.0)
# Continuous security for all namespaces: image vulnerabilities, SBOM,
# configuration audit, exposed secrets, RBAC assessment, cluster compliance.

targetWorkloads: "pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob,job"
excludeNamespaces: "arc-runners"

image:
  tag: "0.33.0"

operator:
  namespace: trivy-system
  scanJobTimeout: 10m
  # trivy-server suspends ALL requests hourly during its vuln-DB update and
  # waits for in-flight scans to drain; with 4 concurrent scan jobs the drain
  # stalled ~68min (2026-10-14 00:14→01:14Z) and every overlapping scan
  # FATALed "database not open" (bbolt handle closed under the running scan).
  # Concurrency 1 bounds the suspend window to a single scan; retry delay 5m
  # keeps failed jobs from retrying straight back into the update window.
  scanJobsConcurrentLimit: 1
  scanJobsRetryDelay: 5m
  vulnerabilityScannerEnabled: true
  sbomGenerationEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  exposedSecretScannerEnabled: true
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: true
  builtInTrivyServer: true
  privateRegistryScanSecretsNames:
    link-shortener: harbor-registry-secret

trivy:
  severity: HIGH,CRITICAL
  ignoreUnfixed: true
  timeout: 10m0s
  storageSize: "5Gi"
  storageClassName: local-path
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  server:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi

compliance:
  reportType: summary
  cron: "0 */6 * * *"
  specs:
    - k8s-nsa-1.0
    - k8s-pss-baseline-0.1
    - k8s-cis-1.23
    - k8s-pss-restricted-0.1
