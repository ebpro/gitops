# Plane Helm values — chart plane-ce (https://helm.plane.so)
# Live app secrets (DATABASE_URL/REDIS_URL/AMQP_URL/SECRET_KEY/LIVE_SERVER_SECRET_KEY)
# come from the plane-app-secrets ExternalSecret (Vault: secret/plane).
# SSO env (Gitea OAuth: IS_GITEA_ENABLED/GITEA_HOST/GITEA_CLIENT_*/WEB_URL override)
# is injected at pod admission by Kyverno policy plane-sso-env-patch.
planeVersion: v1.2.0

dockerRegistry:
  enabled: false

# Public entrypoint is the Traefik IngressRoute in kubernetes/ingress/plane-ingress.yaml
ingress:
  enabled: false
  appHost: plane.ebruno.fr

redis:
  local_setup: false

postgres:
  local_setup: false

rabbitmq:
  local_setup: false

env:
  docstore_bucket: uploads

external_secrets:
  app_env_existingSecret: plane-app-secrets

worker:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi

api:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 4Gi

beatworker:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi
