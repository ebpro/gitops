# Plane Helm values — chart plane-ce (https://helm.plane.so)
# Live app secrets (DATABASE_URL/REDIS_URL/AMQP_URL/SECRET_KEY) come from
# the plane-app-secrets ExternalSecret (Vault: secret/plane).
# SSO env (Gitea OAuth: IS_GITEA_ENABLED/GITEA_HOST/GITEA_CLIENT_*) is
# injected at pod admission by Kyverno policy plane-sso-env-patch.
planeVersion: v1.2.0

dockerRegistry:
  enabled: false

# Public entrypoint is the Traefik IngressRoute in kubernetes/ingress/plane-ingress.yaml
ingress:
  enabled: false
  appHost: plane.ebruno.fr

redis:
  local_setup: false

postgres:
  local_setup: false

rabbitmq:
  local_setup: false

env:
  # chart key consumed by plane-live-secrets (redis.local_setup=false path)
  remote_redis_url: redis://plane-redis.plane.svc.cluster.local:6379/0
  docstore_bucket: uploads

external_secrets:
  app_env_existingSecret: plane-app-secrets

worker:
  replicas: 1
  memoryLimit: 4Gi
  cpuLimit: 1000m
  cpuRequest: 250m
  memoryRequest: 1024Mi

api:
  replicas: 1
  memoryLimit: 4Gi
  cpuLimit: 1000m
  cpuRequest: 250m
  memoryRequest: 1024Mi

beatworker:
  replicas: 1
  memoryLimit: 4Gi
  cpuLimit: 1000m
  cpuRequest: 250m
  memoryRequest: 1024Mi
