global:
  enabled: true
  tlsDisable: false
  image:
    repository: hashicorp/vault
    tag: 1.21.2
injector:
  enabled: true
  replicas: 1
server:
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: local-path
  enabled: true
  ha:
    enabled: true
    raft:
      enabled: true
      setNodeId: true
      storageDir: /vault/data
    replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  ui:
    enabled: true
    serviceType: ClusterIP
  extraInitContainers:
    - name: configure-oidc
      image: hashicorp/vault:1.21.2
      command:
        - /bin/sh
        - -ec
        - |
          vault login "$VAULT_ROOT_TOKEN"
          until vault status; do sleep 2; done
          vault auth enable oidc || true
          vault write auth/oidc/config \
            oidc_discovery_url="https://keycloak.ebruno.fr/realms/platform" \
            oidc_client_id="vault" \
            oidc_client_secret="$OIDC_CLIENT_SECRET" \
            default_role="vault-admin"
          vault write auth/oidc/role/vault-admin \
            bound_audiences="vault" \
            user_claim="email" \
            ttl="1h" \
            ttl_max="24h" \
            policies="default" \
            redirect_uri="https://vault.ebruno.fr/oidc/callback"
      env:
        - name: VAULT_ADDR
          value: "http://vault-0.vault-internal:8200"
        - name: VAULT_CLIENT_TIMEOUT
          value: "30"
        - name: VAULT_SKIP_VERIFY
          value: "true"
        - name: VAULT_ROOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: vault-init
              key: admin_token
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: vault-oidc-secrets
              key: OIDC_CLIENT_SECRET
      securityContext:
        capabilities:
          drop: ["ALL"]
