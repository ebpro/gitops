global:
  enabled: true
  tlsDisable: true
injector:
  enabled: true
  replicas: 1
server:
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: local-path
  enabled: true
  ha:
    enabled: true
    raft:
      enabled: true
      setNodeId: true
    replicas: 1
  image:
    repository: hashicorp/vault
    tag: 1.21.2
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  ui:
    enabled: true
  auditStorage:
    enabled: true
    size: 2Gi
    storageClass: local-path
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus
      endpoints:
        - port: "metrics"
          interval: 30s
          scrapeTimeout: 10s
          honorLabels: true
          path: /v1/sys/metrics
          params:
            format:
              - prometheus
    extraContainers:
    - name: vault-unseal
      image: hashicorp/vault:1.21.2
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for Vault API..."

          while ! vault status >/tmp/status.json 2>/dev/null; do
            rc=$?
            if [ "$rc" = "2" ]; then
              break
            fi
            sleep 5
          done

