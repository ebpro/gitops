---
serviceAccount:
  create: true
  automountServiceAccountToken: true

backstage:
  image:
    registry: harbor.ebruno.fr
    repository: library/backstage
    tag: "c8fb97f1f79c3a35f564db1426e048f0f668b888"
    pullPolicy: Always
    pullSecrets:
      - backstage-harbor-pull

  podAnnotations:
    instrumentation.opentelemetry.io/inject-nodejs: "true"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  strategy:
    type: Recreate

  startupProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 5
    failureThreshold: 120

  readinessProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 5

  extraEnvVars:
    - name: BACKSTAGE_JWT
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: BACKSTAGE_JWT

    # DB user stays superuser until the Phase 2 cutover:
    # pluginDivisionMode: schema + dedicated least-priv owner role + data
    # migration of the ~15 per-plugin databases happen atomically with the
    # custom image / OIDC switch.
    - name: APP_CONFIG_backend_database_connection_user
      valueFrom:
        secretKeyRef:
          name: backstage-db-superuser
          key: username

    - name: APP_CONFIG_backend_database_connection_password
      valueFrom:
        secretKeyRef:
          name: backstage-db-superuser
          key: password

    - name: BACKSTAGE_KEYCLOAK_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: BACKSTAGE_KEYCLOAK_CLIENT_ID

    - name: BACKSTAGE_KEYCLOAK_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: BACKSTAGE_KEYCLOAK_CLIENT_SECRET

  extraEnvVarsSecrets:
    - backstage-secrets

  # Inline appConfig (chart renders it to a ConfigMap and checksums it, so
  # config changes roll the pod). The standard OIDC provider is configured
  # here; the custom image ships the stock @backstage OIDC provider only.
  appConfig:
    app:
      title: Platform Developer Portal
      baseUrl: https://backstage.ebruno.fr
      # The image ships a stale frontend build under packages/app/dist/public/
      # (pre-OIDC, guest-only SignInPage). In "protected mode" (dist/public
      # present) unauthenticated users are served from that tree, hiding the
      # OIDC login button. Disable the public entry point so every request is
      # served from the current dist/ build.
      disablePublicEntryPoint: true

    backend:
      baseUrl: https://backstage.ebruno.fr
      listen:
        port: 7007
      reading:
        allow:
          - host: raw.githubusercontent.com
          - host: gitea.ebruno.fr
      auth:
        options:
          debug: false
        keys:
          - secret: ${BACKSTAGE_JWT}
      database:
        client: pg
        connection:
          host: backstage-db-rw.backstage.svc.cluster.local
          port: 5432
          database: backstage
          user: ${APP_CONFIG_backend_database_connection_user}
          password: ${APP_CONFIG_backend_database_connection_password}
          ssl:
            rejectUnauthorized: false
      cors:
        origin: https://backstage.ebruno.fr
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      csp:
        connect-src: ["'self'", "https:"]
        frame-ancestors: ["'self'"]
        img-src: ["'self'", "data:"]
        script-src: ["'self'", "'unsafe-inline'", "'unsafe-eval'"]
        style-src: ["'self'", "'unsafe-inline'"]
      logger:
        logLevel: info

    integrations:
      gitea:
        - host: gitea.ebruno.fr
          token: ${GITEA_TOKEN}
      sonarqube:
        - host: sonarqube.ebruno.fr
          baseUrl: https://sonarqube.ebruno.fr

    frontend:
      baseUrl: https://backstage.ebruno.fr

    catalog:
      rules:
        - allow:
            - kind: Component
            - kind: API
            - kind: Resource
            - kind: System
            - kind: Domain
            - kind: Group
            - kind: Template
            - kind: User
      locations:
        - type: url
          target: https://raw.githubusercontent.com/ebpro/gitops/main/kubernetes/backstage-catalog/entities.yaml

    auth:
      environment: production
      dangerouslyAllowExternalLoginByDefault: true
      session:
        secret: ${BACKSTAGE_JWT}
      providers:
        oidc:
          production:
            metadataUrl: https://keycloak.ebruno.fr/realms/platform/.well-known/openid-configuration
            clientId: ${BACKSTAGE_KEYCLOAK_CLIENT_ID}
            clientSecret: ${BACKSTAGE_KEYCLOAK_CLIENT_SECRET}
            prompt: "auto"
            signIn:
              resolvers:
                # Primary: match OIDC email to User entity profile email (catalog must be loaded)
                - resolver: emailMatchingUserEntityProfileEmail
                # Fallback: match email local-part to entity name (works before catalog user sync)
                - resolver: emailLocalPartMatchingUserEntityName

    scaffolder:
      backend:
        database:
          type: pg
        defaultRemote: origin

    sonarqube:
      baseUrl: https://sonarqube.ebruno.fr

    grafana:
      dashboards:
        - name: Backstage Dashboard
          url: https://grafana.ebruno.fr

    argocd:
      ui:
        baseUrl: https://argocd.ebruno.fr
      backend:
        baseUrl: https://argocd.ebruno.fr/api/v1

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - url: https://kubernetes.default.svc
              name: local-cluster
              authProvider: serviceAccount
              skipTLSVerify: false
      skipConfigValidate: true

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local
