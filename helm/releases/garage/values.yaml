# Garage — S3-compatible object storage (single node, replication factor 1)
# Target: CNPG backups (harbor-db) + future S3 consumers.
# Docs: https://garagehq.deuxfleurs.fr/
#
# Bootstrap (chart v2.3.0): the GARAGE_DEFAULT_* env vars only take effect in
# `--single-node` mode (unreachable via this chart) — so the S3 key and the
# "backups" bucket were created out-of-band via the CLI
# (`garage key import` + `garage bucket create` + `garage bucket allow
# --read --write --owner`), using the creds from secret
# garage-bootstrap-creds. If the meta PVC is ever wiped, repeat the layout
# (assign/apply) and these commands.

garage:
  replicationFactor: "1"
  consistencyMode: "consistent"
  compressionLevel: "1"
  s3:
    api:
      region: "garage"
    web:
      rootDomain: ".web.ebruno.fr"

# NOTE: local-path (node-local disk) — LMDB does not support networked
# filesystems (NFS): metadata store corrupted on first start with nfs-rwx.
# Both storage classes live on the same physical host, so DR posture is
# unchanged; off-site replication remains the real disaster-recovery story.
persistence:
  enabled: true
  meta:
    storageClass: local-path
    size: 5Gi
  data:
    storageClass: local-path
    size: 20Gi

deployment:
  kind: StatefulSet
  replicaCount: 1

image:
  repository: dxflrs/amd64_garage
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

ingress:
  s3:
    api:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-ovh
      hosts:
        - host: garage.ebruno.fr
          paths:
            - path: /
              pathType: Prefix
    web:
      enabled: false

# (no container env: default-key bootstrap is single-node-mode only, see above)

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

readinessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 10
  periodSeconds: 20

livenessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 60
  periodSeconds: 60

monitoring:
  metrics:
    serviceMonitor:
      enabled: true
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
