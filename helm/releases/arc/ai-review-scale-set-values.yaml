# Image pinned by immutable digest sha256:72ac7d9f25940b4f1221b32d5105d10ac3cc3c983f1b2ecf3d31ee9acc4a1c47
# (2026-10-16, Harbor OCI-index digest of the former tag sha-8e38db8 — 2026-10-14
# cosign keyless-signed main build; digest cross-verified via authenticated
# /v2/ manifest HEAD Docker-Content-Digest + Harbor artifacts API, in agreement).
# The human-readable tag sha-8e38db8 remains in git history for context.
# imagePullPolicy IfNotPresent is safe with digest references.
# No job-step container type declared: the vendored chart then renders the bare
# runner container only — no daemon sidecar (untrusted PR code pool; CLI-free per
# preflight 2026-10-14). Omitting the block is render-identical to an explicit
# "none" type (verified via helm template diff, 2026-10-14).
# AI review scale set for code and lecture material review.
# Runs opencode + agents + shared workflow (embedded in the runner image).
# Targeted at the arm64 node (lima-k3s-agent) — same node as ebpro-org-arm.
# Scale-to-zero: no persistent runner; spins up on demand when a workflow
# requests the `best-practices` label.
# 2026-10-23 (wave 2c): ephemeral-storage requested+bounded on the runner (was
# BestEffort). Image already digest-pinned (2026-10-16); no dind sidecar on this
# pool. Satisfies verify-arc-runner-images verifyDigest: true with no image change.
runnerScaleSetName: ebpro-ai-review
githubConfigUrl: https://github.com/ebpro
githubConfigSecret: arc-github-creds
scaleSetLabels:
  - self-hosted
  - linux
  - best-practices
minRunners: 0
maxRunners: 1
controllerServiceAccount:
  namespace: actions-runner-controller
  name: arc-controller
template:
  spec:
    nodeSelector:
      kubernetes.io/arch: arm64
    # Tolerate the arch taint (enforced by Kyverno node-arm64-arch-taint) so the
    # AI review runner pod can land on the tainted arm64 node. Listeners
    # intentionally stay on the x64 node (no toleration added to listenerTemplate).
    tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
    imagePullSecrets:
      - name: docker-hub-registry
      - name: harbor-node-pull
    containers:
      - name: runner
        # Signed main-branch build (run 38552180933) — feat/ai-review-agents is
        # merged into main, so the agents toolchain ships from the main line.
        # Moving-tag era closed; re-pin decision closed.
        image: harbor.ebruno.fr/quarkus-microservices/quarkus-ci-runner@sha256:72ac7d9f25940b4f1221b32d5105d10ac3cc3c983f1b2ecf3d31ee9acc4a1c47
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RESULTS_URL
            value: "http://cache-server.ci.svc:3000/"
        resources:
          requests:
            cpu: 2
            memory: 4Gi
            ephemeral-storage: 5Gi
          limits:
            cpu: 4
            memory: 8Gi
            ephemeral-storage: 10Gi
        # Docker Hub auth for the runner-side docker client. Source: ESO
        # kubernetes/arc/dockerhub-pull-external-secret.yaml → Secret
        # docker-hub-registry (dockerconfigjson), projected as config.json.
        # (ai-review runs CLI-free today; mounted defensively so a future
        # chart dind opt-in needs no second values change.)
        volumeMounts:
          - name: docker-config
            mountPath: /home/runner/.docker
            readOnly: true
    volumes:
      - name: docker-config
        secret:
          secretName: docker-hub-registry
          items:
            - key: .dockerconfigjson
              path: config.json
listenerTemplate:
  spec:
    imagePullSecrets:
      - name: docker-hub-registry
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
