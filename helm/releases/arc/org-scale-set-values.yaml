# x64 org scale set. Right-sized 2026-09-28: min2/max3 -> min1/max1 and runner
# memory 8Gi->4Gi (req) / 24Gi->8Gi (lim) to free ~12 Gi of persistent node
# requests on compute-lsis-2, making room for the scale-to-zero `large` pool
# (see large-scale-set-values.yaml). CPU unchanged.
# 2026-10-12: laptop runner node (pc-bruno-gpu) added as PREFERRED runner node,
# maxRunners 3->4 (laptop absorbed the extra; 4x4Gi still fits compute-lsis-2).
# 2026-10-16: laptop permanently evicted from the cluster — preferred-node
# affinity removed; runners schedule on amd64 nodes (compute-lsis-2) only.
# maxRunners kept at 4 (4x4Gi requests fit compute-lsis-2).
runnerScaleSetName: ebpro-org
githubConfigUrl: https://github.com/ebpro
githubConfigSecret: arc-github-creds
scaleSetLabels:
  - self-hosted
  - linux
  - ebpro-org
  - x64
minRunners: 0
maxRunners: 4
dind:
  image: docker:28-dind
  # 2026-10-13: dind sidecar was unbounded (BestEffort, no requests/limits).
  # Memory limit 3Gi (not 4Gi) so 4 runners x (8Gi runner + 3Gi dind) = 44Gi
  # stays under ~45Gi when the laptop is off and all load lands on compute-lsis-2.
  # No CPU limit — avoid throttling docker builds.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 3Gi
containerMode:
  type: dind
controllerServiceAccount:
  namespace: actions-runner-controller
  name: arc-controller
template:
  spec:
    nodeSelector:
      kubernetes.io/arch: amd64
    # Tolerate the runner-node workload=runner:NoSchedule taint convention
    # (no live node carries it since the 2026-10-16 laptop eviction; kept for
    # a future replacement runner node). Listeners intentionally stay on compute-lsis-2
    # (no toleration in listenerTemplate). A hard node shutdown mid-build
    # fails that job; GitHub re-queues on retry.
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "runner"
        effect: "NoSchedule"
    imagePullSecrets:
      - name: docker-hub-registry
      - name: harbor-node-pull
    containers:
      - name: runner
        image: harbor.ebruno.fr/quarkus-microservices/quarkus-ci-runner:sha-8e38db8
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RESULTS_URL
            value: "http://cache-server.ci.svc:3000/"
        # Note: forcing a GitHub runner scale-set re-registration (to re-read
        # scaleSetLabels) requires deleting the AutoScalingRunnerSet CR (finalizer
        # path) so ArgoCD re-creates it fresh — it is NOT achievable via a
        # pod-template/env change.
        resources:
          requests:
            cpu: 2
            memory: 4Gi
          limits:
            cpu: 4
            memory: 8Gi
listenerTemplate:
  spec:
    imagePullSecrets:
      - name: docker-hub-registry
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
