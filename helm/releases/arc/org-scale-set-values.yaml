# x64 org scale set. Right-sized 2026-09-28: min2/max3 -> min1/max1 and runner
# memory 8Gi->4Gi (req) / 24Gi->8Gi (lim) to free ~12 Gi of persistent node
# requests on compute-lsis-2, making room for the scale-to-zero `large` pool
# (see large-scale-set-values.yaml). CPU unchanged.
# 2026-10-12: pc-bruno-gpu (Dell laptop, amd64, 20 CPU / 64 Gi, taint
# workload=runner:NoSchedule, may be powered off) added as PREFERRED runner
# node: runners land there when up, fall back to compute-lsis-2 when down.
# maxRunners 3->4 (laptop absorbs the extra; 4x4Gi still fits compute-lsis-2).
runnerScaleSetName: ebpro-org
githubConfigUrl: https://github.com/ebpro
githubConfigSecret: arc-github-creds
scaleSetLabels:
  - self-hosted
  - linux
  - ebpro-org
  - x64
minRunners: 0
maxRunners: 4
dind:
  image: docker:28-dind
containerMode:
  type: dind
controllerServiceAccount:
  namespace: actions-runner-controller
  name: arc-controller
template:
  spec:
    nodeSelector:
      kubernetes.io/arch: amd64
    # Soft preference for the runner laptop: when up, runners go there;
    # when off/NotReady, they schedule on compute-lsis-2 as before.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - pc-bruno-gpu
    # Tolerate the laptop's workload=runner:NoSchedule taint (it repels all
    # non-runner pods). Listeners intentionally stay on compute-lsis-2
    # (no toleration in listenerTemplate). A hard node shutdown mid-build
    # fails that job; GitHub re-queues on retry.
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "runner"
        effect: "NoSchedule"
    imagePullSecrets:
      - name: docker-hub-registry
      - name: harbor-registry-secret
    containers:
      - name: runner
        image: harbor.ebruno.fr/quarkus-microservices/quarkus-ci-runner:sha-2d55143
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RESULTS_URL
            value: "http://cache-server.ci.svc:3000/"
        # Note: forcing a GitHub runner scale-set re-registration (to re-read
        # scaleSetLabels) requires deleting the AutoScalingRunnerSet CR (finalizer
        # path) so ArgoCD re-creates it fresh — it is NOT achievable via a
        # pod-template/env change.
        resources:
          requests:
            cpu: 2
            memory: 4Gi
          limits:
            cpu: 4
            memory: 8Gi
listenerTemplate:
  spec:
    imagePullSecrets:
      - name: docker-hub-registry
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
