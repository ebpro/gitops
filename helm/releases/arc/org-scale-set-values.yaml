runnerScaleSetName: ebpro-org
githubConfigUrl: https://github.com/ebpro
githubConfigSecret: arc-github-creds
scaleSetLabels:
  - self-hosted
  - linux
  - ebpro-org
  - x64
minRunners: 2
maxRunners: 3
dind:
  image: docker:28-dind
containerMode:
  type: dind
controllerServiceAccount:
  namespace: actions-runner-controller
  name: arc-controller
template:
  spec:
    nodeSelector:
      kubernetes.io/arch: amd64
    imagePullSecrets:
      - name: docker-hub-registry
      - name: harbor-registry-secret
    containers:
      - name: runner
        image: harbor.ebruno.fr/quarkus-microservices/quarkus-ci-runner:sha-7ade946
        command: ["/home/runner/run.sh"]
        # No-op regeneration marker. Bumping this value forces a new spec.template
        # -> ARC tears down + re-creates the GitHub runner scale set, which re-reads
        # runnerScaleSetLabels. Labels were frozen at the scale set's original
        # registration (x64 id 36 / arm id 37) and a label-only edit never re-pushes
        # them (ARC RunnerSetSpecHash excludes runnerScaleSetLabels). See kubernetes/arc/README.md.
        env:
          - name: ARC_SCALESET_REGEN
            value: "2026-09-23"
        resources:
          requests:
            cpu: 2
            memory: 4Gi
          limits:
            cpu: 4
            memory: 8Gi
listenerTemplate:
  spec:
    imagePullSecrets:
      - name: docker-hub-registry
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
