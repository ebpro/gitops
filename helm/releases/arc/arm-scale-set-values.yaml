# ARM64 scale set for native arm64 builds (no QEMU).
# Mirrors org-scale-set-values.yaml (x64 set); pinned to arm64 nodes.
# minRunners 0: scale-to-zero (the 2026-10-12 laptop-headroom change moved all
# four scale sets to min 0; maxRunners caps: org 4, large 2, arm 2, ai-review 1).
# No warm arm runner — the first arm job after an idle period cold-starts (pod
# schedule + image pull + registration). The arm node (lima-k3s-agent) is a dev
# VM: runners vanish if it reboots.
# 2026-10-23 (wave 2c, supply-chain hardening): runner + dind images pinned by
#   immutable digest; ephemeral-storage requested+bounded on both containers
#   (was BestEffort). No maxRunners change — arm runners land on lima-k3s-agent
#   (~94Gi allocatable), which is not the memory-tight node; the docker:28-dind
#   index digest resolves to the arm64 child there. See org-scale-set-values.yaml
#   header for the full capacity rationale.
runnerScaleSetName: ebpro-org-arm
githubConfigUrl: https://github.com/ebpro
githubConfigSecret: arc-github-creds
scaleSetLabels:
  - self-hosted
  - linux
  - ebpro-org
  - arm64
minRunners: 0
maxRunners: 2
dind:
  # 2026-10-23: pinned by immutable OCI-index digest (was floating tag docker:28-dind).
  # Resolves to the arm64 child on lima-k3s-agent. UNSIGNED by design — not matched
  # by verify-arc-runner-images.
  image: docker:28-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
  # 2026-10-13: bound the dind sidecar. No CPU limit (builds).
  # 2026-10-23: ephemeral-storage requested+bounded (node-DiskPressure protection).
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 15Gi
    limits:
      memory: 4Gi
      ephemeral-storage: 30Gi
containerMode:
  type: dind
controllerServiceAccount:
  namespace: actions-runner-controller
  name: arc-controller
template:
  spec:
    nodeSelector:
      kubernetes.io/arch: arm64
    # Tolerate the arch taint (enforced by Kyverno node-arm64-arch-taint) so the
    # arm runner pod can land on the tainted arm64 node. Listeners intentionally
    # stay on the x64 node (no toleration added to listenerTemplate).
    tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
    imagePullSecrets:
      - name: docker-hub-registry
      - name: harbor-node-pull
    containers:
      - name: runner
        # 2026-10-23: digest-pinned (was :sha-8e38db8) — same 2026-10-14 cosign
        # keyless-signed main build, now immutable. Cross-verified in ai-review values.
        image: harbor.ebruno.fr/quarkus-microservices/quarkus-ci-runner@sha256:72ac7d9f25940b4f1221b32d5105d10ac3cc3c983f1b2ecf3d31ee9acc4a1c47
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RESULTS_URL
            value: "http://cache-server.ci.svc:3000/"
        # Note: forcing a GitHub runner scale-set re-registration (to re-read
        # scaleSetLabels) requires deleting the AutoScalingRunnerSet CR (finalizer
        # path) so ArgoCD re-creates it fresh — it is NOT achievable via a
        # pod-template/env change.
        resources:
          requests:
            cpu: 2
            memory: 4Gi
            ephemeral-storage: 5Gi
          limits:
            cpu: 4
            memory: 16Gi
