# ARM64 scale set for native arm64 builds (no QEMU).
# Mirrors org-scale-set-values.yaml (x64 set); pinned to arm64 nodes.
# minRunners 1: minimum capacity pinned (fleet HA) — one arm runner always
# warm. The arm node (lima-k3s-agent) is a dev VM: runners vanish if it reboots.
runnerScaleSetName: ebpro-org-arm
githubConfigUrl: https://github.com/ebpro
githubConfigSecret: arc-github-creds
scaleSetLabels:
  - self-hosted
  - linux
  - ebpro-org
  - arm64
minRunners: 1
maxRunners: 1
dind:
  image: docker:28-dind
containerMode:
  type: dind
controllerServiceAccount:
  namespace: actions-runner-controller
  name: arc-controller
template:
  spec:
    nodeSelector:
      kubernetes.io/arch: arm64
    imagePullSecrets:
      - name: docker-hub-registry
      - name: harbor-registry-secret
    containers:
      - name: runner
        image: harbor.ebruno.fr/quarkus-microservices/quarkus-ci-runner:sha-7ade946
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 2
            memory: 4Gi
          limits:
            cpu: 4
            memory: 8Gi
listenerTemplate:
  spec:
    imagePullSecrets:
      - name: docker-hub-registry
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
