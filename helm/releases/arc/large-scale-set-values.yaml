# Large x64 scale set for memory-heavy builds (Quarkus/Java + DinD at scale).
# Scale-to-zero: minRunners 0 — no persistent footprint; a runner spins up only
# when a job with the `large` label is dispatched, then scales back to 0 when idle.
# Pinned to big x64 nodes via required nodeAffinity on hostname: compute-lsis-2
# (~55 GiB allocatable) and pc-bruno-gpu (Dell laptop, 20 CPU / 64 Gi, taint
# workload=runner:NoSchedule, may be powered off). The laptop is PREFERRED
# (weight 100) when up; jobs fall back to compute-lsis-2 when it is down.
# 2026-10-12: maxRunners 1->2 to exploit the laptop's headroom. Caveat: with
# the laptop off, the 2nd large runner may stay Pending (jobs wait for it) —
# large is opt-in/scale-to-zero, so this degrades to queueing, never stalls
# the default org pool. Memory 8Gi req / 16Gi lim; CPU unchanged from the org
# pool. NOTE: ARC 0.14.2's AutoscalingRunnerSet CRD has no scaleDownDelay field, so
# idle scale-down timing uses the controller default; a runner with an active job
# is never scaled down (ARC checks for running jobs first), so mid-build is safe.
runnerScaleSetName: ebpro-org-large
githubConfigUrl: https://github.com/ebpro
githubConfigSecret: arc-github-creds
scaleSetLabels:
  - self-hosted
  - linux
  - x64
  - large
minRunners: 0
maxRunners: 2
dind:
  image: docker:28-dind
  # 2026-10-13: bound the dind sidecar. 2 x (16Gi runner + 8Gi dind) = 48Gi
  # max on one node — inside ~55Gi allocatable. No CPU limit (builds).
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 8Gi
containerMode:
  type: dind
controllerServiceAccount:
  namespace: actions-runner-controller
  name: arc-controller
template:
  spec:
    # Pin to big-x64 nodes by hostname (stronger than the org pool's arch
    # nodeSelector): the 8 Gi runner only fits on compute-lsis-2 / pc-bruno-gpu.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - compute-lsis-2
                    - pc-bruno-gpu
        # Prefer the laptop while it is up; falls back to compute-lsis-2.
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - pc-bruno-gpu
    # Tolerate the laptop's workload=runner:NoSchedule taint.
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "runner"
        effect: "NoSchedule"
    imagePullSecrets:
      - name: docker-hub-registry
      - name: harbor-registry-secret
    containers:
      - name: runner
        image: harbor.ebruno.fr/quarkus-microservices/quarkus-ci-runner:sha-2d55143
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RESULTS_URL
            value: "http://cache-server.ci.svc:3000/"
        # Note: forcing a GitHub runner scale-set re-registration (to re-read
        # scaleSetLabels) requires deleting the AutoScalingRunnerSet CR (finalizer
        # path) so ArgoCD re-creates it fresh — it is NOT achievable via a
        # pod-template/env change.
        resources:
          requests:
            cpu: 2
            memory: 8Gi
          limits:
            cpu: 4
            memory: 16Gi
listenerTemplate:
  spec:
    imagePullSecrets:
      - name: docker-hub-registry
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
