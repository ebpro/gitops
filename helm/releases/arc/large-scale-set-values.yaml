# Large x64 scale set for memory-heavy builds (Quarkus/Java + DinD at scale).
# Scale-to-zero: minRunners 0 — no persistent footprint; a runner spins up only
# when a job with the `large` label is dispatched, then scales back to 0 when idle.
# Pinned to the big x64 node via required nodeAffinity on hostname:
# compute-lsis-2 (~55 GiB allocatable).
# 2026-10-12: maxRunners 1->2 to exploit the laptop runner node's headroom.
# 2026-10-16: laptop (pc-bruno-gpu) permanently evicted from the cluster —
# the 2nd large runner may stay Pending if the first saturates the node;
# large is opt-in/scale-to-zero, so this degrades to queueing, never stalls
# the default org pool. Memory 4Gi req / 16Gi lim (requests right-sized
# 2026-10-17); CPU unchanged from the org pool. NOTE: ARC 0.14.2's AutoscalingRunnerSet CRD has no scaleDownDelay field, so
# idle scale-down timing uses the controller default; a runner with an active job
# is never scaled down (ARC checks for running jobs first), so mid-build is safe.
# 2026-10-23 (wave 2c, capacity + supply-chain hardening):
#   * maxRunners 2->1: large pods pin to compute-lsis-2 by hostname — the SAME
#     memory-tight node the org pool uses. Platform memory requests there are
#     ~33.6Gi of ~55.7Gi (60%). With org capped at 2, one large runner (4.5Gi of
#     requests) keeps total concurrent runner requests ~13.5Gi inside headroom;
#     two large + two org (4 pods, 18Gi) was marginal. large is opt-in/scale-to-zero
#     so this only trims peak concurrency; excess `large` jobs queue, never stall org.
#   * ephemeral-storage requested+bounded on runner + dind (was BestEffort) and
#     images pinned by immutable digest — see org-scale-set-values.yaml header.
runnerScaleSetName: ebpro-org-large
githubConfigUrl: https://github.com/ebpro
githubConfigSecret: arc-github-creds
scaleSetLabels:
  - self-hosted
  - linux
  - x64
  - large
minRunners: 0
maxRunners: 1
dind:
  # rootless dind paused 2026-10-17: Ubuntu kernel 6.8.0-142 breaks procfs newinstance mounts (rootless runtimes unbootable). Re-enable via chart dind.rootless once kernel pinned/fixed.
  # 2026-10-23: pinned by immutable OCI-index digest (was floating tag docker:28-dind).
  image: docker:28-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
  # 2026-10-13: bound the dind sidecar. 2 x (16Gi runner + 8Gi dind) = 48Gi
  # max on one node — inside ~55Gi allocatable. No CPU limit (builds).
  # 2026-10-17: REQUESTS right-sized to observed fleet usage (~0.2-0.4Gi/pod
  # actual); LIMITS unchanged (8Gi) so burst headroom for real builds is kept.
  # Frees scheduler room on compute-lsis-2 (request-based oversubscription was
  # starving the rootless canary pod at 9Gi/pod).
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 15Gi
    limits:
      memory: 8Gi
      ephemeral-storage: 30Gi
containerMode:
  type: dind
controllerServiceAccount:
  namespace: actions-runner-controller
  name: arc-controller
template:
  spec:
    # Pin to big-x64 nodes by hostname (stronger than the org pool's arch
    # nodeSelector): the 8 Gi runner only fits on compute-lsis-2.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - compute-lsis-2
    # Tolerate the runner-node workload=runner:NoSchedule taint convention
    # (no live node carries it since the 2026-10-16 laptop eviction; kept for
    # a future replacement runner node).
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "runner"
        effect: "NoSchedule"
    imagePullSecrets:
      - name: docker-hub-registry
      - name: harbor-node-pull
    containers:
      - name: runner
        # 2026-10-23: digest-pinned (was :sha-8e38db8) — same 2026-10-14 cosign
        # keyless-signed main build, now immutable. Cross-verified in ai-review values.
        image: harbor.ebruno.fr/quarkus-microservices/quarkus-ci-runner@sha256:72ac7d9f25940b4f1221b32d5105d10ac3cc3c983f1b2ecf3d31ee9acc4a1c47
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RESULTS_URL
            value: "http://cache-server.ci.svc:3000/"
        # Note: forcing a GitHub runner scale-set re-registration (to re-read
        # scaleSetLabels) requires deleting the AutoScalingRunnerSet CR (finalizer
        # path) so ArgoCD re-creates it fresh — it is NOT achievable via a
        # pod-template/env change.
        # 2026-10-17: REQUEST 8Gi->4Gi (observed usage ~0.2-0.4Gi/pod fleet-wide;
        # 9Gi/pod requests starved scheduling on compute-lsis-2). LIMIT 16Gi
        # kept as-is — burst headroom for memory-heavy Quarkus/Java builds.
        resources:
          requests:
            cpu: 2
            memory: 4Gi
            ephemeral-storage: 5Gi
          limits:
            cpu: 4
            memory: 16Gi
