broker:
  config:
    # Space-separated list of base URLs used to build HAL links / absolute API
    # URLs AND to render UI assets/links. The broker's SetBaseUrl rack middleware
    # (>= v2.79.0) matches the incoming request's scheme+host against this list
    # per request (X-Forwarded headers first, then Host-only, else first entry).
    #
    # Order matters: the FIRST entry is the fallback for requests that match
    # nothing, so the in-cluster URL goes first to keep CI pact-jvm HAL
    # `for-verification` links in-cluster (avoids the public host behind
    # ForwardAuth, which 401s the anonymous verification POST). Public browser
    # requests (via Traefik X-Forwarded-Proto/Host) match the public entry, so
    # UI CSS/JS/links render against https://pactbroker.ebruno.fr instead of the
    # unreachable in-cluster service URL.
    baseUrl: "http://pact-broker.pact-broker.svc:80 https://pactbroker.ebruno.fr"
    databaseSslmode: disable
    hidePactflowMessages: true
    logLevel: info
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
database:
  adapter: postgres
  auth:
    existingSecret: pact-broker-db
    existingSecretPasswordKey: user-password
    username: pactbroker
  databaseName: pact_broker
  host: pact-broker-db-rw.pact-broker.svc.cluster.local
  port: "5432"
ingress:
  enabled: false
service:
  type: ClusterIP
