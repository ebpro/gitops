community:
  enabled: true
extraInitContainers:
  - name: cleanup-branch-plugin
    image: busybox:1.37
    command:
      - sh
      - -c
    args:
      - rm -f /opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-*.jar && echo removed-stale-branch-plugin || echo no-stale-branch-plugin
    volumeMounts:
      - mountPath: /opt/sonarqube/extensions
        name: sonarqube
        subPath: extensions
jdbcOverwrite:
  enabled: true
  jdbcSecretName: sonarqube-db-app
  jdbcSecretPasswordKey: password
  jdbcUrl: jdbc:postgresql://sonarqube-db-rw.sonarqube.svc.cluster.local:5432/app
  jdbcUsername: app
# OTEL instrumentation annotation - OTel operator auto-injects Java agent
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "true"
mcp:
  enabled: true
monitoringPasscodeSecretName: sonarqube-monitoring-password
monitoringPasscodeSecretKey: monitoring-passcode
persistence:
  enabled: true
  size: 20Gi
  storageClass: local-path
prometheusMonitoring:
  podMonitor:
    enabled: true
    interval: 30s
resources:
  limits:
    cpu: 800m
    memory: 6Gi
  requests:
    cpu: 500m
    memory: 2Gi
  # TEMP 2026-09-15 (sonarqube-267-empty-projects): E1 — 26.5.0 community branch plugin stack fully removed (jar + ce/web agents) to test stock 26.7. Branch/PR analysis disabled while this is live.
sonarProperties:
  sonar.security.textblock.cipherType: AES256
  sonar.web.sso.enable: "true"
  sonar.web.sso.loginHeader: "Gap-Auth"
  sonar.web.sso.nameHeader: "Gap-Auth"
  sonar.web.sso.emailHeader: "Gap-Auth"
sonarSecretKey: sonarqube-credentials
startupProbe:
  failureThreshold: 60
  periodSeconds: 10
account:
  adminPasswordSecretName: sonarqube-credentials
