community:
  enabled: true
jdbcOverwrite:
  enabled: true
  jdbcSecretName: sonarqube-db-app
  jdbcSecretPasswordKey: password
  jdbcUrl: jdbc:postgresql://sonarqube-db-rw.sonarqube.svc.cluster.local:5432/app
  jdbcUsername: app
# OTEL instrumentation annotation - OTel operator auto-injects Java agent
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "true"
mcp:
  enabled: true
monitoringPasscodeSecretName: sonarqube-monitoring-password
monitoringPasscodeSecretKey: monitoring-passcode
persistence:
  enabled: true
  size: 20Gi
  storageClass: local-path
plugins:
  install:
    - https://github.com/mc1arke/sonarqube-community-branch-plugin/releases/download/26.5.0/sonarqube-community-branch-plugin-26.5.0.jar
prometheusMonitoring:
  podMonitor:
    enabled: true
    interval: 30s
resources:
  limits:
    cpu: 800m
    memory: 6Gi
  requests:
    cpu: 500m
    memory: 2Gi
  # TEMP 2026-09-14 (sonarqube-267-empty-projects): 26.5.0 web-layer javaagent + web-app zip override removed to isolate 26.7 search regression. CE-side plugin config intentionally unchanged.
sonarProperties:
  sonar.ce.javaAdditionalOpts: -javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-26.5.0.jar=ce
  sonar.security.textblock.cipherType: AES256
  sonar.web.sso.enable: "true"
  sonar.web.sso.loginHeader: "Gap-Auth"
  sonar.web.sso.nameHeader: "Gap-Auth"
  sonar.web.sso.emailHeader: "Gap-Auth"
sonarSecretKey: sonarqube-credentials
startupProbe:
  failureThreshold: 60
  periodSeconds: 10
account:
  adminPasswordSecretName: sonarqube-credentials
