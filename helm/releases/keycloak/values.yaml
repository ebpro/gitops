replicas: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.7.0"
  pullPolicy: Always

serviceAccount:
  create: true
  name: ""
  annotations: {}
  labels: {}

rbac:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get
        - list

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsNonRoot: true

extraEnv: |
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-secrets
        key: adminPassword
  - name: KC_DB
    value: "postgres"
  - name: KC_DB_URL
    value: "jdbc:postgresql://keycloak-db-rw.keycloak.svc.cluster.local:5432/keycloak"
  - name: KC_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-db-app
        key: username
  - name: KC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db-app
        key: password
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_PROXY_HEADERS
    value: xforwarded
  - name: KC_HOSTNAME
    value: "keycloak.ebruno.fr"
  - name: KC_HOSTNAME_STRICT_HTTPS
    value: "false"
  - name: KC_HEALTH_ENABLED
    value: "true"
  - name: KC_METRICS_ENABLED
    value: "true"

extraEnvFrom: ""

extraInitContainers: ""

extraContainers: ""

lifecycleHooks: |

terminationGracePeriodSeconds: 60

clusterDomain: cluster.local

# Keycloak 26.7.0: kc.sh entrypoint handles build automatically on first start
command:
  - /opt/keycloak/bin/kc.sh

args:
  - start
  - --import-realm

priorityClassName: ""

affinity: |
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            {{- include "keycloak.selectorLabels" . | nindent 10 }}
          matchExpressions:
            - key: app.kubernetes.io/component
              operator: NotIn
              values:
                - test
        topologyKey: kubernetes.io/hostname

topologySpreadConstraints:

nodeSelector: {}

tolerations: []

podLabels: {}

podAnnotations:
  secret/restartedAt: "2026-08-18T08:58:00Z"
  instrumentation.opentelemetry.io/inject-java: "true"
  prometheus.io/scrape: "true"
  prometheus.io/port: "9000"
  prometheus.io/path: "/metrics"

livenessProbe: |
  httpGet:
    path: /health/live
    port: 9000
  initialDelaySeconds: 180
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe: |
  httpGet:
    path: /health/ready
    port: 9000
  initialDelaySeconds: 180
  timeoutSeconds: 1
  periodSeconds: 10
  failureThreshold: 3

startupProbe: |
  httpGet:
    path: /health/started
    port: 9000
  initialDelaySeconds: 60
  timeoutSeconds: 10
  failureThreshold: 300
  periodSeconds: 10

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 1
    memory: 4Gi

startupScripts: {}

extraVolumes: |
  - name: realm-import
    configMap:
      name: platform-realm

extraVolumeMounts: |
  - name: realm-import
    mountPath: /opt/keycloak/data/import/platform.json
    subPath: platform.json

# Container port for Quarkus' real management listener (default 9000;
# KC_HTTP_MANAGEMENT_PORT is never set - verified live pod env). The chart's
# built-in `http-management` container port is HARDCODED to 9990 in
# templates/statefulset.yaml (codecentric keycloak 18.0.0 - no value key
# templates it), which is why 6b009e2's service.httpManagementPort=9000 did
# NOT fix the scrape: the Service's named targetPort `http-management` still
# resolved to the 9990 container port -> Endpoints on 9990, connection refused.
extraPorts:
  - name: management
    containerPort: 9000
    protocol: TCP

podDisruptionBudget:
  minAvailable: 1

statefulsetAnnotations: {}

statefulsetLabels: {}

secrets: {}

service:
  annotations: {}
  labels: {}
  type: ClusterIP
  loadBalancerIP: ""
  httpPort: 80
  httpNodePort: null
  httpsPort: 8443
  httpsNodePort: null
  # Reverted to 9990 (chart default alignment). This Service port CANNOT reach
  # Quarkus' management listener: its targetPort is the NAME `http-management`
  # (templates/service-http.yaml), which resolves to the StatefulSet's
  # hardcoded 9990 container port — 6b009e2's 9000 here only moved the Service
  # front-port while Endpoints stayed on 9990 (connection-refused scrapes).
  # The real management listener (9000, probes below already use it) is
  # exposed by the `management` extraPort pair + serviceMonitor.port.
  httpManagementPort: 9990
  httpManagementNodePort: null
  # port 9000 -> NUMERIC targetPort 9000, bypassing the named-port resolution
  # above so the EndpointSlice actually carries 9000 for the scrape.
  extraPorts:
    - name: management
      port: 9000
      targetPort: 9000
      protocol: TCP
      appProtocol: http
  loadBalancerSourceRanges: []
  externalTrafficPolicy: "Cluster"
  sessionAffinity: ""
  sessionAffinityConfig: {}

ingress:
  enabled: false
  ingressClassName: ""
  servicePort: http
  annotations: {}
  labels: {}
  rules: []
  tls: []

networkPolicy:
  enabled: false


postgresql:
  enabled: false
  postgresqlUsername: keycloak
  postgresqlPassword: keycloak
  postgresqlDatabase: keycloak
  networkPolicy:
    enabled: false

serviceMonitor:
  enabled: true
  namespace: keycloak
  labels:
    release: kube-prometheus
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  # `management` = Service extraPort above (port 9000 -> targetPort 9000), the
  # only Service port whose Endpoints hit Quarkus' real management listener.
  # (http-management resolves to the hardcoded 9990 container port.)
  port: management

extraServiceMonitor:
  enabled: false

prometheusRule:
  enabled: true
  namespace: keycloak
  labels:
    release: kube-prometheus
  groups:
    - name: keycloak.rules
      rules:
        - alert: KeycloakDown
          expr: up{job="keycloak"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Keycloak instance down"
            description: "Keycloak has been down for more than 2 minutes."
        - alert: KeycloakHighMemoryUsage
          expr: (process_memory_used_bytes{job="keycloak"} / 1) > 3.5e+9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Keycloak high memory usage"
            description: "Keycloak is using more than 3.5Gi of memory."

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

test:
  enabled: false

persistence:
  enabled: true
  storageClass: "local-path"
  size: 10Gi
