alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: local-path
  enabled: true
coreDns:
  enabled: true
grafana:
  additionalDataSources:
    - access: proxy
      editable: true
      isDefault: false
      name: Loki
      type: loki
      url: http://loki:3100
  adminPassword: ""
  existingSecret: grafana-admin-password
  existingSecretKey: admin-password
  enabled: true
  ingress:
    enabled: false
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: local-path
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
prometheus:
  enabled: true
  prometheusSpec:
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi
    retention: 30d
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
          storageClassName: local-path
