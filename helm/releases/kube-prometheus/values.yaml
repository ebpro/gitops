crds:
  enabled: false

alertmanager:
  # The kube-prometheus-stack chart renders the Alertmanager configuration
  # from `.Values.alertmanager.config` (into Secret
  # alertmanager-kube-prometheus-kube-prome-alertmanager, consumed by
  # prometheus-operator). A `config:` block placed under `alertmanagerSpec`
  # is NOT a field of the Alertmanager CRD and is silently dropped — which
  # left the chart-default `"null"` receiver as the live default route since
  # the chart's render. Keep it at this key.
  # inhibit_rules are copied verbatim from the chart defaults so
  # inhibition/silence behavior is unchanged.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace
      - target_matchers:
          - alertname = InfoInhibitor
    route:
      receiver: matrix
      group_by: ['alertname', 'namespace', 'cluster']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: matrix
          matchers:
            - severity =~ "critical|warning"
          group_wait: 10s
          repeat_interval: 1h
        - receiver: "null"
          matchers:
            - severity = "info"
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: matrix
        webhook_configs:
          - url: http://alertmanager-matrix-webhook.kube-prometheus.svc.cluster.local:8080
            send_resolved: true
            max_alerts: 100
      - name: "null"
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: local-path
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  enabled: true

coreDns:
  enabled: true
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeApiServer:
  enabled: false

# k3s runs kube-proxy without exposing its /metrics endpoint, so the stack's
# kube-proxy scrape never exists and the default `kubernetes-system-kube-proxy`
# rule group (single rule: KubeProxyDown = absent(up{job="kube-proxy"})) fires
# permanently. Disable the whole group — same k3s rationale as the disabled
# control-plane components above. (Enabling kube-proxy metrics would need a
# host-level kube-proxy-config change on every node: out of scope.)
defaultRules:
  rules:
    kubeProxy: false

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  tolerations:
    - key: kubernetes.io/arch
      operator: Equal
      value: arm64
      effect: NoSchedule
  extraArgs:
    - --telemetry-port=8081

  service:
    ports:
      - name: http
        port: 8080
        targetPort: http
      - name: metrics
        port: 8081
        targetPort: metrics

nodeExporter:
  enabled: true
  releaseLabel: true

prometheusOperator:
  tolerations:
    - key: kubernetes.io/arch
      operator: Equal
      value: arm64
      effect: NoSchedule

prometheus:
  enabled: true
  prometheusSpec:
    retention: 7d
    retentionSize: 15GB
    enableCompression: true
    walCompression: true
    enableRemoteWriteReceiver: true
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
          storageClassName: local-path
    podAnnotations:
      prometheus.io/scrape: "false"

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-password
  initChownData:
    enabled: false
  extraEnv:
    - name: GF_AUTH_BASIC_ENABLED
      value: "true"
  extraSecretMounts:
    - name: grafana-oidc-secrets
      mountPath: /etc/grafana/secrets
      secretName: grafana-oidc-secrets
      readOnly: true
  grafana.ini:
    auth.generic_oauth:
       allow_assign_grafana_admin: true
       allow_sign_up: true
       api_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/userinfo
       auth_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/auth
       client_id: grafana
       client_secret: "$__file{/etc/grafana/secrets/CLIENT_SECRET_GRAFANA}"
       enabled: true
       login_attribute_path: email
       name: Keycloak
       name_attribute_path: full_name
       redirect_uri: https://grafana.ebruno.fr/login/generic_oauth
       role_attribute_path: contains(groups,"platform-admins") && "GrafanaAdmin" || contains(groups,"readonly") && "Viewer" || "Editor"
       scopes: openid profile email groups offline_access
       signout_redirect_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.ebruno.fr%2Flogin
       token_url: https://keycloak.ebruno.fr/realms/platform/protocol/openid-connect/token
       use_refresh_token: true
    analytics:
       check_for_updates: false
       reporting_enabled: false
    unifiedAlerting:
       enabled: true
    explore:
       enabled: true
    trace:
       enabled: true
    trace.legacy:
       attributes.datasource: 'Prometheus'
    security:
       cookie_secure: true
       cookie_samesite: lax
    server:
      domain: grafana.ebruno.fr
      root_url: https://grafana.ebruno.fr
    auth:
      disable_login_form: false
    auth.basic:
      enabled: true
    log:
      mode: console
      level: warn
  ingress:
    enabled: false
  persistence:
    enabled: true
    existingClaim: kube-prometheus-grafana
  additionalDataSources:
    - access: proxy
      name: Loki
      type: loki
      url: http://loki.loki.svc.cluster.local:3100
      editable: true
      isDefault: false
    - access: proxy
      name: Tempo
      type: tempo
      url: http://tempo.tempo.svc.cluster.local:3200
      editable: true
      isDefault: false
      jsonData:
        tracesToLogs:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "+1h"
          mapTag:
            enabled: true
            tagName: app
          tags: [app, namespace, pod, container, cluster]
        tracesToMetrics:
          datasourceUid: prometheus
        lokiSearch:
          datasourceUid: loki
  sidecar:
    enableUniqueFilenames: true
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: true
      searchNamespace: ALL
  securityContext:
    fsGroup: 472
    runAsUser: 472
    runAsNonRoot: true
